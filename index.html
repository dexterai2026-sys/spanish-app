        <div class="t"><b>Learn new chunks</b><span>${fresh} left in the collection</span></div>
        <div class="n${fresh?"":" zero"}">${fresh}</div>
      </button>
      <button class="action" data-go="practice">
        <div class="em">\u{1F3AF}</div>
        <div class="t"><b>Practice</b><span>Listen, shadow, quick-fire, conversations</span></div>
        <div class="n${deck?"":" zero"}">4</div>
      </button>
      <button class="action" data-go="browse">
        <div class="em">\u{1F4D6}</div>
        <div class="t"><b>Browse all</b><span>${CHUNKS.length} chunks, phrases &amp; fillers</span></div>
      </button>
    </div>`;
}

/* ----- Daily session -----
   One queue that actually runs all three stages back to back. The modes stay
   the same; the flow just decides what comes next and counts what got done. */
/* How much new material a day. This was five, hardcoded, which puts the whole
   collection two months out and quietly contradicts the promise the app makes
   on its own intro screen. The learner sets the pace instead, and Today says
   where the one they picked actually lands them. */
const PACES = {
  steady:  {label:"Steady",  fresh:5,  words:6,  wordRev:15, build:4, listen:4,  review:20},
  brisk:   {label:"Brisk",   fresh:12, words:12, wordRev:30, build:6, listen:8,  review:40},
  intense: {label:"Intense", fresh:20, words:20, wordRev:45, build:8, listen:12, review:60},
};
const pace = () => PACES[settings.pace] || PACES.brisk;
let flow = null;

/* How far behind the schedule the learner is: everything due that a day at
   this pace cannot clear. Left alone this grows without bound — twelve chunks
   and twelve words a day generate more reviews than forty and thirty can
   absorb, and the overflow is silently dropped while the memory decays. The
   arithmetic never closes, so intake has to yield to it. */
function backlogPressure(){
  const p = pace();
  return Math.max(0, dueCards().length - p.review) + Math.max(0, dueWords().length - p.wordRev);
}
/* Full intake while level, half while slipping, none while properly behind —
   so the deck drains instead of rotting, and the learner is told why. */
function intakeFactor(){
  const over = backlogPressure();
  return over > 40 ? 0 : over > 0 ? 0.5 : 1;
}

function sessionPlan(){
  const p = pace();
  const hold = intakeFactor();
  const review = Math.min(dueCards().length, p.review);
  const fresh  = Math.round(Math.min(newCards().length, p.fresh) * hold);
  /* New words and word reviews get separate allowances, exactly as chunks do.
     Pooling them meant that the moment a dozen words were due, reviews ate the
     whole quota and new vocabulary stopped arriving — permanently. A learner
     would have stalled around thirty words out of five hundred and sixty. */
  const wordRev = Math.min(dueWords().length, p.wordRev);
  const words   = Math.round(Math.min(newWords().length, p.words) * hold);
  const listen  = Object.keys(srs).length >= 4 ? p.listen : 0;
  /* Building sentences is the point of the whole thing, so it belongs in the
     daily session rather than behind a tab. Everything else in the loop is
     recognition; this is the only place the learner produces. */
  const build   = Object.keys(srs).length >= 6 ? p.build : 0;
  /* And the session ends in an actual conversation once there is enough to
     hold one, because holding your end of an exchange is the thing all of
     this is for. */
  const talk    = Object.keys(srs).length >= 20 ? 1 : 0;
  const total   = review + fresh + words + wordRev + build + listen + talk;
  /* Roughly how long that is, so nobody is ambushed by a seventy-item day. */
  const mins = Math.max(1, Math.round(
    (review*8 + fresh*25 + words*12 + wordRev*7 + build*15 + listen*14 + talk*70)/60));
  return {review, fresh, words, wordRev, build, listen, talk, total, mins, hold};
}

/* Days until every remaining chunk has at least been met, at the current
   pace. Shown because "63 days" is the kind of thing a learner should be
   told before they commit, not after. */
/* At the rate intake is actually running, not the rate the pace nominally
   allows. Throttling means the honest answer is usually slower than the pace
   suggests, and quoting the nominal figure is how an app promises a month and
   delivers three. */
function daysToFinish(){
  const left = CHUNKS.length - Object.keys(srs).length;
  if(left <= 0) return 0;
  const rate = pace().fresh * Math.max(intakeFactor(), 0.5);
  return Math.ceil(left / rate);
}

function startSessionFlow(reviewsOnly){
  const base = sessionPlan();
  /* Catch-up clears the backlog and adds nothing to it, so the bar has to
     count reviews alone or it reports a session that is not being run. */
  const p = reviewsOnly
    ? {review:base.review, fresh:0, words:0, wordRev:base.wordRev, build:0, listen:0, talk:0,
       total:base.review + base.wordRev, mins:base.mins, hold:base.hold}
    : base;
  if(!p.total) return go("learn");
  const stages = [];
  if(p.review) stages.push("review");
  if(p.fresh)  stages.push("learn");
  if(p.words || p.wordRev) stages.push("words");
  if(p.build)  stages.push("lab");
  if(p.listen) stages.push("listen");
  if(p.talk)   stages.push("dialogue");
  flow = {stages, i:0,
          left:{learn:p.fresh, words:p.words, wordRev:p.wordRev, lab:p.build, listen:p.listen},
          plan:p, did:{review:0, learn:0, words:0, lab:0, listen:0, talk:0}};
  session = null; earCard = null; learnCard = null;
  go(stages[0]);
}

/* Called when a stage runs out of work. Returns true if the flow handled it. */
function flowNext(){
  if(!flow) return false;
  flow.i++;
  session = null; earCard = null; learnCard = null; wordCard = null; labCard = null;
  learnSpoke = null; wordSpoke = null;
  go(flow.i >= flow.stages.length ? "sessionDone" : flow.stages[flow.i]);
  return true;
}
function flowTick(stage){
  if(!flow) return false;
  flow.did[stage]++;
  if(stage === "review") return false;          // review ends when its queue empties
  return --flow.left[stage] <= 0 ? flowNext() : false;
}
const flowDone = () => flow
  ? flow.did.review + flow.did.learn + (flow.did.words||0) + (flow.did.lab||0) + flow.did.listen + (flow.did.talk||0)
  : 0;
function flowBar(){
  if(!flow) return "";
  return `<div class="progbar" style="margin-bottom:14px"><i style="width:${(flowDone()/flow.plan.total*100).toFixed(0)}%"></i></div>`;
}

function renderSessionDone(){
  const d = flow ? flow.did : {review:0, learn:0, words:0, lab:0, listen:0, talk:0};
  const total = d.review + d.learn + (d.words||0) + (d.lab||0) + d.listen + (d.talk||0);
  const todayNames = studied.ids.map(id => { const c = byId(id); return c && c.chunk; })
                                .filter(Boolean).slice(0, 14);
  /* Quick-fire needs a microphone and a deck worth drilling. Offering it to
     somebody one session in, or on a phone that cannot hear them, sends them
     to a mode that can only fail. */
  const micReady = !recProblem();
  flow = null;
  SFX.done();
  view.innerHTML = header("Done for today", "Session complete") + `
    <div class="card center" style="padding:26px 16px">
      <div class="flame" style="font-size:44px">\u{1F525}</div>
      <div class="score" style="font-size:40px;margin-top:6px">${total}<span> items</span></div>
      <div class="muted tiny" style="margin-top:6px">${liveStreak()} day streak</div>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="bar-row"><span class="nm" style="flex:1;width:auto">\u{1F504} Reviewed</span><span class="v">${d.review}</span></div>
      <div class="bar-row"><span class="nm" style="flex:1;width:auto">\u{2728} Learned</span><span class="v">${d.learn}</span></div>
      <div class="bar-row"><span class="nm" style="flex:1;width:auto">\u{1F4D6} Words</span><span class="v">${d.words || 0}</span></div>
      <div class="bar-row"><span class="nm" style="flex:1;width:auto">\u{1F9EA} Built</span><span class="v">${d.lab || 0}</span></div>
      <div class="bar-row"><span class="nm" style="flex:1;width:auto">\u{1F442} Heard</span><span class="v">${d.listen}</span></div>
      <div class="bar-row"><span class="nm" style="flex:1;width:auto">\u{1F5E3}\u{FE0F} Talked</span><span class="v">${d.talk || 0}</span></div>
    </div>
    ${todayNames.length ? `<div class="card" style="margin-top:12px">
      <p class="sec-label">Today's chunks</p>
      <p class="es" style="font-size:15px;line-height:1.7;margin:0">${todayNames.map(esc).join(" · ")}</p>
    </div>` : ""}
    <div class="stack" style="margin-top:16px">
      ${liveStreak() >= 3 ? `<button class="btn sm" data-share="streak">\u{1F525} Share your ${liveStreak()}-day streak</button>` : ""}
      <p class="tiny muted center" style="margin:0 0 4px">Practice leads with what you just did</p>
      ${micReady && Object.keys(srs).length >= 25
        ? `<button class="btn primary" data-go="drill">\u{26A1} Say them cold</button>
           <button class="btn sm" data-go="lab">\u{1F9EA} Build sentences with them</button>`
        : `<button class="btn primary" data-go="lab">\u{1F9EA} Build sentences with them</button>
           ${micReady ? `<button class="btn sm" data-go="drill">\u{26A1} Say them cold</button>` : ""}`}
      <button class="btn sm ghost" data-go="home">Back to Today</button>
    </div>`;
}

/* ----- Learn ----- */
let learnCard = null;
/* Which card has already been spoken, so a re-render does not repeat it. */
let learnSpoke = null;
function renderLearn(){
  const pool = newCards();
  if(!pool.length){
    view.innerHTML = header("Learn", "New chunks") + empty("\u{1F389}", "You've seen them all",
      "Every chunk is in your deck. Keep reviewing to lock them in.");
    return;
  }
  if(!learnCard || inDeck(learnCard.id)) learnCard = pool[0];
  const c = learnCard;
  const left = pool.length;

  view.innerHTML = header("Learn", flow ? `Session · ${flowDone()+1} of ${flow.plan.total}`
                                        : `${left} new chunk${left===1?"":"s"} left`) + flowBar() + `
    <div class="card">
      <div class="center" style="margin-bottom:10px">${tierBadge(c)}</div>
      <div class="chunk-hero">
        <div class="es">${esc(c.chunk)} ${speakerBtn(c.chunk)}</div>
        <div class="meaning">${esc(c.meaning)}</div>
        ${c.literal ? `<div class="lit">literally: ${esc(c.literal)}</div>` : ""}
      </div>
      ${soundsHtml(c)}
      ${whoSayHtml(c)}
      ${cultureHtml(c)}
    </div>
    ${learnExamplesHtml(c)}
    ${answersHtml(c)}
    <div class="stack" style="margin-top:16px">
      <button class="btn primary" data-learn="add">Got it — keep this one</button>
      <div class="center"><button class="lnk tiny" data-learn="skip">Not this one</button></div>
    </div>`;

  /* The moment you first meet a phrase is exactly when you need to hear it.
     Learn drew four to six speaker buttons and then never said anything,
     while Listen, Shadow and Review all play by themselves — so the one
     screen where a chunk is introduced was the one that read as broken.
     The chunk only, once per card: firing every example would be a wall of
     audio nobody asked for, and the buttons are still there for those. */
  if(learnSpoke !== c.id){ learnSpoke = c.id; speak(c.chunk); }
}

/* ----- Review ----- */
function startSession(){
  const ids = shuffle(dueCards()).slice(0, 25);
  session = {queue: ids, done: 0, total: ids.length, shown: false, card: null};
  nextCard();
}
function nextCard(){
  session.shown = false;
  session.spoke = false;
  const id = session.queue.shift();
  if(!id){ session.card = null; return; }
  const c = byId(id);
  const ex = pickExample(c, srs[id]);
  session.card = {chunk: c, ex, cloze: makeCloze(ex.es, c.chunk)};
}

function renderReview(){
  const due = dueCards().length;
  if(!session && !due){
    const next = Object.values(srs).sort((a,b)=>a.due-b.due)[0];
    const when = next ? relTime(next.due) : null;
    view.innerHTML = header("Review", "Spaced recall") + empty("\u{2705}", "All caught up",
      when ? `Next chunk is ready ${when}.` : "Add some chunks from Learn to start reviewing.");
    return;
  }
  if(!session) startSession();
  if(!session.card){
    const n = session.done;
    session = null;
    view.innerHTML = header("Review", "Session complete") + empty("\u{1F44F}", `${n} chunk${n===1?"":"s"} reviewed`,
      "Nice. Come back when the next batch is due — or go learn something new.") +
      `<button class="btn primary" data-go="learn">Learn new chunks</button>`;
    return;
  }

  const {chunk:c, ex, cloze} = session.card;
  const shown = session.shown;
  const pct = session.total ? (session.done / session.total) * 100 : 0;

  const prompt = cloze
    ? `<div class="cloze">${esc(cloze.before)}<span class="blank${shown?" shown":""}">${esc(cloze.hidden)}</span>${esc(cloze.after)}</div>
       <div class="prompt-en">${esc(ex.en)}</div>`
    : `<div class="prompt-en" style="font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)">How would you say</div>
       <div class="cloze">${esc(ex.en)}</div>
       ${shown ? `<div class="prompt-en" style="color:var(--accent);font-size:19px;font-weight:600;margin-top:12px">${esc(ex.es)}</div>` : ""}`;

  view.innerHTML = header("Review", `${session.done+1} of ${session.total}`) + `
    <div class="progbar"><i style="width:${pct}%"></i></div>
    ${comboBadge()}
    <div class="card" style="padding:22px 16px">${prompt}</div>
    ${shown ? `
      <div class="card">
        <div class="center" style="margin-bottom:8px">${tierBadge(c)}</div>
        <div class="chunk-hero" style="padding-top:0">
          <div class="es" style="font-size:27px">${esc(c.chunk)} ${speakerBtn(ex.es)}</div>
          <div class="meaning">${esc(c.meaning)}</div>
        </div>
        ${soundsHtml(c)}
      </div>` : ""}
    <div style="margin-top:16px">
      ${shown ? gradesHtml(srs[c.id]) : `<button class="btn primary" data-reveal="1">Show answer</button>`}
    </div>`;

  if(shown && !session.spoke){ session.spoke = true; speak(ex.es); }
}

function gradesHtml(st){
  const g = [["again","Again"],["hard","Hard"],["good","Good"],["easy","Easy"]];
  return `<div class="grades">` + g.map(([k,label]) =>
    `<button class="grade ${k}" data-grade="${k}"><b>${label}</b><span>${previewInterval(st, GRADE[k])}</span></button>`
  ).join("") + `</div>`;
}

function relTime(ts){
  const d = (ts - Date.now()) / DAY;
  if(d <= 0) return "now";
  if(d < 1/24) return "in a few minutes";
  if(d < 1) return "in " + Math.round(d*24) + "h";
  if(d < 2) return "tomorrow";
  return "in " + Math.round(d) + " days";
}

/* ----- Practice hub ----- */
function renderPractice(){

  const modes = [
    ["words",   "\u{1F4D6}", "Words",       "Everyday vocabulary, scheduled like chunks", `${Object.keys(vsrs).length}/${WORDS.length}`],
    ["lab",     "\u{1F9EA}", "Sentence Lab","Build a sentence from parts — the method", `${labPatternCount()} patterns`],
    ["listen",  "\u{1F442}", "Listen",      "Understand it with no text on screen", heard ? `${heard} trained` : "Open to start"],
    ["shadow",  "\u{1F3A7}", "Shadow",      "Read it aloud, scored by the mic",     `${totals.shadowReps} said out loud`],
    ["drill",   "\u{26A1}",  "Quick-fire",  "Produce it cold in five seconds",      `${totals.drills || 0} drilled`],
    ["dialogue","\u{1F5E3}\u{FE0F}", "Conversations", "Hold your end of a real exchange", `${Object.keys(dialogDone).length}/${DIALOGUES.length} done`],
  ];

        </button>`).join("")}

    ${!deck ? `<p class="tiny muted center" style="margin-top:18px">

/* ----- Words -----
   Due words first, then new ones. A new word is shown with its article and
   spoken; a due one asks for recall from the English before revealing, and is
   graded on the same four buttons as a chunk, through the same scheduler. */
let wordCard = null, wordShown = false;
/* Word id + phase, so a word speaks when new and again when revealed. */
let wordSpoke = null;

function nextWord(){
  wordShown = false;
  const due = dueWords();
  const canRev = !flow || flow.left.wordRev > 0;
  const canNew = !flow || flow.left.words > 0;
  if(due.length && canRev){
    const w = wordById(shuffle(due)[0]);
    /* Half of reviews ask for production against three real alternatives from
       the same domain, graded objectively. Self-grading alone lets "I sort of
       knew that" pass as recall, which is how a deck stays green while the
       learner stays unable to produce anything. */
    const siblings = WORDS.filter(x => x.dom === w.dom && x.id !== w.id);
    const produce = siblings.length >= 3 && Math.random() < 0.5;
    wordCard = {w, review: true, produce,
                options: produce ? shuffle([w, ...shuffle(siblings).slice(0,3)]) : null,
                pick: null};
    return;
  }
  if(canNew){
    const fresh = newWords();
    if(fresh.length){ wordCard = {w: fresh[0], review: false}; return; }
  }
  /* Outside a session there is no quota to respect, so keep going on whatever
     is left rather than stopping at an arbitrary line. */
  if(!flow && due.length){ wordCard = {w: wordById(shuffle(due)[0]), review: true}; return; }
  wordCard = null;
}

/* Words carry two counters, so the stage ends when both are spent. */
function wordTick(isReview){
  if(!flow) return false;
  flow.did.words++;
  if(isReview) flow.left.wordRev--; else flow.left.words--;
  return (flow.left.wordRev <= 0 && flow.left.words <= 0) ? flowNext() : false;
}

function renderWords(){
  if(!wordCard) nextWord();
  if(!wordCard && flow) return flowNext();
  if(!wordCard){
    view.innerHTML = header("Words", "Vocabulary") + empty("\u{1F4D6}", "Nothing waiting",
      "Every word is scheduled. Come back when some are due, or learn more chunks.");
    return;
  }
  const {w, review} = wordCard;
  const d = DOMAIN[w.dom];
  const left = flow ? flow.left.words : null;

  view.innerHTML = header("Words", flow ? `Session · ${flowDone()+1} of ${flow.plan.total}`
                                        : (review ? `${dueWords().length} due` : "New word")) + flowBar() + `
    <div class="card center">
      <div class="center" style="margin-bottom:10px">
        <span class="badge">${d.em} ${esc(d.label)}</span>
        ${review ? `<span class="badge tier2">${wordCard.produce ? "produce" : "recall"}</span>`
                 : `<span class="badge tier1">new</span>`}
      </div>
      ${review ? `
        <div class="chunk-hero">
          <div class="meaning" style="font-size:19px">${esc(w.en)}</div>
          ${(wordShown || wordCard.pick) ? `<div class="es" style="margin-top:10px">${esc(w.es)} ${speakerBtn(w.es)}</div>`
                      : `<div class="es" style="margin-top:10px;color:var(--faint)">— — —</div>`}
        </div>`
      : `
        <div class="chunk-hero">
          <div class="es">${esc(w.es)} ${speakerBtn(w.es)}</div>
          <div class="meaning">${esc(w.en)}</div>
        </div>`}
    </div>

    ${review && wordCard.produce ? `
      <p class="sec-label" style="margin:18px 0 8px">Which one is it?</p>
      <div class="stack">
        ${wordCard.options.map(o => {
          let cls = "btn opt es-text";
          if(wordCard.pick){
            if(o.id === w.id) cls += " opt-right";
            else if(o.id === wordCard.pick) cls += " opt-wrong";
            else cls += " opt-dim";
          }
          return `<button class="${cls}" data-wpick="${o.id}">${esc(o.es)}</button>`;
        }).join("")}
      </div>
      ${wordCard.pick ? `<div class="stack" style="margin-top:16px">
        <button class="btn primary" data-word="next">Next</button></div>` : ""}`
    : review && !wordShown ? `
      <div class="stack" style="margin-top:16px">
        <button class="btn primary" data-word="show">Show the word</button>
      </div>`
    : review ? `
      <p class="sec-label" style="margin:18px 0 8px">How did that go?</p>
      <div class="grades">
        ${["again","hard","good","easy"].map(g => `
          <button class="btn grade ${g}" data-wgrade="${g}">${g[0].toUpperCase()+g.slice(1)}</button>`).join("")}
      </div>`
    : `
      <div class="stack" style="margin-top:16px">
        <button class="btn primary" data-word="add">Got it — keep this one</button>
      </div>`}
    ${left != null ? `<p class="tiny muted center" style="margin-top:10px">${left} left in this session</p>` : ""}`;

  /* Same rule Review already follows: speak once the Spanish is on screen,
     never while it is still the thing being recalled. */
  const revealed = !review || wordShown || wordCard.pick;
  const spokeKey = w.id + (review ? ":shown" : ":new");
  if(revealed && wordSpoke !== spokeKey){ wordSpoke = spokeKey; speak(w.es); }
}

/* ----- Sentence Lab: the plug-in method -----
   Build it drills one frame at a time. This builds a whole sentence from
   parts, in order, with the slots named on screen — so what gets learned is
   the assembly rule rather than any particular sentence. The same three
   presses produce "I want to eat right now" and "can you help me tomorrow",
   which is the point: it is one method, not a list. */
const LAB_ROUND = 6;
let labCard = null, labRound = null;

function pickFrom(list, notEs){
  const pool = notEs ? list.filter(x => x.es !== notEs) : list;
  return pool[Math.floor(Math.random()*pool.length)];
}

function buildLabCard(){
  /* Weighted to what the learner said they were here for: a goal pattern is
     three times as likely to come up as a universal one, so someone learning
     to talk about faith builds sentences about faith rather than about
     buying things. Universal shapes still appear, because every conversation
     needs them whatever it is about. */
  const mine = PATTERNS.filter(p => p.goal && myGoals.indexOf(p.goal) !== -1);
  const universal = PATTERNS.filter(p => !p.goal);
  /* A pattern the learner can fill from their own vocabulary is worth seeing
     twice as often, because that round doubles as vocabulary review and is
     what turns a studied word into a usable one. Only counts once they know
     enough words for the choice to be real. */
  const usable = PATTERNS.filter(p =>
    p.slots.some(sl => sl.vocab && vocabOptions(sl.vocab).length >= 3));
  const bag = universal.concat(mine, mine, mine, usable);
  const pat = bag[Math.floor(Math.random()*bag.length)];

  const steps = [];
  const chosen = [];
  pat.slots.forEach(slot => {
    /* An optional slot is skipped half the time, so the same pattern gives
       both the short sentence and the fuller one. */
    if(slot.optional && Math.random() < 0.5){ chosen.push(null); return; }
    /* Prefer the learner's own vocabulary when the slot allows it and they
       know enough for the choice to be real; otherwise the pattern's own. */
    const mine = vocabOptions(slot.vocab);
    const bank = mine.length >= 3 ? mine : slot.opts;
    const right = bank[Math.floor(Math.random()*bank.length)];
    chosen.push(right);
    const others = shuffle(bank.filter(o => o.es !== right.es)).slice(0, 2);
    steps.push({label: slot.label, right, options: shuffle([right, ...others])});
  });

  labCard = {pat, chosen, steps, at:0, picked:[], wrong:0,
             target: patternSentence(pat, chosen)};
}

/* How many patterns this learner will actually see, so the hub reports what
   is on offer to them rather than the size of the whole file. */
function labPatternCount(){
  return PATTERNS.filter(p => !p.goal || myGoals.indexOf(p.goal) !== -1).length;
}

function startLabRound(){ labRound = {done:0, clean:0}; buildLabCard(); }

function answerLab(es){
  const step = labCard.steps[labCard.at];
  if(!step) return;
  if(es !== step.right.es){ labCard.wrong++; gotItWrong(); render(); return; }
  /* Show the surface the finished sentence will use, so the line being built
     never disagrees with the line that gets spoken. */
  labCard.picked.push({es: step.right.es});
  /* Using a word you owed a review on is a review. Only credits a due one, so
     a round cannot be farmed to keep the whole deck perpetually fresh. */
  if(step.right.wid && vsrs[step.right.wid] && vsrs[step.right.wid].due <= Date.now()){
    vsrs[step.right.wid] = schedule(vsrs[step.right.wid], GRADE.good);
    saveVsrs();
  }
  labCard.at++;
  if(labCard.at >= labCard.steps.length){
    if(!labCard.wrong && labRound) labRound.clean++;
    gotItRight();
    recordSkill("vocabulary", !labCard.wrong, 1);
    speak(labCard.target.es);
  }else{
    SFX.right();
  }
  render();
}

function nextLab(){
  if(flow){
    labCard = null;
    if(flowTick("lab")) return;
    buildLabCard();
    render(); return;
  }
  labRound.done++;
  if(labRound.done >= LAB_ROUND){ render(); return; }
  buildLabCard();
  render();
}

function renderLab(){
  if(flow){
    if(!labCard) buildLabCard();
    return renderLabCard(true);
  }
  if(!labRound) startLabRound();

  if(labRound.done >= LAB_ROUND){
    view.innerHTML = header("Sentence Lab", "Round done") + `
      <div class="card center">
        <div style="font-size:42px">${labRound.clean >= 5 ? "\u{1F389}" : labRound.clean >= 3 ? "\u{1F44D}" : "\u{1F4AA}"}</div>
        <h2 style="margin:6px 0 2px">${labRound.clean} of ${LAB_ROUND} clean</h2>
        <p class="muted tiny">built from parts, first try</p>
      </div>
      <div class="stack" style="margin-top:16px">
        <button class="btn primary" data-lab="again">Another round</button>
        <button class="btn sm ghost" data-go="practice">Back to practice</button>
      </div>`;
    return;
  }

  return renderLabCard(false);
}

function renderLabCard(inFlow){
  const c = labCard;
  const done = c.at >= c.steps.length;
  const soFar = [esc(c.pat.lead.es)].concat(c.picked.map(x => esc(x.es))).join(" ");
  const step = c.steps[c.at];

  view.innerHTML = header("Sentence Lab", inFlow ? `Session · ${flowDone()+1} of ${flow.plan.total}`
                                                 : `${labRound.done + 1} of ${LAB_ROUND}`)
    + (inFlow ? flowBar() : "") + `
    <div class="card center">
      <p class="sec-label" style="margin:0 0 8px">Build this</p>
      <div style="font-size:18px;margin-bottom:12px">${esc(c.target.en)}</div>
      <div class="lab-line">
        ${soFar ? `<span class="lab-built">${soFar}</span>` : ""}
        ${!done ? `<span class="slot">${esc(step.label)}</span>` : ""}
        ${done && c.pat.lead.es.charAt(0) === "¿" ? "?" : ""}
      </div>
      ${done ? `<p class="muted tiny" style="margin:10px 0 0">${esc(c.target.es)}</p>` : ""}
    </div>

    <div class="lab-formula">
      <span class="did">${esc(c.pat.lead.en)}</span><i>+</i>${c.steps.map((s,i) => `<span class="${i === c.at ? "on" : i < c.at ? "did" : ""}">${esc(s.label)}</span>`).join("<i>+</i>")}
    </div>

    ${!done ? `
      <p class="sec-label" style="margin:16px 0 8px">Pick the ${esc(step.label)}</p>
      <div class="stack">
        ${step.options.map(o => `<button class="btn opt es-text" data-lab-pick="${esc(o.es)}">${esc(o.es)}
          <span class="tiny muted"> — ${esc(String(o.en).replace(/^—\s*/, ""))}</span></button>`).join("")}
      </div>`
    : `<div class="stack" style="margin-top:16px">
        ${speakerBtn(c.target.es)}
        <button class="btn primary" data-lab="next">Next</button>
       </div>`}`;
}

/* ----- Listen: audio-first recognition with a speed ramp ----- */
/* Reading the text while hearing it teaches reading. Hiding the text is the
   only way to train the ear for fast, reduced Mexican speech. */
/* Wrong options have to be about as long as the right one. Otherwise "When?"
   sits beside three full sentences and the answer is visible without hearing
   anything — which was true of a third of items, and quietly promoted people
   up the speed ramp for recognising sentence shapes rather than Spanish. */
function nearLength(right, pool, n){
  const target = right.length;
  const uniq = [];
  pool.forEach(x => { if(x !== right && uniq.indexOf(x) === -1) uniq.push(x); });
  return uniq
    .map(x => ({x, d: Math.abs(x.length - target)}))
    .sort((a,b) => a.d - b.d)
    .slice(0, Math.max(n * 3, 8))          // a near band, then shuffled for variety
    .sort(() => Math.random() - 0.5)
    .slice(0, n)
    .map(o => o.x);
}

const EAR_RATES = [0.7, 0.85, 1.0, 1.15];
const EAR_LABELS = ["slow", "easy", "normal", "fast"];
const earLevel = id => Math.min(EAR_RATES.length - 1, ears[id] || 0);

/* Practice used to top its queue up silently, so it ran until you closed it.
   A round has a finish line, a score, and a decision to carry on. */
const EAR_ROUND = 10;
let earQ = null, earCard = null, earPick = null, earPlayed = null;
let earScore = {right:0, total:0}, earRoundSize = 0;

function startEarRound(){
  const pool = Object.keys(srs);
  const lead = practicePool().recent.filter(id => pool.indexOf(id) !== -1);
  const ordered = lead.concat(shuffle(pool.filter(id => lead.indexOf(id) === -1)));
  earQ = ordered.slice(0, Math.min(EAR_ROUND, pool.length));
  earRoundSize = earQ.length;
  earScore = {right:0, total:0};
  earCard = null;
}

function buildEarCard(){
  const id = earQ.shift();
  const c = byId(id);

  /* Where a chunk is a question we know the replies to, a third of its turns
     play one of those instead. Understanding the answer is the harder half
     and the half this app never trained, and the wrong options are other real
     replies, so it cannot be passed by picking the only plausible sentence. */
  if(c.answers && Math.random() < 0.34){
    const ans = c.answers[Math.floor(Math.random()*c.answers.length)];
    const wrongA = nearLength(ans.en, ALL_ANSWERS.filter(a => a.en !== ans.en).map(a => a.en), 3);
    earCard = {c, ex: ans, reply: true, options: shuffle([ans.en, ...wrongA])};
    earPick = null;
    earPlayed = null;
    return;
  }

  const ex = pickExample(c, srs[c.id]);
  const sameCat = CHUNKS.filter(o => o.id !== id && o.category === c.category).map(o => o.examples[0].en);
  const anyOther = CHUNKS.filter(o => o.id !== id).map(o => o.examples[0].en);
  let wrong = nearLength(ex.en, sameCat, 3);
  if(wrong.length < 3) wrong = nearLength(ex.en, sameCat.concat(anyOther), 3);
  while(wrong.length < 3){
    const r = CHUNKS[Math.floor(Math.random()*CHUNKS.length)];
    if(r.id !== id && !wrong.includes(r.examples[0].en)) wrong.push(r.examples[0].en);
  }
  earCard = {c, ex, options: shuffle([ex.en, ...wrong])};
  earPick = null;
  earPlayed = null;
}

function renderListen(){
  /* Never quiz a beginner on chunks they've never met — that's a guess, not
     listening practice. */
  if(!Object.keys(srs).length){
    view.innerHTML = header("Listen", "Train your ear") +
      empty("\u{1F442}", "Learn a few chunks first",
            "Then you'll hear them with no text on screen, speeding up as you get them.") +
      `<button class="btn primary" data-go="learn">Learn some chunks</button>`;
    return;
  }
  if(!earQ) startEarRound();
  if(!earCard){
    if(!earQ.length){
      /* A daily session sets its own length, so keep feeding it. */
      if(flow) startEarRound(); else return renderEarDone();
    }
    buildEarCard();
  }
  const {c, ex, options} = earCard;
  const lvl = earLevel(c.id);
  const answered = earPick !== null;
  const right = answered && earPick === ex.en;

  view.innerHTML = header("Listen", flow ? `Session · ${flowDone()+1} of ${flow.plan.total}`
                                         : `${earScore.total+1} of ${earRoundSize} · ${EAR_LABELS[lvl]} speed`)
    + flowBar() + comboBadge() + `
    <div class="card center" style="padding:26px 16px">
      <button class="spk" style="width:76px;height:76px;font-size:30px" data-ear="play">\u{1F50A}</button>
      <div class="tiny muted" style="margin-top:12px">${answered ? "" : "Tap to hear it again"}</div>
      <div class="speed-pips">${EAR_RATES.map((r,i) =>
        `<span class="pip${i <= lvl ? " on" : ""}" title="${r}x"></span>`).join("")}</div>
      ${answered ? `
        <div class="es" style="font-size:21px;font-weight:650;margin-top:14px;line-height:1.35">${esc(ex.es)}</div>
        <div class="muted tiny" style="margin-top:6px">${esc(c.chunk)} — ${esc(c.meaning)}</div>`
      : `<button class="btn ghost sm" style="margin-top:14px;width:auto;display:inline-flex" data-ear="slow">\u{1F422} Slower</button>`}
    </div>

    ${earCard.reply ? `<p class="tiny center" style="margin:14px 0 0;color:var(--teal)">
       You asked <b>${esc(earCard.c.chunk)}</b> — this is the answer</p>` : ""}
    <p class="sec-label" style="margin:18px 0 8px">What did you hear?</p>
    <div class="stack">
      ${options.map(o => {
        let cls = "";
        if(answered){
          if(o === ex.en) cls = " opt-right";
          else if(o === earPick) cls = " opt-wrong";
          else cls = " opt-dim";
        }
        return `<button class="btn opt${cls}" ${answered ? "" : `data-ear-pick="${esc(o)}"`}>${esc(o)}</button>`;
      }).join("")}
    </div>

    ${answered ? `
      <div class="card center" style="margin-top:14px">
        <b style="color:${right ? "var(--green)" : "var(--red)"}">
          ${right ? (lvl >= EAR_RATES.length-1 ? "Nailed it at full speed" : "Right — speeding up") : "Not quite — slowing down"}
        </b>
      </div>
      <button class="btn primary" style="margin-top:12px" data-ear="next">Next</button>` : ""}`;

  if(!answered && earPlayed !== c.id + ex.es){
    earPlayed = c.id + ex.es;
    speak(ex.es, EAR_RATES[lvl]);
  }
}

function renderEarDone(){
  const {right, total} = earScore;
  const pct = total ? Math.round(right / total * 100) : 0;
  const atFull = Object.values(ears).filter(l => l >= EAR_RATES.length - 1).length;
  SFX.done();
  view.innerHTML = header("Listen", "Round complete") + `
    <div class="card center" style="padding:26px 16px">
      <div class="score" style="color:${scoreColor(pct)}">${right}<span>/${total}</span></div>
      <div style="font-weight:650;margin-top:4px">${
        pct === 100 ? "Perfect round" : pct >= 70 ? "Good round" : "Worth another go"}</div>
      <div class="muted tiny" style="margin-top:10px">
        ${atFull} chunk${atFull===1?"":"s"} you now recognise at full speed, no text.</div>
    </div>
    <div class="stack" style="margin-top:16px">
      <button class="btn primary" data-ear="again">Another round</button>
      <button class="btn ghost" data-go="practice">Back to Practice</button>
    </div>`;
}

/* ----- Shadow ----- */
const SHADOW_ROUND = 8;
let listening = false, heard = "", result = null, recNote = null, shadowSpoken = null;
let shadowDoneCount = 0;

function resetAttempt(){ listening = false; heard = ""; result = null; recNote = null; }

/* Tear down anything a mode left running before switching away from it. */
function leaveMode(){
  flow = null;          // tapping a tab mid-session abandons it
  stopListening();
  resetAttempt();
  shadowSpoken = null;
  clearDrillTimer();
  drillCard = null; drillRound = null;
  labCard = null; labRound = null;
  wordCard = null; wordShown = false; wordSpoke = null;
  earCard = null; earQ = null;
  shadowQ = null;
  dlg = null;
}

function renderShadow(){
  const deck = Object.keys(srs);
  if(!deck.length){
    view.innerHTML = header("Shadow", "Say it out loud") + empty("\u{1F3A7}", "Nothing to shadow yet",
      "Add a few chunks from Learn, then come back and repeat them out loud.");
    return;
  }
  if(!shadowQ){
    /* Same rule for Shadow: a phrase you cannot yet say is not shadowing
       practice, it is reading aloud from a script you have never seen. */
    const sayable = practicePool().all.filter(id => {
      const c = byId(id);
      return c && bestCoverage(c, srs[id], "speaking") >= PRODUCIBLE;
    });
    const source = sayable.length >= 3 ? sayable : practicePool().all;
    shadowQ = source.slice(0, Math.min(SHADOW_ROUND, deck.length)).map(id => {
      const c = byId(id);
      return {c, ex: pickProducible(c, srs[id], "speaking"), reps: 0};
    });
    shadowDoneCount = 0;
  }
  if(!shadowQ.length) return renderShadowDone();
  const item = shadowQ[0];
  const best = scores[item.c.id];
  const blocked = recProblem();

  const sentence = result
    ? result.marks.map(m => `<span class="mk ${m.hit}">${esc(m.w)}</span>`).join(" ")
    : esc(item.ex.es);

  view.innerHTML = header("Shadow", `${shadowQ.length} left · ${totals.shadowReps} said out loud`) + `
    <div class="shadow-big">
      <div class="es">${sentence}</div>
      <div class="en">${esc(item.ex.en)}</div>
      <button class="spk" style="width:58px;height:58px;font-size:23px" data-speak="${esc(item.ex.es)}">\u{1F50A}</button>
      <div class="reps">
        ${[0,1,2].map(i => `<span class="dot${item.reps>i?" on":""}"></span>`).join("")}
        <span>listen · repeat · repeat</span>
      </div>
    </div>

    ${result ? scoreCard(result) : ""}
    ${listening ? `
      <div class="card center" style="margin-top:12px">
        <div class="mic-live"><span class="ring"></span>\u{1F3A4}</div>
        <div class="muted tiny" style="margin-top:8px">${heard ? esc(heard) : "Listening… say it now"}</div>
      </div>` : ""}
    ${recNote ? `<div class="card center tiny" style="margin-top:12px;color:var(--accent)">${esc(recNote)}</div>` : ""}

    <div class="card" style="margin-top:12px">
      <div class="center"><b style="font-size:19px">${esc(item.c.chunk)}</b>
      <div class="muted tiny" style="margin-top:4px">${esc(item.c.meaning)}</div>
      ${best != null ? `<div class="tiny" style="margin-top:6px;color:${scoreColor(best)}">Best score ${best}%</div>` : ""}
      </div>
    </div>

    <div class="stack" style="margin-top:16px">
      ${blocked ? `<div class="tiny muted center">${esc(blocked)}</div>`
        : listening
          ? `<button class="btn" data-shadow="stop">Stop listening</button>`
          : `<button class="btn primary" data-shadow="listen">\u{1F3A4} ${result ? "Say it again" : "Say it — I'll score you"}</button>`}
      ${!blocked && IS_FILE ? `<div class="tiny muted center" style="line-height:1.6">
        Opened from disk — the mic needs a served page.
        <button class="lnk" data-sheet="settings">How to fix</button></div>` : ""}
      ${blocked
        ? `<button class="btn primary" data-shadow="rep">I said it out loud</button>`
        : `<button class="btn ghost tiny" data-shadow="rep">Count it without scoring</button>`}
      <button class="btn ghost" data-shadow="next">Next phrase</button>
    </div>`;

  /* Only auto-play when the phrase first appears, never on interim re-renders. */
  if(item.reps === 0 && !listening && !result && shadowSpoken !== item.c.id){
    shadowSpoken = item.c.id;
    speak(item.ex.es);
  }
}

function renderShadowDone(){
  SFX.done();
  view.innerHTML = header("Shadow", "Round complete") + `
    <div class="card center" style="padding:26px 16px">
      <div class="score">${shadowDoneCount}<span> phrases</span></div>
      <div style="font-weight:650;margin-top:4px">Said out loud</div>
      <div class="muted tiny" style="margin-top:10px">${totals.shadowReps} reps all time.</div>
    </div>
    <div class="stack" style="margin-top:16px">
      <button class="btn primary" data-shadow="again">Another round</button>
      <button class="btn ghost" data-go="practice">Back to Practice</button>
    </div>`;
}

const scoreColor = s => s >= 85 ? "var(--green)" : s >= 60 ? "var(--accent)" : "var(--red)";
function scoreCard(r){
  const verdict = r.score >= 85 ? "Nailed it" : r.score >= 60 ? "Close — keep going" : "Try that one again";
  return `
    <div class="card center" style="margin-top:12px">
      <div class="score" style="color:${scoreColor(r.score)}">${r.score}<span>%</span></div>
      <div style="font-weight:650;margin-top:2px">${verdict}</div>
      <div class="muted tiny" style="margin-top:8px">You said: “${esc(r.said)}”</div>
    </div>`;
}

function beginListening(){
  const item = shadowQ[0];
  resetAttempt();
  listening = true;
  render();
  startListening({
    partial(text){ heard = text; if(listening) render(); },
    fail(msg){ listening = false; recNote = msg; render(); },
    done(text){
      listening = false;
      if(!text){ recNote = "Didn't catch anything — try again."; return render(); }
      const r = scoreAttempt(item.ex.es, text);
      r.said = text;
      result = r;
      totals.attempts++;
      if(scores[item.c.id] == null || r.score > scores[item.c.id]){
        scores[item.c.id] = r.score;
        saveScores();
      }
      /* A scored attempt IS a rep — otherwise the mic is a side quest and only
         the manual button moves the queue. */
      recordSkill("speaking", r.score >= 75, item.ex.level || 1);
      if(r.score >= 60){ item.reps++; totals.shadowReps++; gotItRight(); } else gotItWrong();
      saveTotals();
      markStudied();
      checkMilestones();
      render();
    }
  });
}

/* ----- Conversations ----- */
let dlg = null;   // {d, turn, picked, right, total}

/* Which conversation the session closes with. The first version took a
   goal-matched one and fell back to "lowest score", which does not rotate:
   simulated over ninety days it served the same exchange 87 times out of 88
   and never touched 14 of the 16. A daily habit cannot end on the same scene
   every day, so this is a rota — goal-matched first, then the rest, each used
   once before any repeats. */
let talkRota = LS.get("talkRota", null);
const saveRota = () => LS.set("talkRota", talkRota);

function buildRota(){
  const mine = shuffle(DIALOGUES.filter(d => myGoals.indexOf(d.goal) !== -1).map(d => d.id));
  const rest = shuffle(DIALOGUES.filter(d => myGoals.indexOf(d.goal) === -1).map(d => d.id));
  talkRota = {ids: mine.concat(rest), i: 0};
  saveRota();
}
function nextTalk(){
  if(!talkRota || !talkRota.ids.length || talkRota.i >= talkRota.ids.length) buildRota();
  /* A dialogue dropped from the collection must not strand the rota. */
  let d = DIALOGUES.find(x => x.id === talkRota.ids[talkRota.i]);
  while(!d && talkRota.i < talkRota.ids.length - 1){
    talkRota.i++;
    d = DIALOGUES.find(x => x.id === talkRota.ids[talkRota.i]);
  }
  talkRota.i++;
  saveRota();
  return d || DIALOGUES[0];
}

function startDialogue(id){
  const d = DIALOGUES.find(x => x.id === id);
  dlg = {d, turn: 0, picked: null, right: 0, total: d.turns.filter(t => t.who === "you").length, opts: null};
  prepDialogueTurn();
}
function prepDialogueTurn(){
  const t = dlg.d.turns[dlg.turn];
  dlg.picked = null;
  dlg.opts = t && t.who === "you" ? shuffle([t.es, ...t.wrong]) : null;
}

function renderDialogue(){
  if(flow && !dlg) startDialogue(nextTalk().id);
  if(!dlg){
    view.innerHTML = header("Conversations", "Hold your end of a real exchange") + `
      <div class="card">
        ${[...DIALOGUES]
          .sort((a,b) => (myGoals.includes(b.goal) - myGoals.includes(a.goal)))
          .map(d => {
          const best = dialogDone[d.id];
          const mine = myGoals.includes(d.goal);
          const g = GOALS.find(x => x.id === d.goal);
          return `<button class="li" data-dlg="${d.id}">
            <span class="pill${best != null ? (best >= 80 ? " mastered" : " review") : ""}"></span>
            <span class="t"><b>${g ? g.em + " " : ""}${esc(d.title)}</b><span>${esc(d.setting)}</span></span>
            ${best != null ? `<span class="badge" style="color:${scoreColor(best)}">${best}%</span>`
                           : mine ? `<span class="badge tier1">for you</span>`
                           : `<span class="badge">new</span>`}
          </button>`;
        }).join("")}
      </div>
      <p class="tiny muted center" style="margin-top:14px">
        ${myGoals.length ? "Your goals' conversations come first."
                         : "Each one strings together chunks you're already learning."}</p>`;
    return;
  }

  const {d, turn} = dlg;
  const done = turn >= d.turns.length;
  if(done){
    const pct = dlg.total ? Math.round(dlg.right / dlg.total * 100) : 100;
    view.innerHTML = header(d.title, "Conversation complete") + `
      <div class="card center" style="padding:24px 16px">
        <div class="score" style="color:${scoreColor(pct)}">${pct}<span>%</span></div>
        <div style="font-weight:650;margin-top:4px">${dlg.right} of ${dlg.total} replies spot on</div>
      </div>
      <div class="card" style="margin-top:12px">
        <p class="sec-label">The whole exchange</p>
        ${d.turns.map(t => `
          <div class="ex">
            ${speakerBtn(t.es, true)}
            <div class="txt">
              <div class="es" style="${t.who==="you"?"color:var(--accent)":""}">${esc(t.es)}</div>
              <div class="en">${esc(t.en)}</div>
            </div>
          </div>`).join("")}
      </div>
      <div class="stack" style="margin-top:16px">
        ${flow ? `<button class="btn primary" data-dlg-act="done">Finish the session</button>
                  <button class="btn ghost" data-dlg-act="replay">Run it again</button>`
               : `<button class="btn primary" data-dlg-act="replay">Run it again</button>
                  <button class="btn ghost" data-dlg-act="list">Back to conversations</button>`}
      </div>`;
    return;
  }

  const t = d.turns[turn];
  const history = d.turns.slice(0, turn);

  view.innerHTML = header(d.title, `${esc(d.setting)}`) + `
    <div class="card">
      ${history.length ? history.map(h => `
        <div class="bubble ${h.who}">
          <div class="es">${esc(h.es)}</div>
          <div class="en">${esc(h.en)}</div>
        </div>`).join("") : `<p class="tiny muted center" style="margin:6px 0">The conversation starts here.</p>`}

/* ----- Quick-fire: production under time pressure ----- */
/* Recall with unlimited time doesn't build the sub-second retrieval a real
   conversation needs, so this one runs on a clock. */
const DRILL_SECONDS = 5, DRILL_ROUND = 8;
let drillCard = null, drillState = "ready", drillResult = null, drillHeard = "", drillTimer = null, drillLeft = 0;
let drillRound = null;   // {done, scores[]}

function buildDrill(){
  const {recent, all} = practicePool();
  /* Lead with today's, but keep pulling older ones in — a round that only
     ever asks for what you just met is a memory test, not recall. */
  const pool = (recent.length && Math.random() < 0.65) ? recent : all;
  /* Look for a chunk this learner could actually say a sentence with. Asking
     somebody to produce "Claro que sí, cuenta conmigo" when they have met
     claro and nothing else is not a recall test, it is a trick question —
     and five seconds of failing one teaches nothing worth learning. */
  let c = null, bestC = null, bestCov = -1;
  for(let i = 0; i < 12 && pool.length; i++){
    const cand = byId(pool[Math.floor(Math.random()*pool.length)]);
    if(!cand) continue;
    const cov = bestCoverage(cand, srs[cand.id], "speaking");
    if(cov > bestCov){ bestCov = cov; bestC = cand; }
    if(cov >= PRODUCIBLE){ c = cand; break; }
  }
  c = c || bestC;
  if(!c){ drillCard = null; return; }
  drillCard = {c, ex: pickProducible(c, srs[c.id], "speaking")};
  drillState = "ready"; drillResult = null; drillHeard = "";
}
function clearDrillTimer(){ if(drillTimer){ clearInterval(drillTimer); drillTimer = null; } }

function startDrill(){
  const {ex} = drillCard;
  drillState = "go"; drillHeard = ""; drillResult = null;
  drillLeft = DRILL_SECONDS;
  render();
  clearDrillTimer();
  drillTimer = setInterval(() => {
    drillLeft--;
    if(drillLeft <= 0){ clearDrillTimer(); stopListening(); }
    if(drillState === "go") render();
  }, 1000);

  startListening({
    partial(t){ drillHeard = t; if(drillState === "go") render(); },
    fail(msg){ clearDrillTimer(); drillState = "done"; drillResult = {blocked: msg}; render(); },
    done(text){
      clearDrillTimer();
      drillState = "done";
      if(text){
        const r = scoreAttempt(ex.es, text);
        r.said = text;
        drillResult = r;
        totals.drills = (totals.drills || 0) + 1;
        /* Kept apart from Shadow's scores: reading a sentence aloud and
           producing it cold from English are different skills, and pooling
           them would let the easier one mask the harder one. */
        const id = drillCard.c.id;
        if(drills[id] == null || r.score > drills[id]){ drills[id] = r.score; saveDrills(); }
        recordSkill("speaking", r.score >= 75, ex.level || 1);
        saveTotals(); markStudied();
        r.score >= 60 ? gotItRight() : gotItWrong();
        checkMilestones();
      }else{
        drillResult = {blocked: "Didn't catch anything — try again."};
      }
      render();
    }
  });
}

function renderDrill(){
  if(!Object.keys(srs).length){
    view.innerHTML = header("Quick-fire", "Say it fast") +
      empty("\u{26A1}", "Learn a few chunks first",
            "Producing a sentence you've never seen isn't a drill, it's a guess.") +
      `<button class="btn primary" data-go="learn">Learn some chunks</button>`;
    return;
  }
  if(!drillRound) drillRound = {done:0, scores:[]};
  if(drillRound.done >= DRILL_ROUND) return renderDrillDone();
  if(!drillCard) buildDrill();
  const {c, ex} = drillCard;
  const blocked = recProblem();
  const pct = drillState === "go" ? (drillLeft / DRILL_SECONDS) * 100 : 0;

  view.innerHTML = header("Quick-fire", `${drillRound.done + 1} of ${DRILL_ROUND} · say it fast`) + `
    <div class="card center" style="padding:24px 16px">
      <div class="sec-label" style="margin-bottom:10px">Say this in Spanish</div>
      <div style="font-size:23px;font-weight:650;line-height:1.35">${esc(ex.en)}</div>
      ${drillState === "go" ? `
        <div class="timer"><i style="width:${pct}%"></i></div>
        <div style="font-size:31px;font-weight:700;margin-top:6px;color:${drillLeft<=2?"var(--red)":"var(--accent)"}">${drillLeft}</div>
        <div class="tiny muted" style="margin-top:4px">${drillHeard ? esc(drillHeard) : "Listening…"}</div>` : ""}
      ${drillState === "done" ? `
        <div style="margin-top:16px">
          ${drillResult && drillResult.blocked
            ? `<div class="tiny" style="color:var(--accent)">${esc(drillResult.blocked)}</div>`
            : `<div class="score" style="color:${scoreColor(drillResult.score)}">${drillResult.score}<span>%</span></div>
               <div class="muted tiny" style="margin-top:6px">You said: “${esc(drillResult.said)}”</div>`}
          <div class="es" style="font-size:19px;font-weight:650;margin-top:14px">${esc(ex.es)}</div>
          <div class="muted tiny" style="margin-top:4px">${esc(c.chunk)} — ${esc(c.meaning)}</div>
          <button class="spk sm" style="margin-top:10px" data-speak="${esc(ex.es)}">\u{1F50A}</button>
        </div>` : ""}
    </div>
    <div class="stack" style="margin-top:16px">
      ${blocked ? `<div class="tiny muted center">${esc(blocked)}</div>
                   <button class="btn primary" data-drill="reveal">Show the answer</button>`
        : drillState === "ready" ? `<button class="btn primary" data-drill="start">\u{26A1} Start — ${DRILL_SECONDS}s</button>`
        : drillState === "go"    ? `<button class="btn" data-drill="stop">I'm done</button>`
        :                          `<button class="btn primary" data-drill="next">Next phrase</button>`}
      ${drillState === "done" && !blocked ? `<button class="btn ghost" data-drill="retry">Try this one again</button>` : ""}
    </div>`;
}

function renderDrillDone(){
  const s = drillRound.scores;
  const avg = s.length ? Math.round(s.reduce((a,b)=>a+b,0)/s.length) : 0;
  SFX.done();
  view.innerHTML = header("Quick-fire", "Round complete") + `
    <div class="card center" style="padding:26px 16px">
      ${s.length ? `<div class="score" style="color:${scoreColor(avg)}">${avg}<span>%</span></div>
        <div style="font-weight:650;margin-top:4px">Average, producing cold</div>`
        : `<div style="font-weight:650">Round done</div>`}
      <div class="muted tiny" style="margin-top:10px">
        ${s.filter(x=>x>=85).length} of ${DRILL_ROUND} nailed at 85% or better.</div>
    </div>
    <div class="stack" style="margin-top:16px">
      <button class="btn primary" data-drill="again">Another round</button>
      <button class="btn ghost" data-go="practice">Back to Practice</button>
    </div>`;
}

        <span>Pronunciation scoring</span>
        <span class="tiny" style="color:${recStatus.color};text-align:right">${esc(recStatus.label)}</span>
      </div>
      ${IS_FILE ? `
        <div class="card tiny" style="background:var(--surface-2);margin-top:12px;line-height:1.65">
          <b>Microphone blocked? This is why.</b>
          <div class="muted" style="margin-top:6px">
            This page was opened straight from a file, and browsers refuse the
            microphone to <code>file://</code> pages whatever you allow.
            Playback still works — only scoring needs this.
            <div style="margin-top:8px">In the folder holding this file, run:</div>
            <div class="cmd">${esc(SERVE_CMD)}</div>
            <div style="margin-top:6px">then open <b>http://localhost:8000</b> and use it there.</div>
          </div>
        </div>` : ""}
      <p class="sec-label" style="margin:20px 0 6px">Starting level</p>
      <p class="muted tiny" style="margin:0 0 10px">
        Where the course begins. It moves on its own from how you answer —
        this only sets the floor, and resetting it re-seeds all four skills.</p>
      <div class="row" style="gap:8px">
        ${[1,2,3,4].map(n => `
          <button class="btn sm${learner.startLevel === n ? " primary" : ""}" data-band="${n}" style="flex:1">
            ${BANDS[n]}</button>`).join("")}
      </div>

      <p class="sec-label" style="margin:20px 0 6px">Pace</p>
      <p class="muted tiny" style="margin:0 0 10px">
        New chunks per day. At <b>${esc(pace().label)}</b> you'd meet all
        ${CHUNKS.length} in about ${daysToFinish()} more ${daysToFinish() === 1 ? "day" : "days"}.</p>
      <div class="row" style="gap:8px">
        ${Object.keys(PACES).map(k => `
          <button class="btn sm${settings.pace === k ? " primary" : ""}" data-pace="${k}" style="flex:1">
            ${esc(PACES[k].label)}<br><span class="tiny muted">${PACES[k].fresh} chunks<br>${PACES[k].words} words</span>
          </button>`).join("")}
      </div>

      <div class="field" style="margin-top:14px">
        <span>Salty language <b class="muted tiny">${settings.salty === false ? "hidden" : "shown"}</b></span>
        <button class="btn sm" id="saltyTog" style="width:auto;padding:8px 16px">
          ${settings.salty === false ? "Off" : "On"}</button>
      </div>
      <p class="muted tiny" style="margin:6px 0 0">
        Off keeps the two vulgar chunks out of your deck. You'll still hear
        them in the wild, so they're only hidden, never unlearned.</p>

      <div class="field">
        <span>Speed <b id="rateVal" class="muted tiny">${settings.rate.toFixed(2)}×</b></span>
        <input type="range" id="rate" min="0.6" max="1.2" step="0.02" value="${settings.rate}">
      </div>
      <div class="field">
        <span>Sounds</span>
        <button class="btn sm" id="soundTog" style="width:auto;padding:8px 16px">
          ${settings.sound === false ? "Off" : "On"}</button>
      </div>
      <button class="btn sm" id="testVoice" style="margin-top:12px">Test: ¿Qué onda, güey?</button>

      <p class="sec-label" style="margin:20px 0 6px">Backup</p>
      <p class="muted tiny" style="margin:0 0 10px">
        Progress lives in this browser only. Clearing site data erases it —
        export a file to keep it, or to move to another device.</p>
      <div class="row" style="gap:8px">
        <button class="btn sm" id="expBtn" style="flex:1">⬇️ Export</button>
        <button class="btn sm" id="impBtn" style="flex:1">⬆️ Import</button>
      </div>
      <input type="file" id="impFile" accept="application/json,.json" style="display:none">
      <p class="tiny muted center" style="margin:8px 0 0" id="backupNote">
        ${Object.keys(srs).length} chunks · ${liveStreak()} day streak · ${totals.reviews} reviews</p>
      <button class="btn sm ghost" id="reset" style="margin-top:10px;color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)">Reset all progress</button>

      <p class="tiny muted center" style="margin:18px 0 0;opacity:.55">
        Build ${window.CALLE_BUILD || "unknown"}</p>
    </div>`;
  document.body.appendChild(wrap);

  const close = () => wrap.remove();
  wrap.querySelector("[data-close]").onclick = close;
  wrap.querySelector("#closeSheet").onclick = close;
  const sel = wrap.querySelector("#voiceSel");
  sel.onchange = () => { settings.voice = sel.value || null; saveSettings(); };
  const rate = wrap.querySelector("#rate");
  rate.oninput = () => {
    settings.rate = parseFloat(rate.value);
    wrap.querySelector("#rateVal").textContent = settings.rate.toFixed(2) + "×";
    saveSettings();
  };
  wrap.querySelectorAll("[data-band]").forEach(b => {
    b.onclick = () => {
      const n = parseInt(b.dataset.band, 10);
      learner.startLevel = n;
      /* Re-seed rather than jump: a declared level is a starting belief, and
         the evidence window has to refill before it moves again. */
      Object.keys(learner.skills).forEach(k => {
        learner.skills[k] = defaultSkill(k === "listening" ? n - 0.2 : n + 0.05);
      });
      saveLearner();
      close();
      openSettings();
    };
  });
  wrap.querySelectorAll("[data-pace]").forEach(b => {
    b.onclick = () => {
      settings.pace = b.dataset.pace;
      saveSettings();
      close();
      openSettings();
    };
  });
  const salty = wrap.querySelector("#saltyTog");
  salty.onclick = () => {
    settings.salty = settings.salty === false;
    saveSettings();
    close();
    openSettings();
  };
  const tog = wrap.querySelector("#soundTog");
  tog.onclick = () => {
    settings.sound = settings.sound === false;
    saveSettings();
    tog.textContent = settings.sound === false ? "Off" : "On";
    if(settings.sound) SFX.right();
  };
  wrap.querySelector("#testVoice").onclick = () => speak("¿Qué onda, güey? ¿Cómo has estado?");

  const note = wrap.querySelector("#backupNote");
  const file = wrap.querySelector("#impFile");
  wrap.querySelector("#expBtn").onclick = exportProgress;
  wrap.querySelector("#impBtn").onclick = () => file.click();
  file.onchange = () => {
    const f = file.files && file.files[0];
    if(!f) return;
    file.value = "";
    if(!confirm("Replace the progress on this device with the backup? This can't be undone.")) return;
    importProgress(f, (err, n) => {
      if(err){ note.textContent = err; note.style.color = "var(--red)"; return; }
      note.textContent = `Restored ${n} section${n===1?"":"s"} — reloading…`;
      note.style.color = "var(--green)";
      setTimeout(() => location.reload(), 700);
    });
  };
  wrap.querySelector("#reset").onclick = () => {
    if(!confirm("Erase your deck, streak and all progress? This can't be undone.")) return;
    srs = {}; streak = {count:0,last:null,days:{}}; scores = {}; ears = {};
    dialogDone = {}; drills = {}; skipped = {}; unlocked = {};
    LS.set("unlocked", unlocked);
    combo = 0;
    totals = {reviews:0, shadowReps:0, attempts:0, drills:0, bestCombo:0};
    saveSrs(); saveStreak(); saveScores(); saveEars(); saveDialogs();
    saveDrills(); saveSkipped(); saveTotals();
    leaveMode();
    session = null; shadowQ = null; learnCard = null; earQ = null; flow = null;
    close(); go("home"); toast("Progress reset");
  };
}

/* ---------- 7. EVENTS ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-speak],[data-go],[data-learn],[data-reveal],[data-grade],[data-shadow],[data-sheet],[data-filter],[data-open],[data-add],[data-ear],[data-ear-pick],[data-drill],[data-dlg],[data-dlg-pick],[data-dlg-act],[data-session],[data-intro],[data-goal],[data-lab],[data-lab-pick],[data-word],[data-wgrade],[data-wpick],[data-share]");
  if(!t) return;

  if(t.dataset.speak !== undefined){ speak(t.dataset.speak); return; }
  if(t.dataset.go){
    leaveMode();
    session = null; go(t.dataset.go); return;
  }
  if(t.dataset.sheet){
    const s = t.dataset.sheet;
    if(s === "milestones") openMilestones();
    else if(s === "goals")  openGoals();
    else openSettings();
    return;
  }
  if(t.dataset.session){
    leaveMode();
    if(t.dataset.session === "catchup"){ startSessionFlow(true); return; }
    startSessionFlow(); return;
  }

  if(t.dataset.share){
    const mastered = Object.keys(srs).filter(id => statusOf(id) === "mastered").length;
    if(t.dataset.share === "streak")
      shareCard(liveStreak() + " days of Mexican Spanish", mastered + " phrases mastered");
    else
      shareCard(Object.keys(srs).length + " phrases, " + Object.keys(vsrs).length + " words",
                liveStreak() + "-day streak on Calle");
    return;
  }
  if(t.dataset.wpick){
    if(wordCard.pick) return;
    wordCard.pick = t.dataset.wpick;
    const right = wordCard.pick === wordCard.w.id;
    /* Objectively graded, so the scheduler hears what happened rather than
       what the learner felt about it. */
    vsrs[wordCard.w.id] = schedule(vsrs[wordCard.w.id], right ? GRADE.good : GRADE.again);
    saveVsrs(); markStudied();
    right ? gotItRight() : gotItWrong();
    /* The reveal in renderWords does the speaking now, and says "la esposa"
       rather than "esposa" — the article is half of what a noun card is
       teaching. Speaking here too just talked over it. */
    render(); return;
  }
  if(t.dataset.word){
    if(t.dataset.word === "show"){ wordShown = true; render(); return; }
    if(t.dataset.word === "next"){
      wordCard = null;
      if(wordTick(true)) return;
      nextWord();
      if(!wordCard && flow) return flowNext();
      render(); return;
    }
    /* A new word enters the scheduler the same way a new chunk does. */
    vsrs[wordCard.w.id] = newState(); saveVsrs();
    markStudied();
    wordCard = null;
    if(wordTick(false)) return;
    nextWord();
    if(!wordCard && flow) return flowNext();
    render(); return;
  }
  if(t.dataset.wgrade){
    const id = wordCard.w.id;
    vsrs[id] = schedule(vsrs[id], GRADE[t.dataset.wgrade]);
    saveVsrs(); markStudied();
    GRADE[t.dataset.wgrade] === GRADE.again ? gotItWrong() : gotItRight();
    wordCard = null;
    if(wordTick(true)) return;
    nextWord();
    if(!wordCard && flow) return flowNext();
    render(); return;
  }
  if(t.dataset.labPick !== undefined){ answerLab(t.dataset.labPick); return; }
  if(t.dataset.lab){
    if(t.dataset.lab === "again"){ startLabRound(); render(); }
    else nextLab();
    return;
  }

  if(t.dataset.goal){
    const g = t.dataset.goal;
    myGoals = myGoals.includes(g) ? myGoals.filter(x => x !== g) : myGoals.concat(g);
    saveGoals();
    learnCard = null;                       // the queue order just changed
    if(tab === "intro") render(); else openGoals();
    return;
  }
  if(t.dataset.intro){
    /* One step past the cards is the goal picker. */
    if(t.dataset.intro === "next" && introStep < INTRO.length){ introStep++; return render(); }
    seenIntro = true; LS.set("seenIntro", true);
    go("home"); return;
  }

  /* ----- Listen ----- */
  if(t.dataset.ear){
    const act = t.dataset.ear;
    if(act === "again"){ startEarRound(); return render(); }
    if(act === "play")  speak(earCard.ex.es, EAR_RATES[earLevel(earCard.c.id)]);
    if(act === "slow")  speak(earCard.ex.es, 0.6);
    if(act === "next"){
      earCard = null;
      if(flowTick("listen")) return;
      render();
    }
    return;
  }
  if(t.dataset.earPick !== undefined){
    const id = earCard.c.id;
    earPick = t.dataset.earPick;
    const lvl = earLevel(id), right = earPick === earCard.ex.en;
    ears[id] = right ? Math.min(EAR_RATES.length - 1, lvl + 1) : Math.max(0, lvl - 1);
    saveEars(); markStudied(); noteStudied(id);
    earScore.total++; if(right) earScore.right++;
    recordSkill("listening", right, earCard.ex.level || 1);
    right ? gotItRight() : gotItWrong();
    render(); return;
  }

  /* ----- Quick-fire ----- */
  if(t.dataset.drill){
    const act = t.dataset.drill;
    if(act === "start" || act === "retry"){ startDrill(); return; }
    if(act === "stop"){ clearDrillTimer(); stopListening(); return; }
    if(act === "reveal"){ drillState = "done"; drillResult = {blocked:"Mic unavailable — check it yourself."}; render(); return; }
    if(act === "again"){ clearDrillTimer(); stopListening(); drillRound = null; drillCard = null; render(); return; }
    if(act === "next"){
      clearDrillTimer(); stopListening();
      drillRound.done++;
      if(drillResult && !drillResult.blocked) drillRound.scores.push(drillResult.score);
      drillCard = null; render(); return;
    }
  }

  /* ----- Conversations ----- */
  if(t.dataset.dlg){ startDialogue(t.dataset.dlg); render(); return; }
  if(t.dataset.dlgPick !== undefined){
    const turn = dlg.d.turns[dlg.turn];
    dlg.picked = t.dataset.dlgPick;
    if(dlg.picked === turn.es){ dlg.right++; gotItRight(); } else gotItWrong();
    speak(turn.es);
    markStudied();
    render(); return;
  }
  if(t.dataset.dlgAct){
    const act = t.dataset.dlgAct;
    if(act === "next"){
      dlg.turn++;
      prepDialogueTurn();
      if(dlg.turn >= dlg.d.turns.length){
        const pct = dlg.total ? Math.round(dlg.right / dlg.total * 100) : 100;
        if(dialogDone[dlg.d.id] == null || pct > dialogDone[dlg.d.id]){
          dialogDone[dlg.d.id] = pct; saveDialogs();
        }
      }
    }
    if(act === "replay") startDialogue(dlg.d.id);
    if(act === "list"){
      dlg = null;
      /* Leaving the closing conversation finishes the session rather than
         dropping the learner into the conversation list mid-flow. */
      if(flow){ flow.did.talk = 1; return flowNext() || render(); }
    }
    if(act === "done" && flow){ dlg = null; flow.did.talk = 1; return flowNext() || render(); }
    render(); return;
  }

  if(t.dataset.learn){
    if(t.dataset.learn === "add"){
      srs[learnCard.id] = newState(); saveSrs();
      noteStudied(learnCard.id);
      delete skipped[learnCard.id]; saveSkipped();
      markStudied();
      toast("Added — review it in a minute");
      learnCard = null;
      if(flowTick("learn")) return;
    }else{
      /* Persisted, so a skip actually sticks instead of resurfacing next visit. */
      skipped[learnCard.id] = Date.now(); saveSkipped();
      learnCard = null;
    }
    render(); return;
  }

  if(t.dataset.reveal){ session.shown = true; render(); return; }

  if(t.dataset.grade){
    const c = session.card.chunk;
    srs[c.id] = schedule(srs[c.id], GRADE[t.dataset.grade]);
    saveSrs();
    noteStudied(c.id);
    totals.reviews++; saveTotals();
    markStudied();
    const passed = GRADE[t.dataset.grade] >= GRADE.good;
    recordSkill("comprehension", passed, session.card.ex.level || 1);
    recordSkill("vocabulary", passed, c.learningLevel || 1);
    if(GRADE[t.dataset.grade] === GRADE.again){ session.queue.push(c.id); gotItWrong(); }
    else { session.done++; gotItRight(); checkMilestones(); flowTick("review"); }
    nextCard();
    if(!session.card && flow) return flowNext();
    render(); return;
  }

  if(t.dataset.shadow){
    const item = shadowQ[0];
    const act = t.dataset.shadow;
    if(act === "again"){ shadowQ = null; shadowSpoken = null; resetAttempt(); return render(); }
    if(act === "listen"){ beginListening(); return; }
    if(act === "stop"){ stopListening(); listening = false; render(); return; }
    if(act === "rep"){
      item.reps++; totals.shadowReps++; saveTotals(); markStudied();
      resetAttempt();
      if(item.reps >= 3){ shadowQ.shift(); shadowDoneCount++; shadowSpoken = null; }
      else { shadowSpoken = item.c.id; speak(item.ex.es); }
    }else{
      stopListening(); resetAttempt(); shadowQ.shift(); shadowDoneCount++; shadowSpoken = null;
    }
    render(); return;
  }

  if(t.dataset.filter){ browseFilter = t.dataset.filter; render(); return; }
  if(t.dataset.open){ openChunk = openChunk === t.dataset.open ? null : t.dataset.open; render(); return; }
  if(t.dataset.add){
    srs[t.dataset.add] = newState(); saveSrs();
    toast("Added to your deck"); render(); return;
  }
});

document.addEventListener("input", e => {
  if(e.target.id === "q"){
    browseQuery = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const el = $("#q");
    if(el){ el.focus(); el.setSelectionRange(pos, pos); }
  }
});

/* ---------- 8. PWA INSTALL (manifest generated inline) ---------- */
(function manifest(){
  const cv = document.createElement("canvas");
  const icon = size => {
    cv.width = cv.height = size;
    const x = cv.getContext("2d");
    x.fillStyle = "#12100e"; x.fillRect(0,0,size,size);
    x.fillStyle = "#f59e0b";
    x.font = `700 ${size*0.56}px -apple-system,Segoe UI,Roboto,sans-serif`;
    x.textAlign = "center"; x.textBaseline = "middle";
    x.fillText("¡", size/2, size*0.52);
    return cv.toDataURL("image/png");
  };
  const mf = {
    name: "Calle — Real Mexican Spanish",
    short_name: "Calle",
    start_url: location.pathname,
    display: "standalone",
    background_color: "#12100e",
    theme_color: "#12100e",
    icons: [
      {src: icon(192), sizes: "192x192", type: "image/png", purpose: "any"},
      {src: icon(512), sizes: "512x512", type: "image/png", purpose: "any"}
    ]
  };
  const link = document.createElement("link");
  link.rel = "manifest";
  link.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], {type:"application/manifest+json"}));
  document.head.appendChild(link);

  const apple = document.createElement("link");
  apple.rel = "apple-touch-icon";
  apple.href = icon(180);
  document.head.appendChild(apple);
})();

/* ---------- 9. GO ---------- */
render();
/* Tells the boot watchdog in the page head that we reached a first paint, so it
   stands down. Checked against real content: a blank <main> is not a boot. */
if(view && view.innerHTML.trim()) window.__calleUp = true;

/* ---------- 10. SERVICE WORKER ----------
   Registered only once the app has actually painted, so a broken copy can
   never install the thing that would go on serving it. The worker is
   network-first: the cache is there for being offline and is never a source
   of stale code. ?nosw on the URL tears it all out again. */
if("serviceWorker" in navigator && window.isSecureContext){
  if(location.search.indexOf("nosw") !== -1){
    navigator.serviceWorker.getRegistrations()
      .then(rs => rs.forEach(r => r.unregister())).catch(() => {});
    if(window.caches) caches.keys()
      .then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
  } else if(window.__calleUp){
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
}
</script>
