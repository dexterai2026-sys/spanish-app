            iOS: Settings › Accessibility › Spoken Content › Voices.
            macOS: System Settings › Accessibility › Spoken Content › Manage Voices.
            Android: Settings › Text-to-speech.
            Windows: Settings › Time &amp; language › Speech.
          </div>
        </div>` : ""}
      <div class="field">
        <span>Voice</span>
        <select id="voiceSel">
          ${list.length ? list.map(v =>
            `<option value="${esc(v.voiceURI)}"${settings.voice===v.voiceURI?" selected":""}>${esc(v.name)} (${esc(v.lang)})</option>`
          ).join("") : `<option value="">No Spanish voice installed</option>`}
        </select>
      </div>
      <div class="field">
        <span>Pronunciation scoring</span>
        <span class="tiny" style="color:${recStatus.color};text-align:right">${esc(recStatus.label)}</span>
      </div>
      ${IS_FILE ? `
        <div class="card tiny" style="background:var(--surface-2);margin-top:12px;line-height:1.65">
          <b>Microphone blocked? This is why.</b>
          <div class="muted" style="margin-top:6px">
            This page was opened straight from a file, and browsers refuse the
            microphone to <code>file://</code> pages whatever you allow.
            Playback still works — only scoring needs this.
            <div style="margin-top:8px">In the folder holding this file, run:</div>
            <div class="cmd">${esc(SERVE_CMD)}</div>
            <div style="margin-top:6px">then open <b>http://localhost:8000</b> and use it there.</div>
          </div>
        </div>` : ""}
      <p class="sec-label" style="margin:20px 0 6px">Pace</p>
      <p class="muted tiny" style="margin:0 0 10px">
        New chunks per day. At <b>${esc(pace().label)}</b> you'd meet all
        ${CHUNKS.length} in about ${daysToFinish()} more ${daysToFinish() === 1 ? "day" : "days"}.</p>
      <div class="row" style="gap:8px">
        ${Object.keys(PACES).map(k => `
          <button class="btn sm${settings.pace === k ? " primary" : ""}" data-pace="${k}" style="flex:1">
            ${esc(PACES[k].label)}<br><span class="tiny muted">${PACES[k].fresh}/day · ${esc(PACES[k].mins)}</span>
          </button>`).join("")}
      </div>

      <div class="field" style="margin-top:14px">
        <span>Salty language <b class="muted tiny">${settings.salty === false ? "hidden" : "shown"}</b></span>
        <button class="btn sm" id="saltyTog" style="width:auto;padding:8px 16px">
          ${settings.salty === false ? "Off" : "On"}</button>
      </div>
      <p class="muted tiny" style="margin:6px 0 0">
        Off keeps the two vulgar chunks out of your deck. You'll still hear
        them in the wild, so they're only hidden, never unlearned.</p>

      <div class="field">
        <span>Speed <b id="rateVal" class="muted tiny">${settings.rate.toFixed(2)}×</b></span>
        <input type="range" id="rate" min="0.6" max="1.2" step="0.02" value="${settings.rate}">
      </div>
      <div class="field">
        <span>Sounds</span>
        <button class="btn sm" id="soundTog" style="width:auto;padding:8px 16px">
          ${settings.sound === false ? "Off" : "On"}</button>
      </div>
      <button class="btn sm" id="testVoice" style="margin-top:12px">Test: ¿Qué onda, güey?</button>

      <p class="sec-label" style="margin:20px 0 6px">Backup</p>
      <p class="muted tiny" style="margin:0 0 10px">
        Progress lives in this browser only. Clearing site data erases it —
        export a file to keep it, or to move to another device.</p>
      <div class="row" style="gap:8px">
        <button class="btn sm" id="expBtn" style="flex:1">⬇️ Export</button>
        <button class="btn sm" id="impBtn" style="flex:1">⬆️ Import</button>
      </div>
      <input type="file" id="impFile" accept="application/json,.json" style="display:none">
      <p class="tiny muted center" style="margin:8px 0 0" id="backupNote">
        ${Object.keys(srs).length} chunks · ${liveStreak()} day streak · ${totals.reviews} reviews</p>
      <button class="btn sm ghost" id="reset" style="margin-top:10px;color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)">Reset all progress</button>
    </div>`;
  document.body.appendChild(wrap);

  const close = () => wrap.remove();
  wrap.querySelector("[data-close]").onclick = close;
  wrap.querySelector("#closeSheet").onclick = close;
  const sel = wrap.querySelector("#voiceSel");
  sel.onchange = () => { settings.voice = sel.value || null; saveSettings(); };
  const rate = wrap.querySelector("#rate");
  rate.oninput = () => {
    settings.rate = parseFloat(rate.value);
    wrap.querySelector("#rateVal").textContent = settings.rate.toFixed(2) + "×";
    saveSettings();
  };
  wrap.querySelectorAll("[data-pace]").forEach(b => {
    b.onclick = () => {
      settings.pace = b.dataset.pace;
      saveSettings();
      close();
      openSettings();
    };
  });
  const salty = wrap.querySelector("#saltyTog");
  salty.onclick = () => {
    settings.salty = settings.salty === false;
    saveSettings();
    close();
    openSettings();
  };
  const tog = wrap.querySelector("#soundTog");
  tog.onclick = () => {
    settings.sound = settings.sound === false;
    saveSettings();
    tog.textContent = settings.sound === false ? "Off" : "On";
    if(settings.sound) SFX.right();
  };
  wrap.querySelector("#testVoice").onclick = () => speak("¿Qué onda, güey? ¿Cómo has estado?");

  const note = wrap.querySelector("#backupNote");
  const file = wrap.querySelector("#impFile");
  wrap.querySelector("#expBtn").onclick = exportProgress;
  wrap.querySelector("#impBtn").onclick = () => file.click();
  file.onchange = () => {
    const f = file.files && file.files[0];
    if(!f) return;
    file.value = "";
    if(!confirm("Replace the progress on this device with the backup? This can't be undone.")) return;
    importProgress(f, (err, n) => {
      if(err){ note.textContent = err; note.style.color = "var(--red)"; return; }
      note.textContent = `Restored ${n} section${n===1?"":"s"} — reloading…`;
      note.style.color = "var(--green)";
      setTimeout(() => location.reload(), 700);
    });
  };
  wrap.querySelector("#reset").onclick = () => {
    if(!confirm("Erase your deck, streak and all progress? This can't be undone.")) return;
    srs = {}; streak = {count:0,last:null,days:{}}; scores = {}; ears = {};
    dialogDone = {}; drills = {}; skipped = {}; unlocked = {};
    LS.set("unlocked", unlocked);
    combo = 0;
    totals = {reviews:0, shadowReps:0, attempts:0, drills:0, bestCombo:0};
    saveSrs(); saveStreak(); saveScores(); saveEars(); saveDialogs();
    saveDrills(); saveSkipped(); saveTotals();
    leaveMode();
    session = null; shadowQ = null; learnCard = null; earQ = null; flow = null;
    close(); go("home"); toast("Progress reset");
  };
}

/* ---------- 7. EVENTS ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-speak],[data-go],[data-learn],[data-reveal],[data-grade],[data-shadow],[data-sheet],[data-filter],[data-open],[data-add],[data-ear],[data-ear-pick],[data-drill],[data-dlg],[data-dlg-pick],[data-dlg-act],[data-session],[data-intro],[data-goal]");
  if(!t) return;

  if(t.dataset.speak !== undefined){ speak(t.dataset.speak); return; }
  if(t.dataset.go){
    leaveMode();
    session = null; go(t.dataset.go); return;
  }
  if(t.dataset.sheet){
    const s = t.dataset.sheet;
    if(s === "milestones") openMilestones();
    else if(s === "goals")  openGoals();
    else openSettings();
    return;
  }
  if(t.dataset.session){ leaveMode(); startSessionFlow(); return; }

  if(t.dataset.goal){
    const g = t.dataset.goal;
    myGoals = myGoals.includes(g) ? myGoals.filter(x => x !== g) : myGoals.concat(g);
    saveGoals();
    learnCard = null;                       // the queue order just changed
    if(tab === "intro") render(); else openGoals();
    return;
  }
  if(t.dataset.intro){
    /* One step past the cards is the goal picker. */
    if(t.dataset.intro === "next" && introStep < INTRO.length){ introStep++; return render(); }
    seenIntro = true; LS.set("seenIntro", true);
    go("home"); return;
  }

  /* ----- Listen ----- */
  if(t.dataset.ear){
    const act = t.dataset.ear;
    if(act === "again"){ startEarRound(); return render(); }
    if(act === "play")  speak(earCard.ex.es, EAR_RATES[earLevel(earCard.c.id)]);
    if(act === "slow")  speak(earCard.ex.es, 0.6);
    if(act === "next"){
      earCard = null;
      if(flowTick("listen")) return;
      render();
    }
    return;
  }
  if(t.dataset.earPick !== undefined){
    const id = earCard.c.id;
    earPick = t.dataset.earPick;
    const lvl = earLevel(id), right = earPick === earCard.ex.en;
    ears[id] = right ? Math.min(EAR_RATES.length - 1, lvl + 1) : Math.max(0, lvl - 1);
    saveEars(); markStudied();
    earScore.total++; if(right) earScore.right++;
    right ? gotItRight() : gotItWrong();
    render(); return;
  }

  /* ----- Quick-fire ----- */
  if(t.dataset.drill){
    const act = t.dataset.drill;
    if(act === "start" || act === "retry"){ startDrill(); return; }
    if(act === "stop"){ clearDrillTimer(); stopListening(); return; }
    if(act === "reveal"){ drillState = "done"; drillResult = {blocked:"Mic unavailable — check it yourself."}; render(); return; }
    if(act === "again"){ clearDrillTimer(); stopListening(); drillRound = null; drillCard = null; render(); return; }
    if(act === "next"){
      clearDrillTimer(); stopListening();
      drillRound.done++;
      if(drillResult && !drillResult.blocked) drillRound.scores.push(drillResult.score);
      drillCard = null; render(); return;
    }
  }

  /* ----- Conversations ----- */
  if(t.dataset.dlg){ startDialogue(t.dataset.dlg); render(); return; }
  if(t.dataset.dlgPick !== undefined){
    const turn = dlg.d.turns[dlg.turn];
    dlg.picked = t.dataset.dlgPick;
    if(dlg.picked === turn.es){ dlg.right++; gotItRight(); } else gotItWrong();
    speak(turn.es);
    markStudied();
    render(); return;
  }
  if(t.dataset.dlgAct){
    const act = t.dataset.dlgAct;
    if(act === "next"){
      dlg.turn++;
      prepDialogueTurn();
      if(dlg.turn >= dlg.d.turns.length){
        const pct = dlg.total ? Math.round(dlg.right / dlg.total * 100) : 100;
        if(dialogDone[dlg.d.id] == null || pct > dialogDone[dlg.d.id]){
          dialogDone[dlg.d.id] = pct; saveDialogs();
        }
      }
    }
    if(act === "replay") startDialogue(dlg.d.id);
    if(act === "list")   dlg = null;
    render(); return;
  }

  if(t.dataset.learn){
    if(t.dataset.learn === "add"){
      srs[learnCard.id] = newState(); saveSrs();
      delete skipped[learnCard.id]; saveSkipped();
      markStudied();
      toast("Added — review it in a minute");
      learnCard = null;
      if(flowTick("learn")) return;
    }else{
      /* Persisted, so a skip actually sticks instead of resurfacing next visit. */
      skipped[learnCard.id] = Date.now(); saveSkipped();
      learnCard = null;
    }
    render(); return;
  }

  if(t.dataset.reveal){ session.shown = true; render(); return; }

  if(t.dataset.grade){
    const c = session.card.chunk;
    srs[c.id] = schedule(srs[c.id], GRADE[t.dataset.grade]);
    saveSrs();
    totals.reviews++; saveTotals();
    markStudied();
    if(GRADE[t.dataset.grade] === GRADE.again){ session.queue.push(c.id); gotItWrong(); }
    else { session.done++; gotItRight(); checkMilestones(); flowTick("review"); }
    nextCard();
    if(!session.card && flow) return flowNext();
    render(); return;
  }

  if(t.dataset.shadow){
    const item = shadowQ[0];
    const act = t.dataset.shadow;
    if(act === "again"){ shadowQ = null; shadowSpoken = null; resetAttempt(); return render(); }
    if(act === "listen"){ beginListening(); return; }
    if(act === "stop"){ stopListening(); listening = false; render(); return; }
    if(act === "rep"){
      item.reps++; totals.shadowReps++; saveTotals(); markStudied();
      resetAttempt();
      if(item.reps >= 3){ shadowQ.shift(); shadowDoneCount++; shadowSpoken = null; }
      else { shadowSpoken = item.c.id; speak(item.ex.es); }
    }else{
      stopListening(); resetAttempt(); shadowQ.shift(); shadowDoneCount++; shadowSpoken = null;
    }
    render(); return;
  }

  if(t.dataset.filter){ browseFilter = t.dataset.filter; render(); return; }
  if(t.dataset.open){ openChunk = openChunk === t.dataset.open ? null : t.dataset.open; render(); return; }
  if(t.dataset.add){
    srs[t.dataset.add] = newState(); saveSrs();
    toast("Added to your deck"); render(); return;
  }
});

document.addEventListener("input", e => {
  if(e.target.id === "q"){
    browseQuery = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const el = $("#q");
    if(el){ el.focus(); el.setSelectionRange(pos, pos); }
  }
});

/* ---------- 8. PWA INSTALL (manifest generated inline) ---------- */
(function manifest(){
  const cv = document.createElement("canvas");
  const icon = size => {
    cv.width = cv.height = size;
    const x = cv.getContext("2d");
    x.fillStyle = "#12100e"; x.fillRect(0,0,size,size);
    x.fillStyle = "#f59e0b";
    x.font = `700 ${size*0.56}px -apple-system,Segoe UI,Roboto,sans-serif`;
    x.textAlign = "center"; x.textBaseline = "middle";
    x.fillText("¡", size/2, size*0.52);
    return cv.toDataURL("image/png");
  };
  const mf = {
    name: "Calle — Real Mexican Spanish",
    short_name: "Calle",
    start_url: location.pathname,
    display: "standalone",
    background_color: "#12100e",
    theme_color: "#12100e",
    icons: [
      {src: icon(192), sizes: "192x192", type: "image/png", purpose: "any"},
      {src: icon(512), sizes: "512x512", type: "image/png", purpose: "any"}
    ]
  };
  const link = document.createElement("link");
  link.rel = "manifest";
  link.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], {type:"application/manifest+json"}));
  document.head.appendChild(link);

  const apple = document.createElement("link");
  apple.rel = "apple-touch-icon";
  apple.href = icon(180);
  document.head.appendChild(apple);
})();

/* ---------- 9. GO ---------- */
render();
</script>
