<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12100e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calle">
<title>Calle — Real Mexican Spanish</title>
<style>
:root{
  --bg:#12100e; --surface:#1c1917; --surface-2:#292524; --surface-3:#3a3532;
  --text:#fafaf9; --muted:#a8a29e; --faint:#57534e;
  --accent:#f59e0b; --accent-ink:#1c1200;
  --teal:#2dd4bf; --green:#4ade80; --red:#f87171; --blue:#60a5fa; --violet:#c084fc;
  --radius:16px; --radius-sm:10px;
  --tap:#ffffff0d;
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#faf8f5; --surface:#ffffff; --surface-2:#f4f1ec; --surface-3:#e7e2da;
    --text:#1c1917; --muted:#78716c; --faint:#a8a29e;
    --accent:#b45309; --accent-ink:#fff;
    --teal:#0d9488; --green:#16a34a; --red:#dc2626; --blue:#2563eb; --violet:#7c3aed;
    --tap:#0000000a;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  font-size:16px; line-height:1.5;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input{font:inherit}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
#view{flex:1;padding:16px 16px calc(84px + var(--safe-b));animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- header ---------- */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 20px}
.hdr h1{font-size:26px;line-height:1.1;margin:0;letter-spacing:-.02em;font-weight:700}
.hdr p{margin:2px 0 0;color:var(--muted);font-size:13px}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:17px;flex:none}
.icon-btn:active{background:var(--surface-3)}

/* ---------- generic ---------- */
.card{background:var(--surface);border-radius:var(--radius);padding:16px}
.card + .card{margin-top:12px}
.row{display:flex;gap:12px}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.center{text-align:center}
.stack>*+*{margin-top:12px}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:15px 18px;border-radius:14px;font-weight:650;font-size:16px;
  background:var(--surface-2);transition:transform .08s,filter .12s;
}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--surface-3);color:var(--muted)}
.btn.sm{padding:11px 14px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.4;pointer-events:none}

.badge{
  display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;
  font-weight:650;letter-spacing:.03em;text-transform:uppercase;
  background:var(--surface-2);color:var(--muted);
}
.badge.tier1{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.badge.tier2{background:color-mix(in srgb,var(--blue) 18%,transparent);color:var(--blue)}
.badge.tier3{background:color-mix(in srgb,var(--violet) 18%,transparent);color:var(--violet)}
.badge.vulgar{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}

/* ---------- home ---------- */
.streak{
  display:flex;align-items:center;gap:14px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,var(--surface)),var(--surface));
  border-radius:var(--radius);padding:18px;
}
.streak .flame{font-size:34px;line-height:1}
.streak b{font-size:28px;display:block;line-height:1.1;letter-spacing:-.02em}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border-radius:var(--radius-sm);padding:13px 10px;text-align:center}
.stat b{display:block;font-size:22px;letter-spacing:-.02em;line-height:1.2}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.action{
  display:flex;align-items:center;gap:14px;background:var(--surface);
  border-radius:var(--radius);padding:16px;width:100%;text-align:left;
}
.action:active{background:var(--surface-2)}
.action .em{font-size:26px;flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--surface-2)}
.action .t{flex:1;min-width:0}
.action .t b{display:block;font-size:16px}
.action .t span{font-size:13px;color:var(--muted)}
.action .n{
  flex:none;min-width:28px;height:28px;padding:0 9px;border-radius:99px;background:var(--accent);
  color:var(--accent-ink);font-size:13px;font-weight:700;display:grid;place-items:center;
}
.action .n.zero{background:var(--surface-2);color:var(--faint)}

/* ---------- chunk card ---------- */
.chunk-hero{text-align:center;padding:8px 0 4px}
.chunk-hero .es{
  font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.15;
  display:inline-flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;
}
.chunk-hero .meaning{color:var(--muted);font-size:16px;margin-top:8px}
.chunk-hero .lit{color:var(--faint);font-size:13px;margin-top:6px;font-style:italic}
.spk{
  width:40px;height:40px;border-radius:50%;background:var(--surface-2);
  display:inline-grid;place-items:center;font-size:17px;flex:none;
}
.spk:active{background:var(--accent);color:var(--accent-ink)}
.spk.sm{width:32px;height:32px;font-size:14px}

.ex{display:flex;gap:12px;align-items:flex-start;padding:13px 0}
.ex + .ex{border-top:1px solid var(--surface-2)}
.ex .txt{flex:1;min-width:0}
.ex .es{font-size:17px;font-weight:550;line-height:1.4}
.ex .en{font-size:14px;color:var(--muted);margin-top:3px}
.sec-label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:0 0 4px}

/* ---------- review ---------- */
.progbar{height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-bottom:18px}
.progbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.cloze{font-size:24px;font-weight:650;line-height:1.45;letter-spacing:-.015em;text-align:center;padding:10px 0}
.blank{
  display:inline-block;min-width:88px;border-bottom:3px solid var(--accent);
  vertical-align:baseline;color:transparent;
}
.blank.shown{color:var(--accent);border-bottom-color:transparent}
.prompt-en{text-align:center;color:var(--muted);font-size:15px;margin-top:10px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade{padding:13px 4px;border-radius:13px;background:var(--surface-2);text-align:center;transition:transform .08s}
.grade:active{transform:scale(.95)}
.grade b{display:block;font-size:14px;font-weight:650}
.grade span{font-size:11px;color:var(--muted);display:block;margin-top:2px}
.grade.again b{color:var(--red)} .grade.hard b{color:var(--accent)}
.grade.good b{color:var(--green)} .grade.easy b{color:var(--teal)}

/* ---------- shadow ---------- */
.shadow-big{
  width:100%;aspect-ratio:1/1;max-height:300px;border-radius:24px;
  background:linear-gradient(145deg,color-mix(in srgb,var(--teal) 20%,var(--surface)),var(--surface));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;
}
.shadow-big .es{font-size:23px;font-weight:650;line-height:1.35;letter-spacing:-.015em}
.shadow-big .en{font-size:14px;color:var(--muted)}
.pulse{animation:pulse 1s ease infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.reps{display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--surface-3)}
.dot.on{background:var(--teal)}

/* ---------- stats ---------- */
.heat{display:grid;grid-template-columns:repeat(13,1fr);gap:3px}
.heat i{aspect-ratio:1/1;border-radius:2.5px;background:var(--surface-2)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 30%,var(--surface-2))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 55%,var(--surface-2))}
.heat i.l3{background:color-mix(in srgb,var(--accent) 80%,var(--surface-2))}
.heat i.l4{background:var(--accent)}
.bar-row{display:flex;align-items:center;gap:10px;font-size:13px;padding:5px 0}
.bar-row .nm{width:96px;flex:none;color:var(--muted);font-size:12px;text-transform:capitalize}
.bar-row .track{flex:1;height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar-row .track i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar-row .v{width:42px;text-align:right;flex:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- browse ---------- */
.search{width:100%;padding:12px 14px;border-radius:13px;background:var(--surface-2);border:none;color:var(--text);outline:none}
.search::placeholder{color:var(--faint)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 0;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 13px;border-radius:99px;background:var(--surface-2);font-size:13px;white-space:nowrap;flex:none;font-weight:550}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.li{display:flex;align-items:center;gap:12px;padding:13px 0;width:100%;text-align:left}
.li + .li{border-top:1px solid var(--surface-2)}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-size:16px;font-weight:600}
.li .t span{font-size:13px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{width:9px;height:9px;border-radius:50%;flex:none;background:var(--surface-3)}
.pill.learning{background:var(--accent)} .pill.review{background:var(--blue)} .pill.mastered{background:var(--green)}

/* ---------- empty ---------- */
.empty{text-align:center;padding:48px 20px}
.empty .em{font-size:46px}
.empty h3{margin:14px 0 6px;font-size:19px}
.empty p{margin:0;color:var(--muted);font-size:14px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:#000a;z-index:40;animation:fade .15s}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);
  border-radius:22px 22px 0 0;padding:20px 18px calc(24px + var(--safe-b));
  max-width:560px;margin:0 auto;max-height:86vh;overflow-y:auto;
  animation:up .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grip{width:38px;height:4px;border-radius:99px;background:var(--surface-3);margin:0 auto 16px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.field + .field{border-top:1px solid var(--surface-2)}
.field select,.field input[type=range]{background:var(--surface-2);border:none;color:var(--text);padding:8px 10px;border-radius:9px;max-width:200px}

/* ---------- nav ---------- */
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--surface-2);padding-bottom:var(--safe-b);
}
nav button{padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);position:relative}
nav button .ic{font-size:19px;line-height:1}
nav button .lb{font-size:10px;font-weight:600;letter-spacing:.01em}
nav button.on{color:var(--accent)}
nav .dot-n{position:absolute;top:6px;right:50%;margin-right:-20px;width:7px;height:7px;border-radius:50%;background:var(--accent)}

.toast{
  position:fixed;bottom:calc(90px + var(--safe-b));left:50%;transform:translateX(-50%);
  background:var(--surface-3);color:var(--text);padding:11px 18px;border-radius:99px;
  font-size:14px;font-weight:550;z-index:50;animation:fade .15s;white-space:nowrap;
}
</style>
</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav id="nav"></nav>
</div>

<script>
"use strict";
/* ============================================================
   CALLE — real-world Mexican Spanish, chunk-first.
   Single-file PWA. No network, no backend. State in localStorage.
   ============================================================ */

/* ---------- 1. CONTENT ---------- */
/* C(chunk, meaning, category, tier, register, examples[[es,en]...], literal?) */
const CAT = {
  filler:    {label:"Fillers",     em:"\u{1F4AC}"},
  reaction:  {label:"Reactions",   em:"\u{1F632}"},
  agree:     {label:"Agree / No",  em:"\u{1F44D}"},
  ask:       {label:"Questions",   em:"\u{2753}"},
  opinion:   {label:"Opinions",    em:"\u{1F9E0}"},
  connect:   {label:"Connectors",  em:"\u{1F517}"},
  soften:    {label:"Politeness",  em:"\u{1F64F}"},
  survive:   {label:"Survival",    em:"\u{1F6DF}"},
  slang:     {label:"Slang",       em:"\u{1F1F2}\u{1F1FD}"},
  verb:      {label:"Verb combos", em:"\u{2699}\u{FE0F}"},
  time:      {label:"Time",        em:"\u{23F1}\u{FE0F}"},
  social:    {label:"Social",      em:"\u{1F91D}"},
};

let _i = 0;
function C(chunk, meaning, category, tier, register, examples, literal){
  return {
    id: "c" + String(++_i).padStart(3,"0"),
    chunk, meaning, category, tier, register, literal: literal || null,
    examples: examples.map(e => ({es:e[0], en:e[1]}))
  };
}

const CHUNKS = [

/* ===== TIER 1 · FILLERS & HEDGES ===== */
C("o sea","\"I mean\" / \"like\" — the #1 Mexican filler, used to restate or stall","filler",1,"casual",[
  ["O sea, no es que no quiera ir, es que ando sin lana.","I mean, it's not that I don't want to go, it's that I'm broke."],
  ["Es mi primo, o sea, el hijo de mi tía.","He's my cousin, I mean, my aunt's son."],
  ["O sea, ¿neta hizo eso?","Like, he really did that?"]
]),
C("este...","\"um...\" — the sound Mexicans make while thinking. Use it instead of English \"uh\"","filler",1,"casual",[
  ["Este... déjame pensarlo tantito.","Um... let me think about it for a sec."],
  ["Se llama, este... ya se me fue el nombre.","His name is, um... I lost the name."]
],"\"this\""),
C("pues","\"well...\" — softens or stalls the start of any answer","filler",1,"casual",[
  ["¿Y qué hiciste? — Pues nada, me quedé en casa.","And what did you do? — Well, nothing, I stayed home."],
  ["Pues sí, tienes razón.","Well yeah, you're right."]
]),
C("la neta","\"honestly\" / \"the truth is\" — signals you're being real","filler",1,"casual",[
  ["La neta no me gustó la película.","Honestly, I didn't like the movie."],
  ["¿La neta? Estoy bien cansado.","Honestly? I'm really tired."],
  ["Dime la neta, ¿qué pasó?","Tell me the truth, what happened?"]
],"\"the net\""),
C("digo","\"I mean\" — used to correct yourself mid-sentence","filler",1,"neutral",[
  ["Llego a las tres, digo, a las cuatro.","I'll get there at three, I mean, at four."],
  ["Es mi hermana, digo, mi cuñada.","She's my sister, I mean, my sister-in-law."]
]),
C("¿no?","tag question — \"right?\" Tacked onto the end of almost anything","filler",1,"casual",[
  ["Está bien padre el lugar, ¿no?","The place is pretty cool, right?"],
  ["Ya nos vamos, ¿no?","We're leaving now, right?"]
]),
C("¿sí me explico?","\"you know what I mean?\" — checks that you're landing","filler",1,"casual",[
  ["No quiero pelear, sólo quiero entender, ¿sí me explico?","I don't want to fight, I just want to understand, you know what I mean?"],
  ["Es más barato pero no tan bueno, ¿sí me explico?","It's cheaper but not as good, you know?"]
]),
C("tipo","\"like\" — approximating, same as English filler \"like\"","filler",1,"casual",[
  ["Llegaron tipo cincuenta personas.","Like fifty people showed up."],
  ["Fue tipo hace dos años.","It was like two years ago."]
]),
C("güey","\"dude\" — spelled güey or wey. Punctuation between friends, rude with strangers","filler",1,"casual",[
  ["¿Qué onda, güey?","What's up, dude?"],
  ["No manches, güey, eso está cañón.","No way, dude, that's rough."]
]),
C("no sé","\"I dunno\" — also a hedge dropped mid-sentence","filler",1,"neutral",[
  ["No sé, se me hace raro.","I dunno, it seems weird to me."],
  ["¿Vamos? — No sé, tú dime.","Should we go? — I dunno, you tell me."]
]),
C("es que","\"it's just that\" — the universal way to start an excuse or reason","filler",1,"neutral",[
  ["Es que no me avisaron.","It's just that nobody told me."],
  ["Es que ando corriendo, perdón.","It's just that I'm in a rush, sorry."]
]),
C("bueno","\"well\" / \"okay\" — also how you answer the phone in Mexico","filler",1,"neutral",[
  ["¿Bueno? — ¿Qué onda?","Hello? — What's up?"],
  ["Bueno, ya qué.","Well, whatever."]
]),
C("¿verdad?","\"right?\" — slightly softer than ¿no?","filler",1,"neutral",[
  ["Tú eres el hermano de Ana, ¿verdad?","You're Ana's brother, right?"],
  ["Hace mucho calor, ¿verdad?","It's really hot, right?"]
]),
C("cómo te diré","\"how can I put it\" — buys you several seconds","filler",2,"neutral",[
  ["Es, cómo te diré, un poco intenso.","He's, how can I put it, a little intense."],
  ["Estuvo, cómo te diré... raro.","It was, how do I say it... weird."]
]),
C("¿va?","\"deal?\" / \"cool?\" — checks agreement at the end of a plan","filler",1,"casual",[
  ["Nos vemos a las ocho, ¿va?","We'll meet at eight, deal?"],
  ["Yo llevo la bebida y tú la comida, ¿va?","I'll bring drinks and you bring food, cool?"]
]),
C("más o menos","\"more or less\" / \"sort of\" — the safest answer to almost any question","filler",1,"neutral",[
  ["¿Hablas español? — Más o menos.","Do you speak Spanish? — Sort of."],
  ["Está más o menos lejos.","It's kind of far."]
]),

/* ===== TIER 1 · MEXICAN SLANG CORE ===== */
C("¿qué onda?","\"what's up?\" — the default Mexican greeting","slang",1,"casual",[
  ["¿Qué onda, cómo has estado?","What's up, how've you been?"],
  ["¿Qué onda con tu hermano? ¿Ya llegó?","What's up with your brother? Did he arrive?"]
],"\"what wave?\""),
C("no manches","\"no way!\" — disbelief, surprise, or outrage. Safe in any company","reaction",1,"casual",[
  ["¡No manches! ¿Te ganaste el sorteo?","No way! You won the raffle?"],
  ["No manches, otra vez se descompuso.","No way, it broke down again."]
],"\"don't stain\""),
C("órale","all-purpose: \"wow\", \"alright\", \"come on\", \"let's go\"","slang",1,"casual",[
  ["¡Órale! No sabía que cocinabas así.","Wow! I didn't know you cooked like that."],
  ["Órale pues, nos vemos mañana.","Alright then, see you tomorrow."],
  ["¡Órale, apúrate!","Come on, hurry up!"]
]),
C("ahorita","\"right now\" — but famously elastic: could mean now, in 20 minutes, or never","time",1,"casual",[
  ["Ahorita voy, déjame termino esto.","I'm coming right now, let me finish this."],
  ["Ahorita te marco.","I'll call you in a bit."],
  ["¿Me ayudas? — Ahorita.","Can you help me? — In a sec."]
],"tiny-now (diminutive of ahora)"),
C("neta","\"for real\" — as a question it's \"seriously?\"","slang",1,"casual",[
  ["¿Neta? No te creo.","For real? I don't believe you."],
  ["Neta que estuvo brutal el concierto.","The concert was seriously insane."]
]),
C("chido","\"cool\" / \"awesome\" — very Mexican","slang",1,"casual",[
  ["¡Qué chido tu carro!","Your car is so cool!"],
  ["Estuvo chido el viaje.","The trip was cool."]
]),
C("qué padre","\"how cool\" — interchangeable with chido, slightly broader","reaction",1,"casual",[
  ["¡Qué padre que ya te dieron el trabajo!","How cool that they gave you the job!"],
  ["Qué padre está tu depa.","Your apartment is really nice."]
],"\"how father\""),
C("sale","\"okay\" / \"deal\" — closes a plan. Often \"sale y vale\"","slang",1,"casual",[
  ["Nos vemos allá. — ¡Sale!","See you there. — Deal!"],
  ["Sale, yo te marco al rato.","Okay, I'll call you later."]
]),
C("ni modo","\"oh well\" / \"nothing to be done\" — pure Mexican resignation","slang",1,"casual",[
  ["Se canceló el vuelo. — Pues ni modo.","The flight got cancelled. — Well, oh well."],
  ["Ni modo, será la próxima.","Oh well, next time."]
]),
C("¡aguas!","\"watch out!\" / \"careful!\"","slang",1,"casual",[
  ["¡Aguas con el escalón!","Watch out for the step!"],
  ["Aguas, viene un coche.","Careful, a car's coming."]
],"\"waters!\""),
C("¿mande?","\"pardon?\" — the distinctly Mexican way to ask someone to repeat","survive",1,"neutral",[
  ["¿Mande? No te escuché.","Pardon? I didn't hear you."],

/* ---------- 2. STORAGE ---------- */
const LS = {
  get(k, dflt){ try{ const v = localStorage.getItem("calle_"+k); return v==null ? dflt : JSON.parse(v); }catch(e){ return dflt; } },
  set(k, v){ try{ localStorage.setItem("calle_"+k, JSON.stringify(v)); }catch(e){} },
};

const DAY = 864e5;
const todayKey = () => new Date().toISOString().slice(0,10);

let srs      = LS.get("srs", {});          // id -> {ease,interval,due,reps,lapses,status}
let streak   = LS.get("streak", {count:0, last:null, days:{}});
let totals   = LS.get("totals", {reviews:0, shadowReps:0});
let settings = LS.get("settings", {rate:0.92, voice:null});

const saveSrs      = () => LS.set("srs", srs);
const saveStreak   = () => LS.set("streak", streak);
const saveTotals   = () => LS.set("totals", totals);
const saveSettings = () => LS.set("settings", settings);

/* ---------- 3. SRS ENGINE (SM-2 lite) ---------- */
const LEARN_STEPS = [1/1440, 10/1440];   // 1 min, 10 min (in days)
const GRADE = {again:0, hard:1, good:2, easy:3};
const MASTERED_AT = 21;                  // days interval == "mastered"

function newState(){
  return {ease:2.5, interval:0, due:Date.now(), reps:0, lapses:0, step:0, status:"learning"};
}

function schedule(st, grade){
  const s = {...st};
  s.reps++;
  if(s.status === "learning"){
    if(grade === GRADE.again){ s.step = 0; }
    else if(grade === GRADE.easy){ s.status = "review"; s.interval = 4; s.step = 0; }
    else if(grade === GRADE.hard){ /* repeat current step */ }
    else { s.step++; if(s.step >= LEARN_STEPS.length){ s.status = "review"; s.interval = 1; } }
    s.due = s.status === "review"
      ? Date.now() + s.interval * DAY
      : Date.now() + LEARN_STEPS[Math.min(s.step, LEARN_STEPS.length-1)] * DAY;
    return s;
  }
  // review cards
  if(grade === GRADE.again){
    s.lapses++; s.ease = Math.max(1.3, s.ease - 0.2);
    s.status = "learning"; s.step = 0; s.interval = 0;
    s.due = Date.now() + LEARN_STEPS[0] * DAY;
    return s;
  }
  if(grade === GRADE.hard){ s.ease = Math.max(1.3, s.ease - 0.15); s.interval = Math.max(1, s.interval * 1.2); }
  else if(grade === GRADE.good){ s.interval = Math.max(1, s.interval * s.ease); }
  else { s.ease = Math.min(2.8, s.ease + 0.15); s.interval = Math.max(1, s.interval * s.ease * 1.3); }
  s.interval = Math.round(s.interval * 10) / 10;
  s.due = Date.now() + s.interval * DAY;
  return s;
}

function previewInterval(st, grade){
  const s = schedule(st, grade);
  const d = (s.due - Date.now()) / DAY, mins = d * 1440;
  if(mins < 1)  return "<1m";
  if(mins < 60) return Math.round(mins) + "m";
  if(d < 1)     return Math.round(d*24) + "h";
  if(d < 30)    return Math.round(d) + "d";
  return (d/30).toFixed(1).replace(/\.0$/,"") + "mo";
}

const inDeck   = id => !!srs[id];
const dueCards = () => Object.keys(srs).filter(id => srs[id].due <= Date.now());
const newCards = () => CHUNKS.filter(c => !inDeck(c.id)).sort((a,b) => a.tier - b.tier);
const statusOf = id => {
  const s = srs[id];
  if(!s) return "new";
  if(s.status === "learning") return "learning";
  return s.interval >= MASTERED_AT ? "mastered" : "review";
};

function markStudied(){
  const t = todayKey();
  streak.days[t] = (streak.days[t] || 0) + 1;
  if(streak.last !== t){
    const y = new Date(Date.now() - DAY).toISOString().slice(0,10);
    streak.count = streak.last === y ? streak.count + 1 : 1;
    streak.last = t;
  }
  saveStreak();
}

/* current streak, recomputed so it decays when you skip a day */
function liveStreak(){
  if(!streak.last) return 0;
  const t = todayKey(), y = new Date(Date.now()-DAY).toISOString().slice(0,10);
  return (streak.last === t || streak.last === y) ? streak.count : 0;
}

/* ---------- 4. SPEECH ---------- */
let voices = [];
function loadVoices(){ voices = (window.speechSynthesis && speechSynthesis.getVoices()) || []; }
if(window.speechSynthesis){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function esVoices(){ return voices.filter(v => /^es/i.test(v.lang)); }
function pickVoice(){
  const list = esVoices();
  if(!list.length) return null;
  if(settings.voice){
    const saved = list.find(v => v.voiceURI === settings.voice);
    if(saved) return saved;
  }
  return list.find(v => /es[-_]MX/i.test(v.lang))
      || list.find(v => /es[-_]US/i.test(v.lang))
      || list.find(v => /es[-_](419|CO|AR)/i.test(v.lang))
      || list[0];
}
function speak(text, rate){
  if(!window.speechSynthesis) return toast("Speech not supported here");
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "es-MX";
  u.rate = rate || settings.rate;
  const v = pickVoice();
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}

/* ---------- 5. HELPERS ---------- */
const $  = (sel, root) => (root||document).querySelector(sel);
const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const byId = id => CHUNKS.find(c => c.id === id);
const shuffle = a => { const r = a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [r[i],r[j]]=[r[j],r[i]]; } return r; };

/* Blank the chunk inside an example sentence. Falls back to produce-mode
   when the sentence uses a variant form (conjugated, contracted, etc.). */
function makeCloze(sentence, chunk){
  const core = chunk.replace(/\s*\+.*$/, "").replace(/[¿?¡!.]/g, "").trim();
  const i = sentence.toLowerCase().indexOf(core.toLowerCase());
  if(i < 0 || !core) return null;
  return {
    before: sentence.slice(0, i),
    hidden: sentence.slice(i, i + core.length),
    after:  sentence.slice(i + core.length)
  };
}

let toastTimer;
function toast(msg){
  const old = $(".toast"); if(old) old.remove();
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 1700);
}

function speakerBtn(text, small){
  return `<button class="spk${small?" sm":""}" data-speak="${esc(text)}" aria-label="Play audio">\u{1F50A}</button>`;
}
function examplesHtml(c){
  return c.examples.map(e => `
    <div class="ex">
      ${speakerBtn(e.es, true)}
      <div class="txt"><div class="es">${esc(e.es)}</div><div class="en">${esc(e.en)}</div></div>
    </div>`).join("");
}
function tierBadge(c){
  const reg = c.register === "vulgar" ? `<span class="badge vulgar">careful</span>` : "";
  return `<span class="badge tier${c.tier}">Tier ${c.tier}</span>
          <span class="badge">${CAT[c.category].label}</span> ${reg}`;
}

/* ----- Review ----- */
function startSession(){
  const ids = shuffle(dueCards()).slice(0, 25);
  session = {queue: ids, done: 0, total: ids.length, shown: false, card: null};
  nextCard();
}
function nextCard(){
  session.shown = false;
  const id = session.queue.shift();
  if(!id){ session.card = null; return; }
  const c = byId(id);
  const ex = c.examples[Math.floor(Math.random() * c.examples.length)];
  session.card = {chunk: c, ex, cloze: makeCloze(ex.es, c.chunk)};
}

function renderReview(){
  const due = dueCards().length;
  if(!session && !due){
    const next = Object.values(srs).sort((a,b)=>a.due-b.due)[0];
    const when = next ? relTime(next.due) : null;
    view.innerHTML = header("Review", "Spaced recall") + empty("\u{2705}", "All caught up",
      when ? `Next chunk is ready ${when}.` : "Add some chunks from Learn to start reviewing.");
    return;
  }
  if(!session) startSession();
  if(!session.card){
    const n = session.done;
    session = null;
    view.innerHTML = header("Review", "Session complete") + empty("\u{1F44F}", `${n} chunk${n===1?"":"s"} reviewed`,
      "Nice. Come back when the next batch is due — or go learn something new.") +
      `<button class="btn primary" data-go="learn">Learn new chunks</button>`;
    return;
  }

  const {chunk:c, ex, cloze} = session.card;
  const shown = session.shown;
  const pct = session.total ? (session.done / session.total) * 100 : 0;

  const prompt = cloze
    ? `<div class="cloze">${esc(cloze.before)}<span class="blank${shown?" shown":""}">${esc(cloze.hidden)}</span>${esc(cloze.after)}</div>
       <div class="prompt-en">${esc(ex.en)}</div>`
    : `<div class="prompt-en" style="font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)">How would you say</div>
       <div class="cloze">${esc(ex.en)}</div>
       ${shown ? `<div class="prompt-en" style="color:var(--accent);font-size:19px;font-weight:600;margin-top:12px">${esc(ex.es)}</div>` : ""}`;

  view.innerHTML = header("Review", `${session.done+1} of ${session.total}`) + `
    <div class="progbar"><i style="width:${pct}%"></i></div>
    <div class="card" style="padding:22px 16px">${prompt}</div>
    ${shown ? `
      <div class="card">
        <div class="center" style="margin-bottom:8px">${tierBadge(c)}</div>
        <div class="chunk-hero" style="padding-top:0">
          <div class="es" style="font-size:27px">${esc(c.chunk)} ${speakerBtn(ex.es)}</div>
          <div class="meaning">${esc(c.meaning)}</div>
        </div>
      </div>` : ""}
    <div style="margin-top:16px">
      ${shown ? gradesHtml(srs[c.id]) : `<button class="btn primary" data-reveal="1">Show answer</button>`}
    </div>`;

  if(shown) speak(ex.es);
}

function gradesHtml(st){
  const g = [["again","Again"],["hard","Hard"],["good","Good"],["easy","Easy"]];
  return `<div class="grades">` + g.map(([k,label]) =>
    `<button class="grade ${k}" data-grade="${k}"><b>${label}</b><span>${previewInterval(st, GRADE[k])}</span></button>`
  ).join("") + `</div>`;
}

function relTime(ts){
  const d = (ts - Date.now()) / DAY;
  if(d <= 0) return "now";
  if(d < 1/24) return "in a few minutes";
  if(d < 1) return "in " + Math.round(d*24) + "h";
  if(d < 2) return "tomorrow";
  return "in " + Math.round(d) + " days";
}

      <h3 style="margin:0 0 4px;font-size:19px">Settings</h3>
      <p class="muted tiny" style="margin:0 0 12px">Audio uses your device's built-in Spanish voices.</p>
      <div class="field">
        <span>Voice</span>
        <select id="voiceSel">
          ${list.length ? list.map(v =>
            `<option value="${esc(v.voiceURI)}"${settings.voice===v.voiceURI?" selected":""}>${esc(v.name)} (${esc(v.lang)})</option>`
          ).join("") : `<option value="">No Spanish voice installed</option>`}
        </select>
      </div>
      <div class="field">
        <span>Speed <b id="rateVal" class="muted tiny">${settings.rate.toFixed(2)}×</b></span>
        <input type="range" id="rate" min="0.6" max="1.2" step="0.02" value="${settings.rate}">
      </div>
      <button class="btn sm" id="testVoice" style="margin-top:12px">Test: ¿Qué onda, güey?</button>
      <button class="btn sm ghost" id="reset" style="margin-top:10px;color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)">Reset all progress</button>
    </div>`;
  document.body.appendChild(wrap);

  const close = () => wrap.remove();
  wrap.querySelector("[data-close]").onclick = close;
  const sel = wrap.querySelector("#voiceSel");
  sel.onchange = () => { settings.voice = sel.value || null; saveSettings(); };
  const rate = wrap.querySelector("#rate");
  rate.oninput = () => {
    settings.rate = parseFloat(rate.value);
    wrap.querySelector("#rateVal").textContent = settings.rate.toFixed(2) + "×";
    saveSettings();
  };
  wrap.querySelector("#testVoice").onclick = () => speak("¿Qué onda, güey? ¿Cómo has estado?");
  wrap.querySelector("#reset").onclick = () => {
    if(!confirm("Erase your deck, streak and all progress? This can't be undone.")) return;
    srs = {}; streak = {count:0,last:null,days:{}}; totals = {reviews:0,shadowReps:0};
    saveSrs(); saveStreak(); saveTotals();
    session = null; shadowQ = null; learnCard = null;
    close(); go("home"); toast("Progress reset");
  };
}

/* ---------- 7. EVENTS ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-speak],[data-go],[data-learn],[data-reveal],[data-grade],[data-shadow],[data-sheet],[data-filter],[data-open],[data-add]");
  if(!t) return;

  if(t.dataset.speak !== undefined){ speak(t.dataset.speak); return; }
  if(t.dataset.go){ session = null; go(t.dataset.go); return; }
  if(t.dataset.sheet){ openSettings(); return; }

  if(t.dataset.learn){
    if(t.dataset.learn === "add"){
      srs[learnCard.id] = newState(); saveSrs();
      toast("Added — review it in a minute");
    }else{
      const pool = newCards();
      const i = pool.findIndex(c => c.id === learnCard.id);
      learnCard = pool[i+1] || pool[0];
      render(); return;
    }
    learnCard = null; render(); return;
  }

  if(t.dataset.reveal){ session.shown = true; render(); return; }

  if(t.dataset.grade){
    const c = session.card.chunk;
    srs[c.id] = schedule(srs[c.id], GRADE[t.dataset.grade]);
    saveSrs();
    totals.reviews++; saveTotals();
    markStudied();
    if(GRADE[t.dataset.grade] === GRADE.again) session.queue.push(c.id);
    else session.done++;
    nextCard();
    render(); return;
  }

  if(t.dataset.shadow){
    const item = shadowQ[0];
    if(t.dataset.shadow === "rep"){
      item.reps++; totals.shadowReps++; saveTotals(); markStudied();
      if(item.reps >= 3) shadowQ.shift();
      else speak(item.ex.es);
    }else{
      shadowQ.shift();
    }
    render(); return;
  }

  if(t.dataset.filter){ browseFilter = t.dataset.filter; render(); return; }
  if(t.dataset.open){ openChunk = openChunk === t.dataset.open ? null : t.dataset.open; render(); return; }
  if(t.dataset.add){
    srs[t.dataset.add] = newState(); saveSrs();
    toast("Added to your deck"); render(); return;
  }
});

document.addEventListener("input", e => {
  if(e.target.id === "q"){
    browseQuery = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const el = $("#q");
    if(el){ el.focus(); el.setSelectionRange(pos, pos); }
  }
});

/* ---------- 8. PWA INSTALL (manifest generated inline) ---------- */
(function manifest(){
  const cv = document.createElement("canvas");
  const icon = size => {
    cv.width = cv.height = size;
    const x = cv.getContext("2d");
    x.fillStyle = "#12100e"; x.fillRect(0,0,size,size);
    x.fillStyle = "#f59e0b";
    x.font = `700 ${size*0.56}px -apple-system,Segoe UI,Roboto,sans-serif`;
    x.textAlign = "center"; x.textBaseline = "middle";
    x.fillText("¡", size/2, size*0.52);
    return cv.toDataURL("image/png");
  };
  const mf = {
    name: "Calle — Real Mexican Spanish",
    short_name: "Calle",
    start_url: location.pathname,
    display: "standalone",
    background_color: "#12100e",
    theme_color: "#12100e",
    icons: [
      {src: icon(192), sizes: "192x192", type: "image/png", purpose: "any"},
      {src: icon(512), sizes: "512x512", type: "image/png", purpose: "any"}
    ]
  };
  const link = document.createElement("link");
  link.rel = "manifest";
  link.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], {type:"application/manifest+json"}));
  document.head.appendChild(link);

  const apple = document.createElement("link");
  apple.rel = "apple-touch-icon";
  apple.href = icon(180);
  document.head.appendChild(apple);
})();

/* ---------- 9. GO ---------- */
render();
</script>
</body>
</html>
