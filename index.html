<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12100e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calle">
<title>Calle — Real Mexican Spanish</title>

<!-- ---------- BOOT WATCHDOG ----------
     A separate block on purpose. The app is one ~350KB block, and the failsafe
     that reports a thrown error lives inside it. So the one failure neither can
     report is the block never running at all — truncated in transit, or held
     half-written in a cache. That is what a bare white page actually is, and it
     has now happened twice. This block is small enough to always arrive whole,
     and turns that case into something readable with a way out. -->
<script>
(function(){
  var BUILD = "2026-09-23";
  window.CALLE_BUILD = BUILD;
  var seen = null;
  window.addEventListener("error", function(e){
    if(e && e.target && e.target !== window) return;   /* a font that won't load */
    seen = (e && (e.message || (e.error && e.error.message))) || "script error";
  });
  /* An app launched from a home screen has no address bar, so these buttons
     are the only way out of a bad copy — and the service worker's cache is
     one of the places a bad copy can be sitting. Take it with us. Guarded and
     time-limited: this must never be the thing that hangs. */
  function purge(done){
    var left = 2, fired = false;
    function step(){ if(--left <= 0 && !fired){ fired = true; done(); } }
    setTimeout(function(){ if(!fired){ fired = true; done(); } }, 2000);
    try{
      if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
        navigator.serviceWorker.getRegistrations().then(function(rs){
          return Promise.all(rs.map(function(r){ return r.unregister(); }));
        }).then(step, step);
      } else { step(); }
    }catch(e){ step(); }
    try{
      if(window.caches && caches.keys){
        caches.keys().then(function(ks){
          return Promise.all(ks.map(function(k){ return caches.delete(k); }));
        }).then(step, step);
      } else { step(); }
    }catch(e){ step(); }
  }
  function stuck(why){
    if(window.__calleUp) return;                          /* app painted, stand down */
    if(document.getElementById("calle-reset")) return;    /* in-app failsafe got there */
    if(!document.body) return;
    var line = seen ? ("Last error: " + seen) : ("Stopped after " + why + ".");
    document.body.innerHTML =
      '<div style="font:15px/1.55 system-ui,-apple-system,sans-serif;padding:26px;' +
        'max-width:640px;margin:0 auto;color:#e8e3dc;background:#12100e;' +
        'min-height:100vh;box-sizing:border-box">' +
        '<div style="font-size:30px">\uD83D\uDDFA\uFE0F</div>' +
        '<h1 style="font-size:20px;margin:10px 0 6px">Calle didn\'t finish loading</h1>' +
        '<p style="margin:0 0 16px;opacity:.75">Almost always a half-downloaded copy ' +
          'kept by the browser. Fetching a fresh one fixes it \u2014 your progress is ' +
          'stored separately and is not touched.</p>' +
        '<button id="calle-fresh" style="width:100%;font:600 16px system-ui;border:0;' +
          'border-radius:12px;padding:14px;background:#e0a34a;color:#20180c">' +
          'Reload a fresh copy</button>' +
        '<button id="calle-wipe" style="width:100%;margin-top:10px;font:600 15px system-ui;' +
          'background:none;color:#e8e3dc;border:1px solid #ffffff33;border-radius:12px;' +
          'padding:12px">Clear saved data and reload</button>' +
        '<p style="margin-top:18px;font-size:12px;opacity:.5;word-break:break-word">' +
          'Build ' + BUILD + ' \u00b7 ' + line + '</p>' +
      '</div>';
    var fresh = function(){
      purge(function(){ location.replace(location.pathname + "?fresh=" + Date.now()); });
    };
    document.getElementById("calle-fresh").onclick = fresh;
    document.getElementById("calle-wipe").onclick = function(){
      try{
        Object.keys(localStorage).forEach(function(k){
          if(k.lastIndexOf("calle_", 0) === 0) localStorage.removeItem(k);
        });
      }catch(err){}
      fresh();
    };
  }
  /* The document arrived but the app never signalled: it parsed and died. */
  window.addEventListener("load", function(){ setTimeout(function(){ stuck("loading"); }, 2500); });
  /* The document never finished arriving, so "load" never fires: a cut-off
     transfer, which leaves the script unterminated and unparseable. */
  setTimeout(function(){ stuck("15 seconds"); }, 15000);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded without blocking first paint: a stylesheet link would hold the whole
     app blank until the request resolves, which on a slow or missing network is
     a white screen. Text paints in the fallback immediately, then swaps. -->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..700&family=Plus+Jakarta+Sans:wght@400..800&display=swap">
<noscript><link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..700&family=Plus+Jakarta+Sans:wght@400..800&display=swap"></noscript>
<style>
:root{
  --bg:#12100e; --surface:#1c1917; --surface-2:#292524; --surface-3:#3a3532;
  --text:#fafaf9; --muted:#a8a29e; --faint:#57534e;
  --accent:#f59e0b; --accent-ink:#1c1200;
  --teal:#2dd4bf; --green:#4ade80; --red:#f87171; --blue:#60a5fa; --violet:#c084fc;
  --radius:16px; --radius-sm:10px;
  --tap:#ffffff0d;
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#faf8f5; --surface:#ffffff; --surface-2:#f4f1ec; --surface-3:#e7e2da;
    --text:#1c1917; --muted:#78716c; --faint:#a8a29e;
    --accent:#b45309; --accent-ink:#fff;
    --teal:#0d9488; --green:#16a34a; --red:#dc2626; --blue:#2563eb; --violet:#7c3aed;
    --tap:#0000000a;
  }
}
/* Two faces, loaded so the app looks the same on every device rather than
   inheriting whatever each OS supplies. System stacks stay as the fallback,
   and both keep the sans/serif split even if the fonts never arrive:
   a serif sentence is Spanish, sans is the app talking. */
:root{
  --ui:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --es:"Fraunces","Iowan Old Style","Palatino",Georgia,serif;
}
.es, .cloze, .li .t b, .iline span, .btn.opt.es-text{
  font-family:var(--es);
  letter-spacing:-.005em;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--ui);
  font-size:16px; line-height:1.5;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
.linkish{color:var(--accent);text-decoration:underline;font:inherit}
.slot{display:inline-block;min-width:2.2em;padding:0 .35em;border-bottom:3px solid var(--accent);color:var(--accent)}
.lab-line{font-family:var(--es);font-size:23px;line-height:1.4;min-height:1.5em}
.lab-built{color:var(--text)}
.lab-formula{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;flex-wrap:wrap}
.lab-formula span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:5px 10px;border-radius:999px;background:var(--surface-2);color:var(--faint)}
.lab-formula span.on{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
.lab-formula span.did{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.lab-formula i{color:var(--faint);font-style:normal}
.backlog{margin-top:12px;padding:13px 15px;border-radius:14px;font-size:13px;line-height:1.5;
  background:color-mix(in srgb,var(--red) 11%,transparent);color:var(--text)}
.backlog b{color:var(--red)}
.holding{margin-top:12px;padding:12px 15px;border-radius:14px;font-size:13px;line-height:1.5;
  background:color-mix(in srgb,var(--blue) 12%,transparent);color:var(--text)}
.holding b{color:var(--blue)}
.more-ex{margin-top:6px}
.more-ex summary{cursor:pointer;font-size:13px;color:var(--muted);padding:8px 2px;list-style:none}
.more-ex summary::-webkit-details-marker{display:none}
.more-ex summary::before{content:"▸ ";color:var(--accent)}
.more-ex[open] summary::before{content:"▾ "}
input{font:inherit}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
#view{flex:1;padding:16px 16px calc(84px + var(--safe-b));animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- header ---------- */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 20px}
.hdr h1{font-size:26px;line-height:1.1;margin:0;letter-spacing:-.02em;font-weight:700}
.hdr p{margin:2px 0 0;color:var(--muted);font-size:13px}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:17px;flex:none}
.icon-btn:active{background:var(--surface-3)}

/* ---------- generic ---------- */
.card{background:var(--surface);border-radius:var(--radius);padding:16px}
.card + .card{margin-top:12px}
.row{display:flex;gap:12px}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.center{text-align:center}
.stack>*+*{margin-top:12px}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:15px 18px;border-radius:14px;font-weight:650;font-size:16px;
  background:var(--surface-2);transition:transform .08s,filter .12s;
}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--surface-3);color:var(--muted)}
.btn.sm{padding:11px 14px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.4;pointer-events:none}

.badge{
  display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;
  font-weight:650;letter-spacing:.03em;text-transform:uppercase;
  background:var(--surface-2);color:var(--muted);
}
.badge.tier1{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.badge.tier2{background:color-mix(in srgb,var(--blue) 18%,transparent);color:var(--blue)}
.badge.tier3{background:color-mix(in srgb,var(--violet) 18%,transparent);color:var(--violet)}
.badge.vulgar{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.badge.casual{background:color-mix(in srgb,var(--teal) 16%,transparent);color:var(--teal)}
.badge.neutral{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green)}
.whosay{margin-top:10px;padding:10px 13px;border-radius:12px;background:var(--surface-2);font-size:13px;line-height:1.45;color:var(--muted)}
.whosay b{color:var(--text)}
.culture{margin-top:10px;padding:11px 14px;border-radius:12px;font-size:13px;line-height:1.5;
  background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--text)}
.culture .clabel{display:block;font-size:10px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--accent);margin-bottom:3px}

/* ---------- home ---------- */
.streak{
  display:flex;align-items:center;gap:14px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,var(--surface)),var(--surface));
  border-radius:var(--radius);padding:18px;
}
.streak .flame{font-size:34px;line-height:1}
.streak b{font-size:28px;display:block;line-height:1.1;letter-spacing:-.02em}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border-radius:var(--radius-sm);padding:13px 10px;text-align:center}
.stat b{display:block;font-size:22px;letter-spacing:-.02em;line-height:1.2}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.action{
  display:flex;align-items:center;gap:14px;background:var(--surface);
  border-radius:var(--radius);padding:16px;width:100%;text-align:left;
}
.action:active{background:var(--surface-2)}
.action .em{font-size:26px;flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--surface-2)}
.action .t{flex:1;min-width:0}
.action .t b{display:block;font-size:16px}
.action .t span{font-size:13px;color:var(--muted)}
.action .n{
  flex:none;min-width:28px;height:28px;padding:0 9px;border-radius:99px;background:var(--accent);
  color:var(--accent-ink);font-size:13px;font-weight:700;display:grid;place-items:center;
}
.action .n.zero{background:var(--surface-2);color:var(--faint)}

/* ---------- chunk card ---------- */
.chunk-hero{text-align:center;padding:8px 0 4px}
.chunk-hero .es{
  font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.15;
  display:inline-flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;
}
.chunk-hero .meaning{color:var(--muted);font-size:16px;margin-top:8px}
.chunk-hero .lit{color:var(--faint);font-size:13px;margin-top:6px;font-style:italic}
.spk{
  width:40px;height:40px;border-radius:50%;background:var(--surface-2);
  display:inline-grid;place-items:center;font-size:17px;flex:none;
}
.spk:active{background:var(--accent);color:var(--accent-ink)}
.spk.sm{width:32px;height:32px;font-size:14px}

.ex{display:flex;gap:12px;align-items:flex-start;padding:13px 0}
.ex + .ex{border-top:1px solid var(--surface-2)}
.ex .txt{flex:1;min-width:0}
.ex .es{font-size:17px;font-weight:550;line-height:1.4}
.ex .en{font-size:14px;color:var(--muted);margin-top:3px}
.sec-label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:0 0 4px}

/* how it actually sounds — set in the UI sans, because it's a respelling
   guide rather than Spanish to be read */
.sounds{margin-top:15px;padding:11px 14px;border-radius:12px;background:var(--surface-2);text-align:center}
.sounds .slabel{display:block;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.sounds .sval{display:block;margin-top:4px;font-size:16px;font-weight:600;color:var(--teal);font-family:var(--ui)}

/* per-sentence difficulty */
.lvl{display:inline-flex;align-items:center;gap:3px;margin-top:7px}
.lvl i{width:13px;height:3px;border-radius:99px;background:var(--surface-3)}
.lvl i.on{background:var(--muted)}
.lvl b{font-size:10px;font-weight:600;color:var(--faint);margin-left:5px;text-transform:uppercase;letter-spacing:.06em}

/* ---------- review ---------- */
.progbar{height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-bottom:18px}
.progbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.cloze{font-size:24px;font-weight:650;line-height:1.45;letter-spacing:-.015em;text-align:center;padding:10px 0}
.blank{
  display:inline-block;min-width:88px;border-bottom:3px solid var(--accent);
  vertical-align:baseline;color:transparent;
}
/* min-width only reserves space while it's blank; keeping it after the reveal
   leaves a gap in the middle of the sentence. */
.blank.shown{color:var(--accent);border-bottom-color:transparent;min-width:0}
.prompt-en{text-align:center;color:var(--muted);font-size:15px;margin-top:10px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade{padding:13px 4px;border-radius:13px;background:var(--surface-2);text-align:center;transition:transform .08s}
.grade:active{transform:scale(.95)}
.grade b{display:block;font-size:14px;font-weight:650}
.grade span{font-size:11px;color:var(--muted);display:block;margin-top:2px}
.grade.again b{color:var(--red)} .grade.hard b{color:var(--accent)}
.grade.good b{color:var(--green)} .grade.easy b{color:var(--teal)}

/* ---------- shadow ---------- */
.shadow-big{
  width:100%;aspect-ratio:1/1;max-height:300px;border-radius:24px;
  background:linear-gradient(145deg,color-mix(in srgb,var(--teal) 20%,var(--surface)),var(--surface));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;
}
.shadow-big .es{font-size:23px;font-weight:650;line-height:1.35;letter-spacing:-.015em}
.shadow-big .en{font-size:14px;color:var(--muted)}
.pulse{animation:pulse 1s ease infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.reps{display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--surface-3)}
.dot.on{background:var(--teal)}

/* word-by-word scoring marks */
.mk{transition:color .2s}
.mk.hit{color:var(--green)}
.mk.close{color:var(--accent)}
.mk.miss{color:var(--red);text-decoration:underline;text-decoration-style:wavy;text-underline-offset:5px}
.score{font-size:52px;font-weight:700;letter-spacing:-.03em;line-height:1}
.score span{font-size:22px;font-weight:600;margin-left:2px}
.mic-live{position:relative;width:58px;height:58px;margin:0 auto;display:grid;place-items:center;font-size:25px}
.mic-live .ring{
  position:absolute;inset:0;border-radius:50%;
  background:color-mix(in srgb,var(--red) 30%,transparent);
  animation:ping 1.3s cubic-bezier(0,0,.2,1) infinite;
}
@keyframes ping{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.7);opacity:0}}

/* ---------- stats ---------- */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i{aspect-ratio:1/1;border-radius:2.5px;background:var(--surface-2)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 30%,var(--surface-2))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 55%,var(--surface-2))}
.heat i.l3{background:color-mix(in srgb,var(--accent) 80%,var(--surface-2))}
.heat i.l4{background:var(--accent)}
.bar-row{display:flex;align-items:center;gap:10px;font-size:13px;padding:5px 0}
.bar-row .nm{width:96px;flex:none;color:var(--muted);font-size:12px}
.bar-row .track{flex:1;height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar-row .track i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar-row .v{width:42px;text-align:right;flex:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- browse ---------- */
.lnk{color:var(--accent);text-decoration:underline;font:inherit}

/* reward feedback */
.flash{position:fixed;inset:0;z-index:60;pointer-events:none;animation:flashout .43s ease-out forwards}
.flash.ok{background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--green) 32%,transparent),transparent 62%)}
.flash.bad{background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--red) 26%,transparent),transparent 62%)}
@keyframes flashout{from{opacity:1}to{opacity:0}}
.combo{
  text-align:center;font-size:13px;font-weight:700;color:var(--accent);
  margin:-6px 0 10px;animation:pop .3s cubic-bezier(.2,1.4,.4,1);
}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}

.celebrate{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:61;
  width:min(320px,86vw);background:var(--surface);border-radius:24px;
  padding:30px 24px;text-align:center;
  animation:celebIn .4s cubic-bezier(.2,1.3,.4,1);
}
@keyframes celebIn{from{transform:translate(-50%,-50%) scale(.75);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.celebrate .cem{font-size:58px;line-height:1;animation:bounce .65s ease .1s both}
@keyframes bounce{0%{transform:scale(.4)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
.celebrate .ctitle{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-top:14px}
.celebrate .cname{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:5px}

/* first run */
.intro{display:flex;flex-direction:column;align-items:center;text-align:center;padding:34px 6px 0;min-height:76vh}
.intro .iem{font-size:62px;line-height:1}
.intro h1{font-size:27px;letter-spacing:-.025em;margin:20px 0 0}
.intro p{color:var(--muted);font-size:15px;line-height:1.6;margin:12px 0 0;max-width:330px}
.intro p b{color:var(--text);font-weight:650}
.iline{
  display:flex;align-items:center;gap:10px;margin-top:22px;padding:12px 16px;
  background:var(--surface);border-radius:14px;font-size:17px;font-weight:650;
}
/* goal picker */
.goals{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:18px;text-align:left}
.goal{
  display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:14px;
  background:var(--surface);border:1.5px solid transparent;transition:background .12s,border-color .12s;
}
.goal.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.goal .gem{font-size:22px;flex:none;width:34px;text-align:center}
.goal .gtxt{flex:1;min-width:0}
.goal .gtxt b{display:block;font-size:15px}
.goal .gtxt span{display:block;font-size:12px;color:var(--muted);line-height:1.45}
.goal .gtick{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  font-size:13px;font-weight:700;background:var(--surface-2);color:var(--accent-ink)}
.goal.on .gtick{background:var(--accent)}

.idots{display:flex;gap:7px;margin:auto 0 20px}
.idot{width:7px;height:7px;border-radius:50%;background:var(--surface-3)}
.idot.on{background:var(--accent);width:20px;border-radius:99px}
.intro .btn{max-width:330px}

/* multiple-choice options */
.btn.opt{justify-content:flex-start;text-align:left;font-weight:550;font-size:15px;line-height:1.35;padding:14px 16px}
.btn.opt-right{background:color-mix(in srgb,var(--green) 26%,var(--surface-2));color:var(--text)}
.btn.opt-wrong{background:color-mix(in srgb,var(--red) 26%,var(--surface-2));color:var(--text)}
.btn.opt-dim{opacity:.4}

/* listening speed ramp */
.speed-pips{display:flex;gap:5px;justify-content:center;margin-top:12px}
.pip{width:22px;height:4px;border-radius:99px;background:var(--surface-3)}
.pip.on{background:var(--accent)}

/* quick-fire countdown */
.timer{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:18px}
.timer i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width 1s linear}

/* dialogue bubbles */
.bubble{padding:11px 14px;border-radius:15px;margin:7px 0;max-width:86%}
.bubble .es{font-size:16px;font-weight:600;line-height:1.4}
.bubble .en{font-size:13px;color:var(--muted);margin-top:3px}
.bubble.them{background:var(--surface-2);border-bottom-left-radius:5px}
.bubble.you{background:color-mix(in srgb,var(--accent) 20%,var(--surface-2));margin-left:auto;border-bottom-right-radius:5px}
.bubble.live{outline:1.5px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.cmd{
  display:block;margin-top:5px;padding:9px 11px;border-radius:9px;
  background:var(--bg);color:var(--accent);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;
  user-select:all;-webkit-user-select:all;overflow-x:auto;white-space:nowrap;
}
.search{width:100%;padding:12px 14px;border-radius:13px;background:var(--surface-2);border:none;color:var(--text);outline:none}
.search::placeholder{color:var(--faint)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 0;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 13px;border-radius:99px;background:var(--surface-2);font-size:13px;white-space:nowrap;flex:none;font-weight:550}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.li{display:flex;align-items:center;gap:12px;padding:13px 0;width:100%;text-align:left}
.li + .li{border-top:1px solid var(--surface-2)}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-size:16px;font-weight:600}
.li .t span{font-size:13px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{width:9px;height:9px;border-radius:50%;flex:none;background:var(--surface-3)}
.pill.learning{background:var(--accent)} .pill.review{background:var(--blue)} .pill.mastered{background:var(--green)}

/* ---------- empty ---------- */
.empty{text-align:center;padding:48px 20px}
.empty .em{font-size:46px}
.empty h3{margin:14px 0 6px;font-size:19px}
.empty p{margin:0;color:var(--muted);font-size:14px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:#000a;z-index:40;animation:fade .15s}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);
  border-radius:22px 22px 0 0;padding:20px 18px calc(24px + var(--safe-b));
  max-width:560px;margin:0 auto;max-height:86vh;overflow-y:auto;
  animation:up .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grip{width:38px;height:4px;border-radius:99px;background:var(--surface-3);margin:0 auto 16px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.field + .field{border-top:1px solid var(--surface-2)}
.field select,.field input[type=range]{background:var(--surface-2);border:none;color:var(--text);padding:8px 10px;border-radius:9px;max-width:200px}

/* ---------- nav ---------- */
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--surface-2);padding-bottom:var(--safe-b);
}
nav button{padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);position:relative}
nav button .ic{font-size:19px;line-height:1}
nav button .lb{font-size:10px;font-weight:600;letter-spacing:.01em}
nav button.on{color:var(--accent)}
nav .dot-n{position:absolute;top:6px;right:50%;margin-right:-20px;width:7px;height:7px;border-radius:50%;background:var(--accent)}

.toast{
  position:fixed;bottom:calc(90px + var(--safe-b));left:50%;transform:translateX(-50%);
  background:var(--surface-3);color:var(--text);padding:11px 18px;border-radius:99px;
  font-size:14px;font-weight:550;z-index:50;animation:fade .15s;white-space:nowrap;
}
</style>
</head>

   nothing else — no message, no way back, and nothing to report. Show the
   error instead, and offer the one recovery that fixes a bad saved state.
   Deliberately self-contained: it runs before the helpers below exist. */
function fatal(err){
  var msg = (err && (err.stack || err.message)) || String(err);
  var safe = String(msg).replace(/[&<>]/g, function(m){
    return {"&":"&amp;","<":"&lt;",">":"&gt;"}[m];

    '<div style="font:15px/1.5 system-ui,sans-serif;padding:24px;max-width:720px;margin:0 auto">' +
      '<h1 style="font-size:19px;margin:0 0 6px">Calle could not start</h1>' +
      '<p style="margin:0 0 14px;opacity:.75">This is a bug, not something you did. The details below say what went wrong.</p>' +
      '<pre style="white-space:pre-wrap;word-break:break-word;background:#0002;' +
        'padding:12px;border-radius:10px;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace">' + safe + '</pre>' +
      '<button id="calle-reset" style="margin-top:16px;font:600 15px system-ui;' +
        'border:0;border-radius:10px;padding:12px 16px;background:#b45309;color:#fff">' +
        'Clear saved progress and reload</button>' +
      '<p style="margin-top:10px;font-size:13px;opacity:.6">Only clears this app\'s data on this device.</p>' +
    '</div>';
  var b = document.getElementById("calle-reset");
  if(b) b.onclick = function(){
    try{
      Object.keys(localStorage)
        .filter(function(k){ return k.lastIndexOf("calle_", 0) === 0; })
        .forEach(function(k){ localStorage.removeItem(k); });

    location.reload();
  };
}

/* What the queue must reach in week one. The spine and the question words are
   what everything else plugs into, and appending them to the array put them
   at the back of their own categories — soy and tengo were landing on day
   nineteen. Flagged rather than reordered, so the ordering stays one rule:
   core first, then frequency. */
const CORE_SET = new Set(SPINE.concat(ASKING).map(c => c.chunk)
  .concat(["voy a + verb","tengo que + verb","quiero + verb","puedo + verb",
           "no sé","es que","¿mande?","¿cómo se dice...?"]));
CHUNKS.forEach(c => { if(CORE_SET.has(c.chunk)) c.core = true; });

/* Three surfaces for the same word, so a pattern can ask for the one its
   frame actually takes: "me gusta el café", "tengo un hermano", "estoy
   cansado". Getting this wrong is how a generator teaches "necesito el
   dinero", so patterns declare the form rather than guessing. */
const ART = {"el":"un", "la":"una", "los":"unos", "las":"unas"};
WORDS.forEach(w => {
  const m = w.es.match(/^(el|la|los|las) (.+)$/);
  w.bare = m ? m[2] : w.es;
  w.def  = w.es;
  w.indef = m ? ART[m[1]] + " " + m[2] : w.es;
  w.isAdj = !m;                       // no article = adjective or verb
});


/* The spine is universal, but a price or a clock time is the difference
   between ordering and pointing, so the goals that live on them get these
   woven in early rather than waiting for frequency order to reach them. */

/* ---------- 1a4. SENTENCE PATTERNS ----------
   The plug-in method, curated rather than combinatorial.

   The first version of this generated sentences by combining any engine with
   any verb with any tail, which is grammatical and useless: it produced
   "acabo de creer", "hay que tomar contigo" and "me gusta vivir ahorita" —
   Spanish that parses and that nobody has ever said. A learner cannot tell
   the difference, which makes the free generator worse than no generator.

   So the fillers are scoped to the pattern they belong to. Every option in a
   slot is chosen to read naturally after that particular lead, which means
   every combination the app can produce is a sentence someone would actually
   say. Fewer sentences, all of them real.

   Patterns carry a goal where the content belongs to one, so a learner who
   picked faith builds "quiero orar por ti" rather than "quiero comprar". */
function P(goal, lead, slots){ return {goal, lead:{es:lead[0], en:lead[1]}, slots}; }
function S(label, opts, optional, vocab){
  /* A third element marks a tail that needs a comma in front of it:
     "¿puedes ayudarme, porfa?" but "¿puedes ayudarme tantito?".
     `vocab` lets a slot be filled from the learner's own studied words:
     which domains are safe here, and which surface the frame takes. */
  return {label, optional: !!optional, vocab: vocab || null,
          opts: opts.map(o => ({es:o[0], en:o[1], comma: !!o[2]}))};
}

/* Words this learner has actually studied, in the domains a slot allows and
   in the surface it needs. Due ones come first, so building a sentence is
   also a review. Falls back to the pattern's own options when they do not
   know enough yet to make a choice meaningful. */
/* Adjectives that describe a state you are in, which take estar. The rest of
   the adjective and feeling packs are traits, which take ser: "estoy cansado"
   but "es grosero". Mixing them is the classic learner error and there is no
   excuse for the app making it. */
/* Verbs that need an object or read oddly standing alone after a frame:
   "quiero dar" and "tengo que hacer" are not sentences anyone finishes. */
const BARE_VERB_NO = new Set(["ser","estar","tener","haber","poder","querer","deber",
  "hacer","dar","poner","llevar","traer","dejar","buscar","encontrar","perder","ganar",
  "conocer","saber","decir","ver","quedar","pasar","seguir","necesitar"]);

const STATE_ADJ = new Set(["feliz","contento","triste","enojado","molesto","preocupado",
  "nervioso","tranquilo","cansado","aburrido","emocionado","asustado","apenado",
  "orgulloso","sorprendido","confundido","agradecido","ocupado","libre","listo",
  "lleno","vacío","abierto","cerrado","caliente","frío","seguro"]);

/* The English that belongs with the surface being used: "the kitchen" for a
   definite noun, "a brother" for an indefinite one, and a bare verb for a
   frame that already supplied the "to". */
function glossFor(w, form, bareEn){
  let en = String(w.en).replace(/\s*\([^)]*\)/g, "").trim();
  if(w.dom === "verb") return en.replace(/^to /, "");
  if(bareEn) return en;                       // the lead already supplied the article
  if(/^(a |an |the )/i.test(en)) return en;
  if(form === "def")   return "the " + en;
  if(form === "indef") return (/^[aeiou]/i.test(en) ? "an " : "a ") + en;
  return en;
}

function vocabOptions(spec){
  if(!spec) return [];
  const now = Date.now();
  const pool = WORDS.filter(w => vsrs[w.id]
    && spec.doms.indexOf(w.dom) !== -1
    && (!spec.adjOnly || w.isAdj)
    && (!spec.nounOnly || !w.isAdj)
    && (!spec.stateOnly || STATE_ADJ.has(w.bare))
    && (!spec.traitOnly || !STATE_ADJ.has(w.bare))
    && (!spec.not || spec.not.indexOf(w.es) === -1)
    && (w.dom !== "verb" || !BARE_VERB_NO.has(w.bare))
    /* "unos papás" is not how anyone says it, so plurals stay out of the
       indefinite frames. */
    && (spec.form !== "indef" || !/^(los|las) /.test(w.es)));
  const surf = w => spec.form === "indef" ? w.indef : spec.form === "bare" ? w.bare : w.def;
  const due = pool.filter(w => vsrs[w.id].due <= now);
  const rest = pool.filter(w => vsrs[w.id].due > now);
  return shuffle(due).concat(shuffle(rest))
    .map(w => ({es: surf(w), en: glossFor(w, spec.form, spec.bareEn), wid: w.id}));
}

/* Compose the two halves from the lead and whatever was chosen. Because the
   options were written for this lead, the English needs no repair. */
function patternSentence(pat, picks){
  const parts = picks.filter(Boolean);
  const glue = (acc, x, key) => acc + (x.comma ? ", " : " ") + x[key];
  let es = parts.reduce((a,x) => glue(a,x,"es"), pat.lead.es);
  let en = parts.reduce((a,x) => glue(a,x,"en"), pat.lead.en);
  en = en.replace(/\s+—\s+/, " ").replace(/\s+/g, " ").trim();
  es = es.replace(/\s+/g, " ").trim();
  if(pat.lead.es.charAt(0) === "¿"){
    es += "?";
    en = en.replace(/\?/g, "") + "?";
    es = "¿" + es.charAt(1).toUpperCase() + es.slice(2);
  }else{
    es = es.charAt(0).toUpperCase() + es.slice(1);
  }
  return {es, en: en.charAt(0).toUpperCase() + en.slice(1)};
}

/* ---------- 1d. SENTENCE DIFFICULTY ----------
   A tier-1 chunk shown inside a sentence full of other slang is not a tier-1
   lesson. Rating each example separately lets the easy one teach the chunk and
   the hard one wait until the chunk is known. */
const LEVEL_LABEL = ["", "simple", "natural", "fast"];

const bareChunk = s => s.replace(/\s*\+.*$/, "").replace(/[¿?¡!.…]/g, "").trim().toLowerCase();

function rateSentence(es, ownerChunk){
  const words = es.split(/\s+/).filter(Boolean).length;
  let load = words <= 4 ? 0 : words <= 6 ? 0.5 : words <= 9 ? 1.1 : 1.9;
  const owner = bareChunk(ownerChunk.chunk);
  for(const other of CHUNKS){
    if(other.id === ownerChunk.id) continue;
    const core = bareChunk(other.chunk);
    if(core.length < 4) continue;                      // too short to match meaningfully
    /* "la verdad es que" contains "es que" and "verdad"; charging for those
       would penalise the chunk for its own words. */
    if(owner.includes(core)) continue;
    if(es.toLowerCase().includes(core))
      load += other.tier === 1 ? 0.3 : other.tier === 2 ? 0.75 : 1.1;
  }
  /* Thresholds sit on the real spread of the collection (p55 / p90), not on
     round numbers — picked so each band actually holds sentences. */
  return load <= 0.55 ? 1 : load <= 1.15 ? 2 : 3;
}

/* Which goals a sentence happens to serve, read off the sentence itself, so
   the example picker can prefer a context the learner actually asked for. */
function inferExampleGoals(e){
  const t = `${e.es} ${e.en}`.toLowerCase();
  const rules = {
    faith:/\b(dios|jes[uú]s|orar|oraci[oó]n|iglesia|fe|believe|pray|church|god)\b/,
    travel:/\b(vuelo|boleto|hotel|camino|calle|autob[uú]s|airport|flight|ticket|lost|directions)\b/,
    food:/\b(taco|comer|tomar|men[uú]|cuenta|cebolla|salsa|food|eat|drink|order)\b/,
    work:/\b(trabaj|junta|reporte|cliente|correo|meeting|report|work|office)\b/,
    friends:/\b(amig|familia|primo|juntos|contigo|friend|family|together)\b/,
    culture:/\b(m[uú]sica|canci[oó]n|pel[ií]cula|costumbre|music|song|movie|custom)\b/
  };
  return Object.keys(rules).filter(g => rules[g].test(t));
}

/* Frequency and difficulty are not the same axis. A chunk can be common and
   still be the wrong thing to meet first, either because it encodes something
   hard or because it only makes sense once another chunk is known. */
const PREREQUISITES = {
  "no es que": ["es que"], "tengo que + verb": ["quiero + verb"],
  "lo que pasa es que": ["es que"], "o sea que": ["o sea"],
  "¿qué tal si...?": ["¿va?"], "voy a + verb": ["quiero + verb"],
  "tuve que + verb": ["tengo que + verb"], "me lo / te lo": ["lo / la"],
  /* A price frame is unsayable without a number, so it waits for one. */
  "son + number + pesos": ["cien / mil"], "a las + number": ["son las + number"],
  "estaba": ["estoy + adjective"], "estuvo": ["está + adjective"],
};
function rateChunk(c){
  let level = c.tier === 1 ? 1 : c.tier === 2 ? 2 : 3;
  if(/\b(subjunctive|conditional|hypothetical)\b/i.test(c.meaning) || /no es que|para que|ojal[aá]/i.test(c.chunk)) level = Math.max(level, 3);
  if(c.category === "slang" && c.tier > 1) level = Math.max(level, 2);
  return Math.min(4, level);
}

/* Harder sentences unlock as the chunk itself gets more familiar. */
/* Everything the learner could plausibly produce: the words inside chunks
   they have met, the vocabulary they have studied, and the function words,
   which are never what makes a sentence impossible. Rebuilt only when the
   deck changes size, since it is consulted once per drill. */
let _knownTok = null, _knownStamp = "";
/* Grammar, not vocabulary. These are the words a learner absorbs from the
   chunks themselves and never has to be taught separately, so counting them
   as unknown would mark almost every sentence unsayable. Deliberately holds
   no content words — anything with meaning has to be earned. */
const FREE_TOKENS = ("de la que el en y a los del se las por un para con no una su al lo " +
  "como más pero sus le ya o este sí porque esta es son me te mi tu muy qué cómo dónde " +
  "cuándo quién si ni tan ese esa eso esto aquí allá ahí algo nada todo todos bien mal " +
  "así también tampoco siempre nunca todavía aún hasta desde sobre entre cada otro otra " +
  "mismo tanto poco solo sólo nos les lo los un unos unas uno al yo gracias hola oye").split(" ");

/* Tokens of a chunk itself, punctuation stripped the same way the sentence is
   so that "más despacio, porfa" matches its own words rather than failing on
   the comma — which was marking perfectly sayable sentences unsayable. */
const chunkTokens = c => bareChunk(c.chunk)
  .replace(/[,;:¿?¡!.…"“”\/]/g, " ").split(/\s+/).filter(Boolean);
function knownTokens(){
  const stamp = Object.keys(srs).length + ":" + Object.keys(vsrs).length;
  if(_knownTok && _knownStamp === stamp) return _knownTok;
  const set = new Set(FREE_TOKENS);
  Object.keys(srs).forEach(id => { const c = byId(id);
    if(c) chunkTokens(c).forEach(t => set.add(t)); });
  Object.keys(vsrs).forEach(id => { const w = wordById(id);
    if(w) w.bare.toLowerCase().split(/\s+/).forEach(t => set.add(t)); });
  _knownTok = set; _knownStamp = stamp;
  return set;
}

/* How much of a sentence this learner could actually produce. The chunk being
   taught counts as known, since that is the thing being practised. */
function exampleCoverage(e, owner){
  const known = knownTokens();
  const own = new Set(chunkTokens(owner));
  const toks = e.es.toLowerCase().replace(/[¿?¡!.,;:—"“”]/g, " ").split(/\s+/).filter(Boolean);
  if(!toks.length) return 1;
  let n = 0;
  toks.forEach(t => { if(own.has(t) || known.has(t)) n++; });
  /* A frame's filler is the variable, not a debt: "quiero + verb" is being
     practised as the frame, so one unknown word in the slot is the exercise
     rather than a gap. Anything beyond that still counts against it. */
  if(/\+/.test(owner.chunk)) n = Math.min(toks.length, n + 1);
  return n / toks.length;
}

/* Reading a sentence and generating it are different asks. Level rating keeps
   the carrier gentle, but gentle is not the same as producible: "Claro que
   sí, cuenta conmigo" is a short, easy sentence and still impossible for
   somebody who has met claro and nothing else. Production modes pick the
   sentence this learner could actually say, not merely an easy one. */
/* The floor below which a prompt stops being recall and becomes a guess. */
const PRODUCIBLE = 0.7;

/* Best coverage any of this chunk's eligible sentences reaches, so a chunk
   with nothing sayable can be skipped rather than set as an impossible task. */
function bestCoverage(c, st, skill){
  const iv = st ? st.interval : 0;
  const maturityMax = iv >= 21 ? 4 : iv >= 5 ? 2 : 1;
  const max = Math.min(maturityMax, skillCeiling(skill || "speaking"));
  let pool = c.examples.filter(e => e.level <= max);
  if(!pool.length) pool = c.examples;
  return Math.max.apply(null, pool.map(e => exampleCoverage(e, c)));
}

function pickProducible(c, st, skill){
  const iv = st ? st.interval : 0;
  const maturityMax = iv >= 21 ? 4 : iv >= 5 ? 2 : 1;
  const max = Math.min(maturityMax, skillCeiling(skill || "speaking"));
  let pool = c.examples.filter(e => e.level <= max);
  if(!pool.length) pool = c.examples;
  const scored = pool.map(e => ({e, cov: exampleCoverage(e, c)}));
  const best = Math.max.apply(null, scored.map(x => x.cov));
  /* Anything close to the best keeps some variety without dropping back to
     sentences full of words they have never seen. */
  const top = scored.filter(x => x.cov >= best - 0.12).map(x => x.e);
  return top[Math.floor(Math.random()*top.length)];
}

/* Harder sentences unlock as the chunk itself gets familiar, but never past
   what the relevant skill can carry — so mastering o sea cannot be what hands
   an A1 learner a B1 carrier sentence. The effective cap is the lower of the
   two, which is the rule the whole curriculum turns on. */
function pickExample(c, st, skill="comprehension"){
  const iv = st ? st.interval : 0;
  const maturityMax = iv >= 21 ? 4 : iv >= 5 ? 2 : 1;
  const max = Math.min(maturityMax, skillCeiling(skill));
  let pool = c.examples.filter(e => e.level <= max);
  if(!pool.length){
    /* Nothing gentle enough exists for this chunk, so take the gentlest that
       does — never the whole set, which could hand a beginner the hardest. */
    const floor = Math.min(...c.examples.map(e => e.level));
    pool = c.examples.filter(e => e.level === floor);
  }
  const relevant = pool.filter(e => (e.goals || []).some(g => myGoals.includes(g)));
  if(relevant.length) pool = relevant;
  /* Among equally suitable sentences, prefer one carrying a word this learner
     has studied. Vocabulary met in one place and never seen again is the
     met-once problem; recycling it through the example sentences is free
     recognition practice and makes the sentence easier at the same time. */
  const known = pool.filter(e => e.words && e.words.some(id => vsrs[id]));
  if(known.length) pool = known;
  return pool[Math.floor(Math.random() * pool.length)];
}

/* ---------- 1e. DIALOGUES ---------- */
/* Chunks in isolation don't teach turn-taking. Each dialogue is a real
   exchange; on your turns you pick the natural reply from three options,
   where the wrong ones are plausible but off in register or meaning. */
function D(title, setting, turns){ return {id:"d"+title.length+turns.length+title.charCodeAt(0), title, setting, turns}; }
function THEM(es, en){ return {who:"them", es, en}; }
function YOU(es, en, wrong){ return {who:"you", es, en, wrong}; }

    YOU("¡Sale! Me late.", "Deal! Sounds good to me.",

    YOU("¿Me regala tres de pastor, porfa?", "Could I get three al pastor, please?",

/* ----- The learner profile -----
   Four skills that move independently, because they genuinely come apart: a
   reader who cannot catch fast speech is the normal case, not the exception.
   Each carries an ability, how much evidence it rests on, and a short window
   of recent results, so one lucky answer or one bad morning cannot move the
   course. Everything above this line is content; this is the only thing that
   knows who is studying it. */
const defaultSkill = ability => ({ability, evidence:0, recent:[]});
let learner = Object.assign({
  startLevel:1,
  target:"conversational fluency",
  dialect:"Mexican Spanish",
  register:"informal / natural",
  skills:{
    comprehension:defaultSkill(1.35), listening:defaultSkill(1.15),
    speaking:defaultSkill(1.2), vocabulary:defaultSkill(1.4)
  }
}, LS.get("learner", {}));
for(const k of ["comprehension","listening","speaking","vocabulary"])
  learner.skills[k] = Object.assign(defaultSkill(k === "listening" ? 1.15 : 1.3), learner.skills && learner.skills[k]);
const saveLearner = () => LS.set("learner", learner);

const BANDS = ["", "A1", "A2", "B1", "B2"];
const skillCeiling = skill => Math.max(1, Math.min(4,
  Math.floor((learner.skills[skill] || learner.skills.comprehension).ability)));

function recordSkill(skill, success, challengeLevel=1){
  const s = learner.skills[skill];
  if(!s) return;
  s.recent.push(success ? 1 : 0); if(s.recent.length > 24) s.recent.shift();
  s.evidence++;
  const accuracy = s.recent.reduce((a,b)=>a+b,0) / s.recent.length;
  /* Only moves on a run, and only upward when the run was earned against
     something at least as hard as the current ceiling. */
  if(s.evidence >= 8 && s.recent.length >= 8){
    if(accuracy >= .84 && challengeLevel >= Math.floor(s.ability)) s.ability = Math.min(4, s.ability + .08);
    if(accuracy < .55) s.ability = Math.max(1, s.ability - .1);
  }
  saveLearner();
}

/* What today's session has already put in front of you. Practice used to
   draw uniformly from the whole deck, so the chunk you met an hour ago was no
   likelier to come up than one from three weeks back — the session taught and
   practice ignored it. These are the ids to lead with. */
let studied = LS.get("studied", {day:null, ids:[]});
if(studied.day !== todayKey()) studied = {day: todayKey(), ids: []};
function noteStudied(id){
  if(!id) return;
  if(studied.day !== todayKey()) studied = {day: todayKey(), ids: []};
  if(studied.ids.indexOf(id) === -1){ studied.ids.push(id); LS.set("studied", studied); }
}
/* Recent first, then the rest of the deck. Practice should reinforce what was
   just taught and then stretch past it, in that order. */
function practicePool(){
  const deck = Object.keys(srs);
  const recent = studied.ids.filter(id => srs[id]);
  const rest = shuffle(deck.filter(id => recent.indexOf(id) === -1));
  return {recent: shuffle(recent), rest, all: shuffle(recent).concat(rest)};
}

/* Vocabulary rides the same scheduler as chunks but keeps its own book, so a
   word and a phrase can be at different stages of the same day. */
let vsrs = LS.get("vsrs", {});
const saveVsrs = () => LS.set("vsrs", vsrs);
const WORD_IDS = new Set(WORDS.map(w => w.id));
Object.keys(vsrs).forEach(id => { if(!WORD_IDS.has(id)) delete vsrs[id]; });

function dueWords(){
  const now = Date.now();
  return Object.keys(vsrs).filter(id => vsrs[id].due <= now);
}
/* Dealt a domain at a time so a learner gets a usable spread rather than
   sixty kitchen nouns before meeting a single feeling. */
function newWords(){
  const doms = Object.keys(WORD_PACKS);
  const queues = doms.map(d => WORDS.filter(w => w.dom === d && !vsrs[w.id]));
  const out = [];
  for(let any = true; any; ){
    any = false;
    queues.forEach(q => { if(q.length){ out.push(q.shift()); any = true; } });
  }
  return out;
}

/* Chunk ids are positional ("c" + index), so any build that inserts or drops
   a chunk renumbers everything after it. Saved progress can therefore name an
   id this build no longer has, and every practice mode looks its queue up with
   byId() and walks straight into the undefined. Drop the unusable entries once,
   here, instead of guarding each consumer. */
const CHUNK_IDS = new Set(CHUNKS.map(c => c.id));
[srs, scores, ears, drills, skipped].forEach(map => {
  Object.keys(map).forEach(id => { if(!CHUNK_IDS.has(id)) delete map[id]; });
});

/* ---------- 3. SRS ENGINE (SM-2 lite) ---------- */
const LEARN_STEPS = [1/1440, 10/1440];   // 1 min, 10 min (in days)
const GRADE = {again:0, hard:1, good:2, easy:3};
const MASTERED_AT = 21;                  // days interval == "mastered"

function newState(){
  return {ease:2.5, interval:0, due:Date.now(), reps:0, lapses:0, step:0, status:"learning"};
}

function schedule(st, grade){
  const s = {...st};
  s.reps++;
  if(s.status === "learning"){
    if(grade === GRADE.again){ s.step = 0; }
    else if(grade === GRADE.easy){ s.status = "review"; s.interval = 4; s.step = 0; }
    else if(grade === GRADE.hard){ /* repeat current step */ }
    else { s.step++; if(s.step >= LEARN_STEPS.length){ s.status = "review"; s.interval = 1; } }
    s.due = s.status === "review"
      ? Date.now() + s.interval * DAY
      : Date.now() + LEARN_STEPS[Math.min(s.step, LEARN_STEPS.length-1)] * DAY;
    return s;
  }
  // review cards
  if(grade === GRADE.again){
    s.lapses++; s.ease = Math.max(1.3, s.ease - 0.2);
    s.status = "learning"; s.step = 0; s.interval = 0;
    s.due = Date.now() + LEARN_STEPS[0] * DAY;
    return s;
  }
  if(grade === GRADE.hard){ s.ease = Math.max(1.3, s.ease - 0.15); s.interval = Math.max(1, s.interval * 1.2); }
  else if(grade === GRADE.good){ s.interval = Math.max(1, s.interval * s.ease); }
  else { s.ease = Math.min(2.8, s.ease + 0.15); s.interval = Math.max(1, s.interval * s.ease * 1.3); }
  s.interval = Math.round(s.interval * 10) / 10;
  s.due = Date.now() + s.interval * DAY;
  return s;
}

function previewInterval(st, grade){
  const s = schedule(st, grade);
  const d = (s.due - Date.now()) / DAY, mins = d * 1440;
  if(mins < 1)  return "<1m";
  if(mins < 60) return Math.round(mins) + "m";
  if(d < 1)     return Math.round(d*24) + "h";
  if(d < 30)    return Math.round(d) + "d";
  return (d/30).toFixed(1).replace(/\.0$/,"") + "mo";
}

const inDeck   = id => !!srs[id];
const dueCards = () => Object.keys(srs).filter(id => srs[id].due <= Date.now());
/* Within a tier, deal the categories round-robin instead of in the order the
   collection happens to be written. Sorting by tier alone is stable, so the
   authoring order leaked through and the first fifteen chunks were all
   fillers — and a filler glues other things together, so a deck of nothing but
   glue says nothing at all. One from each category in turn means you can
   react, ask, agree and get yourself out of trouble from the first day. */
const CAT_ORDER = Object.keys(CAT);
function spreadByCategory(list){
  const tiers = new Map();
  for(const c of list){
    if(!tiers.has(c.tier)) tiers.set(c.tier, new Map());
    const byCat = tiers.get(c.tier);
    if(!byCat.has(c.category)) byCat.set(c.category, []);
    byCat.get(c.category).push(c);
  }
  const out = [];
  for(const tier of [...tiers.keys()].sort((a,b) => a - b)){
    const byCat = tiers.get(tier);
    const queues = CAT_ORDER.map(k => byCat.get(k)).filter(Boolean);
    for(let any = true; any; ){
      any = false;
      for(const q of queues) if(q.length){ out.push(q.shift()); any = true; }
    }
  }
  return out;
}

/* Ordering new chunks. Anything skipped sinks below what you haven't judged.
   With goals set, the two streams are woven two-to-one rather than sorted
   together: a bonus large enough to lift goal words up is also large enough to
   bury every universal chunk behind them, and the glue — o sea, la neta, es
   que — is what makes any of the goals speakable. Glue leads, goal vocabulary
   arrives steadily alongside it. */
const GOAL_WEAVE = 2;
/* A chunk is eligible when it sits inside the vocabulary ceiling and anything
   it builds on has already graduated out of learning. Frequency and goal
   weaving then order that eligible set — difficulty decides what may appear,
   frequency decides what comes first. */
const known = name => {
  const p = CHUNKS.find(x => x.chunk === name);
  return p ? (srs[p.id] && srs[p.id].status !== "learning") : true;
};

function newCards(){
  const ceiling = skillCeiling("vocabulary");
  const all = CHUNKS.filter(c => !inDeck(c.id) && !(settings.salty === false && c.register === "vulgar"));
  let pool = all.filter(c => c.learningLevel <= ceiling && c.prerequisites.every(known));
  /* Never strand the learner: if the ceiling and prerequisites between them
     leave nothing, fall back to everything rather than showing an empty deck. */
  if(!pool.length) pool = all;
  const order = list => spreadByCategory(list.filter(c => !skipped[c.id]))
                 .concat(spreadByCategory(list.filter(c => skipped[c.id])));

  /* Core is held out of the frequency ordering and woven back one for one, so
     the pieces everything plugs into arrive in the first week instead of the
     third. Not simply placed first: thirty-odd cards of bare scaffolding with
     no glue is the same mistake the goal weighting made, and a learner who
     can conjugate nothing and greet nobody has not had a good first week. */
  const core = order(pool.filter(c => c.core));
  const plain = pool.filter(c => !c.core);

  let stream;
  if(!myGoals.length) stream = order(plain);
  else {
    const mine = order(plain.filter(hasGoal));
    const rest = order(plain.filter(c => !hasGoal(c)));
    stream = [];
    while(mine.length || rest.length){
      stream.push(...rest.splice(0, GOAL_WEAVE), ...mine.splice(0, 1));
    }
  }

  const out = [];
  while(core.length || stream.length){
    out.push(...core.splice(0, 1), ...stream.splice(0, 1));
  }
  return out;
}
const statusOf = id => {
  const s = srs[id];
  if(!s) return "new";
  if(s.status === "learning") return "learning";
  return s.interval >= MASTERED_AT ? "mastered" : "review";
};

function markStudied(){
  const t = todayKey();
  streak.days[t] = (streak.days[t] || 0) + 1;
  if(streak.last !== t){
    streak.count = streak.last === yesterdayKey() ? streak.count + 1 : 1;
    streak.last = t;
  }
  saveStreak();
}

/* current streak, recomputed so it decays when you skip a day */
function liveStreak(){
  if(!streak.last) return 0;
  return (streak.last === todayKey() || streak.last === yesterdayKey()) ? streak.count : 0;
}

/* ---------- 4. SPEECH OUT ---------- */
const SS = window.speechSynthesis || null;
let voices = [];
let audioNote = SS ? null : "This browser has no speech synthesis.";

function refreshVoices(){
  if(!SS) return;
  const v = SS.getVoices();
  if(v && v.length) voices = v;
}
if(SS){
  refreshVoices();
  SS.onvoiceschanged = refreshVoices;
  /* Chrome populates getVoices() asynchronously and Safari may never fire
     voiceschanged, so poll briefly until the list shows up. */
  let tries = 0;
  const poll = setInterval(() => {
    refreshVoices();
    if(voices.length || ++tries > 25) clearInterval(poll);
  }, 200);
}

function esVoices(){ return voices.filter(v => /^es/i.test(v.lang)); }
function pickVoice(){
  const list = esVoices();
  if(settings.voice){
    const saved = list.find(v => v.voiceURI === settings.voice);
    if(saved) return saved;
  }
  return list.find(v => /es[-_]MX/i.test(v.lang))
      || list.find(v => /es[-_]US/i.test(v.lang))
      || list.find(v => /es[-_](419|CO|AR|CL|PE)/i.test(v.lang))
      || list[0]
      || null;
}

function audioProblem(){
  if(!SS) return "This browser has no speech synthesis.";
  if(!voices.length) return "No speech voices are available on this device.";
  if(!esVoices().length) return "No Spanish voice installed — add one in your system settings.";
  return null;
}

function speak(text, rate){
  if(!SS){ toast(audioNote); return; }
  refreshVoices();
  const problem = audioProblem();
  if(problem){ audioNote = problem; toast(problem); return; }

  /* Only cancel when something is actually queued: an unconditional
     cancel() immediately before speak() drops the utterance in Chrome. */
  if(SS.speaking || SS.pending) SS.cancel();
  if(SS.paused) SS.resume();

  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice();
  u.voice = v;
  u.lang  = v.lang || "es-MX";
  u.rate  = rate || settings.rate;
  u.onerror = e => {
    if(e.error === "interrupted" || e.error === "canceled") return;
    audioNote = "Audio failed (" + e.error + ")";
    toast(audioNote);
  };
  u.onstart = () => { audioNote = null; };
  SS.speak(u);
  /* Chrome occasionally parks the queue in a paused state. */
  setTimeout(() => { if(SS.paused) SS.resume(); }, 150);
}

/* ---------- 3a2. SHARING ----------
   Everything this app manufactures that somebody would want to show — a
   streak, a milestone, the first conversation held without English — was
   visible only inside it. A card is drawn on a canvas and handed to the
   system share sheet, falling back to a download where that is unavailable.

   The line of Spanish is the point. A number is a boast; "Ya sé pedir tacos
   sin hablar inglés" is a thing somebody else wants for themselves, which is
   the only reason anyone forwards it. */
function shareLine(){
  /* Worth showing, not merely true. "¿Qué?" is a real thing the learner can
     say and nobody is impressed by it, so the card wants a whole sentence —
     from a chunk they have mastered where possible, and long enough to look
     like Spanish. */
  const rank = id => statusOf(id) === "mastered" ? 2 : statusOf(id) === "review" ? 1 : 0;
  const cands = [];
  Object.keys(srs).filter(id => rank(id) > 0).forEach(id => {
    const c = byId(id); if(!c) return;
    c.examples.forEach(e => {
      const words = e.es.split(/\s+/).length;
      if(words >= 4 && exampleCoverage(e, c) >= 0.85) cands.push({e, r: rank(id), words});
    });
  });
  if(!cands.length) return null;
  const best = Math.max.apply(null, cands.map(x => x.r));
  const top = cands.filter(x => x.r === best);
  const pick = top[Math.floor(Math.random()*top.length)];
  return {es: pick.e.es, en: pick.e.en};
}

function shareCard(headline, sub){
  const W = 1080, H = 1080;
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const x = cv.getContext("2d");

  x.fillStyle = "#12100e"; x.fillRect(0, 0, W, H);
  x.fillStyle = "#f59e0b";
  x.fillRect(0, 0, W, 14);

  x.textAlign = "center";
  x.fillStyle = "#a8a29e";
  x.font = "600 34px system-ui, sans-serif";
  x.fillText("CALLE · MEXICAN SPANISH", W/2, 120);

  x.fillStyle = "#fafaf9";
  x.font = "700 78px Georgia, serif";
  wrapText(x, headline, W/2, 330, W - 160, 92);

  x.fillStyle = "#f59e0b";
  x.font = "600 40px system-ui, sans-serif";
  x.fillText(sub, W/2, 470);

  const line = shareLine();
  if(line){
    x.fillStyle = "#1c1917";
    roundRect(x, 90, 560, W - 180, 300, 32);
    x.fillStyle = "#2dd4bf";

    x.fillStyle = "#fafaf9";

    wrapText(x, line.es, W/2, 710, W - 260, 64);
    x.fillStyle = "#a8a29e";
    x.font = "400 30px system-ui, sans-serif";

}

function wrapText(ctx, text, cx, y, maxW, lh){
  const words = String(text).split(" ");
  let line = "", yy = y;
  words.forEach(w => {
    const test = line ? line + " " + w : w;
    if(ctx.measureText(test).width > maxW && line){
      ctx.fillText(line, cx, yy); yy += lh; line = w;
    }else line = test;
  });
  if(line) ctx.fillText(line, cx, yy);
  return yy;
}
function roundRect(ctx, x0, y0, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x0 + r, y0);
  ctx.arcTo(x0 + w, y0, x0 + w, y0 + h, r);
  ctx.arcTo(x0 + w, y0 + h, x0, y0 + h, r);
  ctx.arcTo(x0, y0 + h, x0, y0, r);
  ctx.arcTo(x0, y0, x0 + w, y0, r);
  ctx.closePath(); ctx.fill();
}

/* ---------- 3b. BACKUP ----------
   Everything lives in localStorage, which one cleared cache wipes. These move
   it in and out as a plain file. */
const BACKUP_KEYS = ["srs","streak","scores","ears","dialogDone","drills",
                     "skipped","unlocked","totals","settings","seenIntro","goals",
                     "learner","studied","vsrs","talkRota"];

function backupBlob(){
  const payload = {app:"calle", version:1, exported:new Date().toISOString(), data:{}};
  BACKUP_KEYS.forEach(k => {
    const v = LS.get(k, null);
    if(v !== null) payload.data[k] = v;
  });
  return payload;
}

function exportProgress(){
  const payload = backupBlob();
  const url = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"}));
  const a = document.createElement("a");
  a.href = url;
  a.download = `calle-progress-${todayKey()}.json`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
  toast("Backup downloaded");
}

/* Only writes keys it recognises, so a stray file can't inject anything. */
function importProgress(file, done){
  const r = new FileReader();
  r.onerror = () => done("Couldn't read that file.");
  r.onload = () => {
    let parsed;
    try{ parsed = JSON.parse(r.result); }
    catch(e){ return done("That file isn't valid JSON."); }
    if(!parsed || parsed.app !== "calle" || typeof parsed.data !== "object" || !parsed.data)
      return done("That doesn't look like a Calle backup.");
    const keys = Object.keys(parsed.data).filter(k => BACKUP_KEYS.includes(k));
    if(!keys.length) return done("That backup is empty.");
    keys.forEach(k => LS.set(k, parsed.data[k]));
    done(null, keys.length);
  };
  r.readAsText(file);
}

/* ---------- 4a. SOUND & REWARD ----------
   Tones are synthesised rather than loaded, so the app stays one file and
   still chimes with the network off. */
let actx = null;
function sfx(notes, o){
  if(settings.sound === false) return;
  o = o || {};
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    actx = actx || new AC();
    if(actx.state === "suspended") actx.resume();
    notes.forEach((f, i) => {
      const t0  = actx.currentTime + i * (o.gap != null ? o.gap : 0.07);
      const dur = o.dur || 0.18;
      const osc = actx.createOscillator(), gain = actx.createGain();
      osc.type = o.type || "sine";
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(o.vol || 0.13, t0 + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain); gain.connect(actx.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.03);
    });
  }catch(e){}
}
const SFX = {
  right : ()  => sfx([784, 1047], {gap:0.055, dur:0.16}),
  combo : n   => sfx([784 + n*55, 1047 + n*55], {gap:0.05, dur:0.15}),
  wrong : ()  => sfx([210, 165], {gap:0.07, dur:0.2, type:"triangle", vol:0.09}),
  unlock: ()  => sfx([523, 659, 784, 1047], {gap:0.085, dur:0.32, vol:0.15}),
  done  : ()  => sfx([523, 659, 784], {gap:0.105, dur:0.36, vol:0.15}),
};

/* ---------- 4b. SPEECH IN (pronunciation scoring) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;

/* A page opened straight from disk has no real origin, so browsers refuse it
   the microphone no matter what the user allows. Nothing in the app can fix
   that, so say what will. */
const IS_FILE = location.protocol === "file:";
const FILE_MSG = "Browsers won't give the microphone to a page opened from disk. "
               + "Serve this folder and open it from there — see Settings.";
const SERVE_CMD = "python3 -m http.server 8000";

/* iOS has no Web Speech recognition in any browser, Safari included, and
   every iOS browser is Safari underneath — so "try another browser" is advice
   that cannot work there. Say what is actually true instead. */
const IS_IOS = /iP(hone|ad|od)/.test(navigator.platform || "") ||
               (/Mac/.test(navigator.platform || "") && navigator.maxTouchPoints > 1);

function recProblem(){
  if(!SR) return IS_IOS
    ? "iPhones and iPads can't do speech recognition in any browser yet, so the mic modes are unavailable here. Everything else works — Listen is the one that matters most anyway."
    : "This browser can't listen — try Chrome or Edge on desktop.";
  if(!window.isSecureContext) return "Scoring needs https:// or localhost.";
  return null;
}

const REC_ERRORS = {
  "not-allowed":        IS_FILE ? FILE_MSG : "Microphone blocked — allow mic access for this site, then try again.",
  "service-not-allowed":IS_FILE ? FILE_MSG : "The browser blocked the microphone.",
  "no-speech":          "Didn't catch anything — try again.",
  "audio-capture":      "No microphone found.",
  "network":            "Scoring needs an internet connection.",
  "aborted":            null,
};

function micErrorMessage(err){
  const n = (err && err.name) || String(err);
  if(n === "NotAllowedError" || n === "SecurityError")
    return IS_FILE ? FILE_MSG : "Microphone blocked — allow mic access for this site, then try again.";
  if(n === "NotFoundError" || n === "DevicesNotFoundError") return "No microphone found.";
  if(n === "NotReadableError" || n === "TrackStartError")   return "Your microphone is in use by another app.";
  return "Couldn't open the microphone (" + n + ").";
}

let rec = null;
function startListening(handlers){
  const problem = recProblem();
  if(problem) return handlers.fail(problem);
  stopListening();

  /* Ask for the mic directly first: the recognizer's own failure is a bare
     "not-allowed" with no indication of why, while getUserMedia distinguishes
     denied from missing from busy. */
  const md = navigator.mediaDevices;
  if(md && md.getUserMedia){
    md.getUserMedia({audio:true})
      .then(stream => {
        stream.getTracks().forEach(t => t.stop());   // recognizer opens its own
        beginRecognition(handlers);
      })
      .catch(err => handlers.fail(micErrorMessage(err)));
  }else{
    beginRecognition(handlers);
  }
}

function beginRecognition(handlers){
  try{ rec = new SR(); }
  catch(e){ return handlers.fail("Couldn't start the microphone."); }

  rec.lang = "es-MX";
  rec.interimResults = true;
  rec.continuous = false;
  rec.maxAlternatives = 1;

  let finalText = "", failed = false;
  rec.onresult = e => {
    let interim = "";
    for(let i = e.resultIndex; i < e.results.length; i++){
      const r = e.results[i];
      if(r.isFinal) finalText += r[0].transcript;
      else interim += r[0].transcript;
    }
    handlers.partial((finalText + " " + interim).trim());
  };
  rec.onerror = e => {
    const msg = e.error in REC_ERRORS ? REC_ERRORS[e.error] : "Listening failed (" + e.error + ")";
    failed = true;
    if(msg) handlers.fail(msg);
    else handlers.done(null);
  };
  rec.onend = () => { rec = null; if(!failed) handlers.done(finalText.trim() || null); };
  rec.start();
}
function stopListening(){
  if(!rec) return;
  const r = rec; rec = null;
  r.onresult = r.onerror = r.onend = null;
  try{ r.abort(); }catch(e){}
}

/* ---------- 4c. SCORING ---------- */
const normWord = w => w.toLowerCase()
  .replace(/ñ/g, "\u0001")                      // shield ñ from accent stripping
  .normalize("NFD").replace(/[̀-ͯ]/g, "")
  .replace(/\u0001/g, "ñ")
  .replace(/[^a-z0-9ñ]/g, "");

/* Collapse a word to how it actually SOUNDS in Mexican Spanish, so the score
   reflects pronunciation rather than whichever spelling the recognizer picked.
   Seseo (casa/caza), yeísmo (llama/yama), silent h and b/v are all one sound. */
function phonetic(w){
  return normWord(w)
    .replace(/ll/g, "y")
    .replace(/rr/g, "R")          // kept distinct from r: pero vs perro
    .replace(/qu/g, "k")
    .replace(/gu([ei])/g, "g$1")
    .replace(/([cgz])([ei])/g, (m,c,v) => (c === "g" ? "j" : "s") + v)
    .replace(/c/g, "k")
    .replace(/z/g, "s")
    .replace(/v/g, "b")
    .replace(/h/g, "")
    .replace(/(.)\1+/g, "$1");
}

function wordsOf(s){
  return String(s || "").split(/\s+/)
    .map(raw => ({raw, norm: normWord(raw), ph: phonetic(raw)}))
    .filter(w => w.norm);
}

function editDistance(a, b){
  const m = a.length, n = b.length;
  let prev = Array.from({length:n+1}, (_,j) => j), cur = new Array(n+1);
  for(let i=1; i<=m; i++){
    cur[0] = i;
    for(let j=1; j<=n; j++){
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1] ? 0 : 1));
    }
    [prev, cur] = [cur, prev];
  }
  return prev[n];
}
function wordSim(a, b){
  if(a === b) return 1;
  const L = Math.max(a.length, b.length);
  return L ? 1 - editDistance(a,b)/L : 0;
}

/* Needleman-Wunsch alignment of what they said against the target, so a
   dropped or added word shifts the rest instead of failing everything after it. */
function scoreAttempt(target, said){
  const T = wordsOf(target), S = wordsOf(said);
  if(!T.length) return {score:0, marks:[]};
  const m = T.length, n = S.length;
  const dp = Array.from({length:m+1}, () => new Array(n+1).fill(0));
  for(let i=1;i<=m;i++) dp[i][0] = -i;
  for(let j=1;j<=n;j++) dp[0][j] = -j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      const sim = wordSim(T[i-1].ph, S[j-1].ph);
      const diag = dp[i-1][j-1] + (sim === 1 ? 2 : sim >= 0.7 ? 1 : -1);
      dp[i][j] = Math.max(diag, dp[i-1][j] - 1, dp[i][j-1] - 1);
    }
  }
  const marks = [];
  let i = m, j = n;
  while(i > 0){
    if(j > 0){
      const sim = wordSim(T[i-1].ph, S[j-1].ph);
      const diag = dp[i-1][j-1] + (sim === 1 ? 2 : sim >= 0.7 ? 1 : -1);
      if(dp[i][j] === diag){
        marks.push({w:T[i-1].raw, hit: sim === 1 ? "hit" : sim >= 0.7 ? "close" : "miss"});
        i--; j--; continue;
      }
      if(dp[i][j] === dp[i][j-1] - 1){ j--; continue; }
    }
    marks.push({w:T[i-1].raw, hit:"miss"});
    i--;
  }
  marks.reverse();
  const pts = marks.reduce((a,x) => a + (x.hit === "hit" ? 1 : x.hit === "close" ? 0.5 : 0), 0);
  return {score: Math.round(pts / T.length * 100), marks};
}

/* Blank the chunk inside an example sentence. Falls back to produce-mode
   when the sentence uses a variant form (conjugated, contracted, etc.). */
function makeCloze(sentence, chunk){
  const core = chunk.replace(/\s*\+.*$/, "").replace(/[¿?¡!.]/g, "").trim();
  const i = sentence.toLowerCase().indexOf(core.toLowerCase());
  if(i < 0 || !core) return null;
  return {
    before: sentence.slice(0, i),
    hidden: sentence.slice(i, i + core.length),
    after:  sentence.slice(i + core.length)
  };
}

function milestoneProgress(chunkNames){
  const ids = chunkNames.map(n => {
    const c = CHUNKS.find(x => x.chunk === n);
    return c && c.id;
  }).filter(Boolean);
  /* A milestone claims you can DO something, so saying it well counts as
     evidence alongside recalling it — otherwise Shadow and Quick-fire move
     nothing and the whole motivational surface ignores four of six modes. */
  const got = ids.filter(id => {
    const s = statusOf(id);
    return s === "review" || s === "mastered" || scores[id] >= 85 || drills[id] >= 85;
  }).length;
  return {got, total: ids.length};
}
