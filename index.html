<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12100e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calle">
<title>Calle — Real Mexican Spanish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded without blocking first paint: a stylesheet link would hold the whole
     app blank until the request resolves, which on a slow or missing network is
     a white screen. Text paints in the fallback immediately, then swaps. -->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..700&family=Plus+Jakarta+Sans:wght@400..800&display=swap">
<noscript><link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..700&family=Plus+Jakarta+Sans:wght@400..800&display=swap"></noscript>
<style>
:root{
  --bg:#12100e; --surface:#1c1917; --surface-2:#292524; --surface-3:#3a3532;
  --text:#fafaf9; --muted:#a8a29e; --faint:#57534e;
  --accent:#f59e0b; --accent-ink:#1c1200;
  --teal:#2dd4bf; --green:#4ade80; --red:#f87171; --blue:#60a5fa; --violet:#c084fc;
  --radius:16px; --radius-sm:10px;
  --tap:#ffffff0d;
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#faf8f5; --surface:#ffffff; --surface-2:#f4f1ec; --surface-3:#e7e2da;
    --text:#1c1917; --muted:#78716c; --faint:#a8a29e;
    --accent:#b45309; --accent-ink:#fff;
    --teal:#0d9488; --green:#16a34a; --red:#dc2626; --blue:#2563eb; --violet:#7c3aed;
    --tap:#0000000a;
  }
}
/* Two faces, loaded so the app looks the same on every device rather than
   inheriting whatever each OS supplies. System stacks stay as the fallback,
   and both keep the sans/serif split even if the fonts never arrive:
   a serif sentence is Spanish, sans is the app talking. */
:root{
  --ui:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --es:"Fraunces","Iowan Old Style","Palatino",Georgia,serif;
}
.es, .cloze, .li .t b, .iline span, .btn.opt.es-text{
  font-family:var(--es);
  letter-spacing:-.005em;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--ui);
  font-size:16px; line-height:1.5;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
.linkish{color:var(--accent);text-decoration:underline;font:inherit}
input{font:inherit}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
#view{flex:1;padding:16px 16px calc(84px + var(--safe-b));animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- header ---------- */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 20px}
.hdr h1{font-size:26px;line-height:1.1;margin:0;letter-spacing:-.02em;font-weight:700}
.hdr p{margin:2px 0 0;color:var(--muted);font-size:13px}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:17px;flex:none}
.icon-btn:active{background:var(--surface-3)}

/* ---------- generic ---------- */
.card{background:var(--surface);border-radius:var(--radius);padding:16px}
.card + .card{margin-top:12px}
.row{display:flex;gap:12px}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.center{text-align:center}
.stack>*+*{margin-top:12px}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:15px 18px;border-radius:14px;font-weight:650;font-size:16px;
  background:var(--surface-2);transition:transform .08s,filter .12s;
}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--surface-3);color:var(--muted)}
.btn.sm{padding:11px 14px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.4;pointer-events:none}

.badge{
  display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;
  font-weight:650;letter-spacing:.03em;text-transform:uppercase;
  background:var(--surface-2);color:var(--muted);
}
.badge.tier1{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.badge.tier2{background:color-mix(in srgb,var(--blue) 18%,transparent);color:var(--blue)}
.badge.tier3{background:color-mix(in srgb,var(--violet) 18%,transparent);color:var(--violet)}
.badge.vulgar{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}

/* ---------- home ---------- */
.streak{
  display:flex;align-items:center;gap:14px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,var(--surface)),var(--surface));
  border-radius:var(--radius);padding:18px;
}
.streak .flame{font-size:34px;line-height:1}
.streak b{font-size:28px;display:block;line-height:1.1;letter-spacing:-.02em}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border-radius:var(--radius-sm);padding:13px 10px;text-align:center}
.stat b{display:block;font-size:22px;letter-spacing:-.02em;line-height:1.2}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.action{
  display:flex;align-items:center;gap:14px;background:var(--surface);
  border-radius:var(--radius);padding:16px;width:100%;text-align:left;
}
.action:active{background:var(--surface-2)}
.action .em{font-size:26px;flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--surface-2)}
.action .t{flex:1;min-width:0}
.action .t b{display:block;font-size:16px}
.action .t span{font-size:13px;color:var(--muted)}
.action .n{
  flex:none;min-width:28px;height:28px;padding:0 9px;border-radius:99px;background:var(--accent);
  color:var(--accent-ink);font-size:13px;font-weight:700;display:grid;place-items:center;
}
.action .n.zero{background:var(--surface-2);color:var(--faint)}

/* ---------- chunk card ---------- */
.chunk-hero{text-align:center;padding:8px 0 4px}
.chunk-hero .es{
  font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.15;
  display:inline-flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;
}
.chunk-hero .meaning{color:var(--muted);font-size:16px;margin-top:8px}
.chunk-hero .lit{color:var(--faint);font-size:13px;margin-top:6px;font-style:italic}
.spk{
  width:40px;height:40px;border-radius:50%;background:var(--surface-2);
  display:inline-grid;place-items:center;font-size:17px;flex:none;
}
.spk:active{background:var(--accent);color:var(--accent-ink)}
.spk.sm{width:32px;height:32px;font-size:14px}

.ex{display:flex;gap:12px;align-items:flex-start;padding:13px 0}
.ex + .ex{border-top:1px solid var(--surface-2)}
.ex .txt{flex:1;min-width:0}
.ex .es{font-size:17px;font-weight:550;line-height:1.4}
.ex .en{font-size:14px;color:var(--muted);margin-top:3px}
.sec-label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:0 0 4px}

/* how it actually sounds — set in the UI sans, because it's a respelling
   guide rather than Spanish to be read */
.sounds{margin-top:15px;padding:11px 14px;border-radius:12px;background:var(--surface-2);text-align:center}
.sounds .slabel{display:block;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.sounds .sval{display:block;margin-top:4px;font-size:16px;font-weight:600;color:var(--teal);font-family:var(--ui)}

/* per-sentence difficulty */
.lvl{display:inline-flex;align-items:center;gap:3px;margin-top:7px}
.lvl i{width:13px;height:3px;border-radius:99px;background:var(--surface-3)}
.lvl i.on{background:var(--muted)}
.lvl b{font-size:10px;font-weight:600;color:var(--faint);margin-left:5px;text-transform:uppercase;letter-spacing:.06em}

/* ---------- review ---------- */
.progbar{height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-bottom:18px}
.progbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.cloze{font-size:24px;font-weight:650;line-height:1.45;letter-spacing:-.015em;text-align:center;padding:10px 0}
.blank{
  display:inline-block;min-width:88px;border-bottom:3px solid var(--accent);
  vertical-align:baseline;color:transparent;
}
/* min-width only reserves space while it's blank; keeping it after the reveal
   leaves a gap in the middle of the sentence. */
.blank.shown{color:var(--accent);border-bottom-color:transparent;min-width:0}
.prompt-en{text-align:center;color:var(--muted);font-size:15px;margin-top:10px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade{padding:13px 4px;border-radius:13px;background:var(--surface-2);text-align:center;transition:transform .08s}
.grade:active{transform:scale(.95)}
.grade b{display:block;font-size:14px;font-weight:650}
.grade span{font-size:11px;color:var(--muted);display:block;margin-top:2px}
.grade.again b{color:var(--red)} .grade.hard b{color:var(--accent)}
.grade.good b{color:var(--green)} .grade.easy b{color:var(--teal)}

/* ---------- shadow ---------- */
.shadow-big{
  width:100%;aspect-ratio:1/1;max-height:300px;border-radius:24px;
  background:linear-gradient(145deg,color-mix(in srgb,var(--teal) 20%,var(--surface)),var(--surface));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;
}
.shadow-big .es{font-size:23px;font-weight:650;line-height:1.35;letter-spacing:-.015em}
.shadow-big .en{font-size:14px;color:var(--muted)}
.pulse{animation:pulse 1s ease infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.reps{display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--surface-3)}
.dot.on{background:var(--teal)}

/* word-by-word scoring marks */
.mk{transition:color .2s}
.mk.hit{color:var(--green)}
.mk.close{color:var(--accent)}
.mk.miss{color:var(--red);text-decoration:underline;text-decoration-style:wavy;text-underline-offset:5px}
.score{font-size:52px;font-weight:700;letter-spacing:-.03em;line-height:1}
.score span{font-size:22px;font-weight:600;margin-left:2px}
.mic-live{position:relative;width:58px;height:58px;margin:0 auto;display:grid;place-items:center;font-size:25px}
.mic-live .ring{
  position:absolute;inset:0;border-radius:50%;
  background:color-mix(in srgb,var(--red) 30%,transparent);
  animation:ping 1.3s cubic-bezier(0,0,.2,1) infinite;
}
@keyframes ping{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.7);opacity:0}}

/* ---------- stats ---------- */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i{aspect-ratio:1/1;border-radius:2.5px;background:var(--surface-2)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 30%,var(--surface-2))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 55%,var(--surface-2))}
.heat i.l3{background:color-mix(in srgb,var(--accent) 80%,var(--surface-2))}
.heat i.l4{background:var(--accent)}
.bar-row{display:flex;align-items:center;gap:10px;font-size:13px;padding:5px 0}
.bar-row .nm{width:96px;flex:none;color:var(--muted);font-size:12px}
.bar-row .track{flex:1;height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar-row .track i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar-row .v{width:42px;text-align:right;flex:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- browse ---------- */
.lnk{color:var(--accent);text-decoration:underline;font:inherit}

/* reward feedback */
.flash{position:fixed;inset:0;z-index:60;pointer-events:none;animation:flashout .43s ease-out forwards}
.flash.ok{background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--green) 32%,transparent),transparent 62%)}
.flash.bad{background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--red) 26%,transparent),transparent 62%)}
@keyframes flashout{from{opacity:1}to{opacity:0}}
.combo{
  text-align:center;font-size:13px;font-weight:700;color:var(--accent);
  margin:-6px 0 10px;animation:pop .3s cubic-bezier(.2,1.4,.4,1);
}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}

.celebrate{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:61;
  width:min(320px,86vw);background:var(--surface);border-radius:24px;
  padding:30px 24px;text-align:center;
  animation:celebIn .4s cubic-bezier(.2,1.3,.4,1);
}
@keyframes celebIn{from{transform:translate(-50%,-50%) scale(.75);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.celebrate .cem{font-size:58px;line-height:1;animation:bounce .65s ease .1s both}
@keyframes bounce{0%{transform:scale(.4)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
.celebrate .ctitle{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-top:14px}
.celebrate .cname{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:5px}

/* first run */
.intro{display:flex;flex-direction:column;align-items:center;text-align:center;padding:34px 6px 0;min-height:76vh}
.intro .iem{font-size:62px;line-height:1}
.intro h1{font-size:27px;letter-spacing:-.025em;margin:20px 0 0}
.intro p{color:var(--muted);font-size:15px;line-height:1.6;margin:12px 0 0;max-width:330px}
.intro p b{color:var(--text);font-weight:650}
.iline{
  display:flex;align-items:center;gap:10px;margin-top:22px;padding:12px 16px;
  background:var(--surface);border-radius:14px;font-size:17px;font-weight:650;
}
/* goal picker */
.goals{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:18px;text-align:left}
.goal{
  display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:14px;
  background:var(--surface);border:1.5px solid transparent;transition:background .12s,border-color .12s;
}
.goal.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.goal .gem{font-size:22px;flex:none;width:34px;text-align:center}
.goal .gtxt{flex:1;min-width:0}
.goal .gtxt b{display:block;font-size:15px}
.goal .gtxt span{display:block;font-size:12px;color:var(--muted);line-height:1.45}
.goal .gtick{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  font-size:13px;font-weight:700;background:var(--surface-2);color:var(--accent-ink)}
.goal.on .gtick{background:var(--accent)}

.idots{display:flex;gap:7px;margin:auto 0 20px}
.idot{width:7px;height:7px;border-radius:50%;background:var(--surface-3)}
.idot.on{background:var(--accent);width:20px;border-radius:99px}
.intro .btn{max-width:330px}

/* multiple-choice options */
.btn.opt{justify-content:flex-start;text-align:left;font-weight:550;font-size:15px;line-height:1.35;padding:14px 16px}
.btn.opt-right{background:color-mix(in srgb,var(--green) 26%,var(--surface-2));color:var(--text)}
.btn.opt-wrong{background:color-mix(in srgb,var(--red) 26%,var(--surface-2));color:var(--text)}
.btn.opt-dim{opacity:.4}

/* listening speed ramp */
.speed-pips{display:flex;gap:5px;justify-content:center;margin-top:12px}
.pip{width:22px;height:4px;border-radius:99px;background:var(--surface-3)}
.pip.on{background:var(--accent)}

/* quick-fire countdown */
.timer{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:18px}
.timer i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width 1s linear}

/* dialogue bubbles */
.bubble{padding:11px 14px;border-radius:15px;margin:7px 0;max-width:86%}
.bubble .es{font-size:16px;font-weight:600;line-height:1.4}
.bubble .en{font-size:13px;color:var(--muted);margin-top:3px}
.bubble.them{background:var(--surface-2);border-bottom-left-radius:5px}
.bubble.you{background:color-mix(in srgb,var(--accent) 20%,var(--surface-2));margin-left:auto;border-bottom-right-radius:5px}
.bubble.live{outline:1.5px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.cmd{
  display:block;margin-top:5px;padding:9px 11px;border-radius:9px;
  background:var(--bg);color:var(--accent);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;
  user-select:all;-webkit-user-select:all;overflow-x:auto;white-space:nowrap;
}
.search{width:100%;padding:12px 14px;border-radius:13px;background:var(--surface-2);border:none;color:var(--text);outline:none}
.search::placeholder{color:var(--faint)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 0;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 13px;border-radius:99px;background:var(--surface-2);font-size:13px;white-space:nowrap;flex:none;font-weight:550}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.li{display:flex;align-items:center;gap:12px;padding:13px 0;width:100%;text-align:left}
.li + .li{border-top:1px solid var(--surface-2)}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-size:16px;font-weight:600}
.li .t span{font-size:13px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{width:9px;height:9px;border-radius:50%;flex:none;background:var(--surface-3)}
.pill.learning{background:var(--accent)} .pill.review{background:var(--blue)} .pill.mastered{background:var(--green)}

/* ---------- empty ---------- */
.empty{text-align:center;padding:48px 20px}
.empty .em{font-size:46px}
.empty h3{margin:14px 0 6px;font-size:19px}
.empty p{margin:0;color:var(--muted);font-size:14px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:#000a;z-index:40;animation:fade .15s}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);
  border-radius:22px 22px 0 0;padding:20px 18px calc(24px + var(--safe-b));
  max-width:560px;margin:0 auto;max-height:86vh;overflow-y:auto;
  animation:up .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grip{width:38px;height:4px;border-radius:99px;background:var(--surface-3);margin:0 auto 16px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.field + .field{border-top:1px solid var(--surface-2)}
.field select,.field input[type=range]{background:var(--surface-2);border:none;color:var(--text);padding:8px 10px;border-radius:9px;max-width:200px}

/* ---------- nav ---------- */
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--surface-2);padding-bottom:var(--safe-b);
}
nav button{padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);position:relative}
nav button .ic{font-size:19px;line-height:1}
nav button .lb{font-size:10px;font-weight:600;letter-spacing:.01em}
nav button.on{color:var(--accent)}
nav .dot-n{position:absolute;top:6px;right:50%;margin-right:-20px;width:7px;height:7px;border-radius:50%;background:var(--accent)}

.toast{
  position:fixed;bottom:calc(90px + var(--safe-b));left:50%;transform:translateX(-50%);
  background:var(--surface-3);color:var(--text);padding:11px 18px;border-radius:99px;
  font-size:14px;font-weight:550;z-index:50;animation:fade .15s;white-space:nowrap;
}
</style>
</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav id="nav"></nav>
</div>

<script>
"use strict";
/* ============================================================
   CALLE — real-world Mexican Spanish, chunk-first.
   Single-file PWA. No network, no backend. State in localStorage.
   ============================================================ */

/* ---------- 0. FAILSAFE ----------
   The whole interface is built by script into an empty <main>, so anything
   thrown on the way to the first paint used to leave the page background and
   nothing else — no message, no way back, and nothing to report. Show the
   error instead, and offer the one recovery that fixes a bad saved state.
   Deliberately self-contained: it runs before the helpers below exist. */
function fatal(err){
  var msg = (err && (err.stack || err.message)) || String(err);
  var safe = String(msg).replace(/[&<>]/g, function(m){
    return {"&":"&amp;","<":"&lt;",">":"&gt;"}[m];
  });
  document.body.innerHTML =
    '<div style="font:15px/1.5 system-ui,sans-serif;padding:24px;max-width:720px;margin:0 auto">' +
      '<h1 style="font-size:19px;margin:0 0 6px">Calle could not start</h1>' +
      '<p style="margin:0 0 14px;opacity:.75">This is a bug, not something you did. The details below say what went wrong.</p>' +
      '<pre style="white-space:pre-wrap;word-break:break-word;background:#0002;' +
        'padding:12px;border-radius:10px;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace">' + safe + '</pre>' +
      '<button id="calle-reset" style="margin-top:16px;font:600 15px system-ui;' +
        'border:0;border-radius:10px;padding:12px 16px;background:#b45309;color:#fff">' +
        'Clear saved progress and reload</button>' +
      '<p style="margin-top:10px;font-size:13px;opacity:.6">Only clears this app\'s data on this device.</p>' +
    '</div>';
  var b = document.getElementById("calle-reset");
  if(b) b.onclick = function(){
    try{
      Object.keys(localStorage)
        .filter(function(k){ return k.lastIndexOf("calle_", 0) === 0; })
        .forEach(function(k){ localStorage.removeItem(k); });
    }catch(e){}
    location.reload();
  };
}
/* Catches anything thrown while this script is still running, before the
   first render() is even reached. Resource errors (a font that will not
   load) carry no .error and must not trigger this. */
window.addEventListener("error", function(e){ if(e && e.error) fatal(e.error); });
window.addEventListener("unhandledrejection", function(e){ if(e && e.reason) fatal(e.reason); });

/* ---------- 1d. SENTENCE DIFFICULTY ----------
   A tier-1 chunk shown inside a sentence full of other slang is not a tier-1
   lesson. Rating each example separately lets the easy one teach the chunk and
   the hard one wait until the chunk is known. */
const LEVEL_LABEL = ["", "simple", "natural", "fast"];

const bareChunk = s => s.replace(/\s*\+.*$/, "").replace(/[¿?¡!.…]/g, "").trim().toLowerCase();

function rateSentence(es, ownerChunk){
  const words = es.split(/\s+/).filter(Boolean).length;
  let load = words <= 4 ? 0 : words <= 6 ? 0.5 : words <= 9 ? 1.1 : 1.9;
  const owner = bareChunk(ownerChunk.chunk);
  for(const other of CHUNKS){
    if(other.id === ownerChunk.id) continue;
    const core = bareChunk(other.chunk);
    if(core.length < 4) continue;                      // too short to match meaningfully
    /* "la verdad es que" contains "es que" and "verdad"; charging for those
       would penalise the chunk for its own words. */
    if(owner.includes(core)) continue;
    if(es.toLowerCase().includes(core))
      load += other.tier === 1 ? 0.3 : other.tier === 2 ? 0.75 : 1.1;
  }
  /* Thresholds sit on the real spread of the collection (p55 / p90), not on
     round numbers — picked so each band actually holds sentences. */
  return load <= 0.55 ? 1 : load <= 1.15 ? 2 : 3;
}

CHUNKS.forEach(c => {
  c.examples.forEach(e => { e.level = rateSentence(e.es, c); });
  c.examples.sort((a,b) => a.level - b.level);          // gentlest first
});

/* Harder sentences unlock as the chunk itself gets more familiar. */
function pickExample(c, st){
  const iv = st ? st.interval : 0;
  const max = iv >= 21 ? 3 : iv >= 5 ? 2 : 1;
  let pool = c.examples.filter(e => e.level <= max);
  if(!pool.length){
    /* Nothing gentle enough exists for this chunk, so take the gentlest that
       does — never the whole set, which could hand a beginner the hardest. */
    const floor = Math.min(...c.examples.map(e => e.level));
    pool = c.examples.filter(e => e.level === floor);
  }
  return pool[Math.floor(Math.random() * pool.length)];
}

/* ---------- 1e. DIALOGUES ---------- */
/* Chunks in isolation don't teach turn-taking. Each dialogue is a real
   exchange; on your turns you pick the natural reply from three options,
   where the wrong ones are plausible but off in register or meaning. */
function D(title, setting, turns){ return {id:"d"+title.length+turns.length+title.charCodeAt(0), title, setting, turns}; }
function THEM(es, en){ return {who:"them", es, en}; }
function YOU(es, en, wrong){ return {who:"you", es, en, wrong}; }

const DIALOGUES = [
  D("Running into a friend", "You bump into a friend you haven't seen in months.", [
    THEM("¡Qué onda! ¿Cómo has estado?", "Hey! How have you been?"),
    YOU("Aquí nomás, chambeando. ¿Y tú?", "Just getting by, working. And you?",

/* Chunk ids are positional ("c" + index), so any build that inserts or drops

   id this build no longer has, and every practice mode looks its queue up with

/* ---------- 3. SRS ENGINE (SM-2 lite) ---------- */
const LEARN_STEPS = [1/1440, 10/1440];   // 1 min, 10 min (in days)
const GRADE = {again:0, hard:1, good:2, easy:3};
const MASTERED_AT = 21;                  // days interval == "mastered"

function newState(){
  return {ease:2.5, interval:0, due:Date.now(), reps:0, lapses:0, step:0, status:"learning"};
}

function schedule(st, grade){
  const s = {...st};
  s.reps++;
  if(s.status === "learning"){
    if(grade === GRADE.again){ s.step = 0; }
    else if(grade === GRADE.easy){ s.status = "review"; s.interval = 4; s.step = 0; }
    else if(grade === GRADE.hard){ /* repeat current step */ }
    else { s.step++; if(s.step >= LEARN_STEPS.length){ s.status = "review"; s.interval = 1; } }
    s.due = s.status === "review"
      ? Date.now() + s.interval * DAY
      : Date.now() + LEARN_STEPS[Math.min(s.step, LEARN_STEPS.length-1)] * DAY;
    return s;
  }
  // review cards
  if(grade === GRADE.again){
    s.lapses++; s.ease = Math.max(1.3, s.ease - 0.2);
    s.status = "learning"; s.step = 0; s.interval = 0;
    s.due = Date.now() + LEARN_STEPS[0] * DAY;
    return s;
  }
  if(grade === GRADE.hard){ s.ease = Math.max(1.3, s.ease - 0.15); s.interval = Math.max(1, s.interval * 1.2); }
  else if(grade === GRADE.good){ s.interval = Math.max(1, s.interval * s.ease); }
  else { s.ease = Math.min(2.8, s.ease + 0.15); s.interval = Math.max(1, s.interval * s.ease * 1.3); }
  s.interval = Math.round(s.interval * 10) / 10;
  s.due = Date.now() + s.interval * DAY;
  return s;
}

function previewInterval(st, grade){
  const s = schedule(st, grade);
  const d = (s.due - Date.now()) / DAY, mins = d * 1440;
  if(mins < 1)  return "<1m";
  if(mins < 60) return Math.round(mins) + "m";
  if(d < 1)     return Math.round(d*24) + "h";
  if(d < 30)    return Math.round(d) + "d";
  return (d/30).toFixed(1).replace(/\.0$/,"") + "mo";
}

const inDeck   = id => !!srs[id];
const dueCards = () => Object.keys(srs).filter(id => srs[id].due <= Date.now());
/* Within a tier, deal the categories round-robin instead of in the order the
   collection happens to be written. Sorting by tier alone is stable, so the
   authoring order leaked through and the first fifteen chunks were all
   fillers — and a filler glues other things together, so a deck of nothing but
   glue says nothing at all. One from each category in turn means you can
   react, ask, agree and get yourself out of trouble from the first day. */
const CAT_ORDER = Object.keys(CAT);
function spreadByCategory(list){
  const tiers = new Map();
  for(const c of list){
    if(!tiers.has(c.tier)) tiers.set(c.tier, new Map());
    const byCat = tiers.get(c.tier);
    if(!byCat.has(c.category)) byCat.set(c.category, []);
    byCat.get(c.category).push(c);
  }
  const out = [];
  for(const tier of [...tiers.keys()].sort((a,b) => a - b)){
    const byCat = tiers.get(tier);
    const queues = CAT_ORDER.map(k => byCat.get(k)).filter(Boolean);
    for(let any = true; any; ){
      any = false;
      for(const q of queues) if(q.length){ out.push(q.shift()); any = true; }
    }
  }
  return out;
}

/* Ordering new chunks. Anything skipped sinks below what you haven't judged.
   With goals set, the two streams are woven two-to-one rather than sorted
   together: a bonus large enough to lift goal words up is also large enough to
   bury every universal chunk behind them, and the glue — o sea, la neta, es
   que — is what makes any of the goals speakable. Glue leads, goal vocabulary
   arrives steadily alongside it. */
const GOAL_WEAVE = 2;
function newCards(){
  const pool = CHUNKS.filter(c => !inDeck(c.id) && !(settings.salty === false && c.register === "vulgar"));
  const order = list => spreadByCategory(list.filter(c => !skipped[c.id]))
                 .concat(spreadByCategory(list.filter(c => skipped[c.id])));
  if(!myGoals.length) return order(pool);

  const mine = order(pool.filter(hasGoal));
  const rest = order(pool.filter(c => !hasGoal(c)));
  const out = [];
  while(mine.length || rest.length){
    out.push(...rest.splice(0, GOAL_WEAVE), ...mine.splice(0, 1));
  }
  return out;
}
const statusOf = id => {
  const s = srs[id];
  if(!s) return "new";
  if(s.status === "learning") return "learning";
  return s.interval >= MASTERED_AT ? "mastered" : "review";
};

function markStudied(){
  const t = todayKey();
  streak.days[t] = (streak.days[t] || 0) + 1;
  if(streak.last !== t){
    streak.count = streak.last === yesterdayKey() ? streak.count + 1 : 1;
    streak.last = t;
  }
  saveStreak();
}

/* current streak, recomputed so it decays when you skip a day */
function liveStreak(){
  if(!streak.last) return 0;
  return (streak.last === todayKey() || streak.last === yesterdayKey()) ? streak.count : 0;
}

/* ---------- 4. SPEECH OUT ---------- */
const SS = window.speechSynthesis || null;
let voices = [];
let audioNote = SS ? null : "This browser has no speech synthesis.";

function refreshVoices(){
  if(!SS) return;
  const v = SS.getVoices();
  if(v && v.length) voices = v;
}
if(SS){
  refreshVoices();
  SS.onvoiceschanged = refreshVoices;
  /* Chrome populates getVoices() asynchronously and Safari may never fire
     voiceschanged, so poll briefly until the list shows up. */
  let tries = 0;
  const poll = setInterval(() => {
    refreshVoices();
    if(voices.length || ++tries > 25) clearInterval(poll);
  }, 200);
}

function esVoices(){ return voices.filter(v => /^es/i.test(v.lang)); }
function pickVoice(){
  const list = esVoices();
  if(settings.voice){
    const saved = list.find(v => v.voiceURI === settings.voice);
    if(saved) return saved;
  }
  return list.find(v => /es[-_]MX/i.test(v.lang))
      || list.find(v => /es[-_]US/i.test(v.lang))
      || list.find(v => /es[-_](419|CO|AR|CL|PE)/i.test(v.lang))
      || list[0]
      || null;
}

function audioProblem(){
  if(!SS) return "This browser has no speech synthesis.";
  if(!voices.length) return "No speech voices are available on this device.";
  if(!esVoices().length) return "No Spanish voice installed — add one in your system settings.";
  return null;
}

function speak(text, rate){
  if(!SS){ toast(audioNote); return; }
  refreshVoices();
  const problem = audioProblem();
  if(problem){ audioNote = problem; toast(problem); return; }

  /* Only cancel when something is actually queued: an unconditional
     cancel() immediately before speak() drops the utterance in Chrome. */
  if(SS.speaking || SS.pending) SS.cancel();
  if(SS.paused) SS.resume();

  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice();
  u.voice = v;
  u.lang  = v.lang || "es-MX";
  u.rate  = rate || settings.rate;
  u.onerror = e => {
    if(e.error === "interrupted" || e.error === "canceled") return;
    audioNote = "Audio failed (" + e.error + ")";
    toast(audioNote);
  };
  u.onstart = () => { audioNote = null; };
  SS.speak(u);
  /* Chrome occasionally parks the queue in a paused state. */
  setTimeout(() => { if(SS.paused) SS.resume(); }, 150);
}

/* ---------- 3b. BACKUP ----------
   Everything lives in localStorage, which one cleared cache wipes. These move
   it in and out as a plain file. */
const BACKUP_KEYS = ["srs","streak","scores","ears","dialogDone","drills",
                     "skipped","unlocked","totals","settings","seenIntro","goals"];

function backupBlob(){
  const payload = {app:"calle", version:1, exported:new Date().toISOString(), data:{}};
  BACKUP_KEYS.forEach(k => {
    const v = LS.get(k, null);
    if(v !== null) payload.data[k] = v;
  });
  return payload;
}

function exportProgress(){
  const payload = backupBlob();
  const url = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"}));
  const a = document.createElement("a");
  a.href = url;
  a.download = `calle-progress-${todayKey()}.json`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
  toast("Backup downloaded");
}

/* Only writes keys it recognises, so a stray file can't inject anything. */
function importProgress(file, done){
  const r = new FileReader();
  r.onerror = () => done("Couldn't read that file.");
  r.onload = () => {
    let parsed;
    try{ parsed = JSON.parse(r.result); }
    catch(e){ return done("That file isn't valid JSON."); }
    if(!parsed || parsed.app !== "calle" || typeof parsed.data !== "object" || !parsed.data)
      return done("That doesn't look like a Calle backup.");
    const keys = Object.keys(parsed.data).filter(k => BACKUP_KEYS.includes(k));
    if(!keys.length) return done("That backup is empty.");
    keys.forEach(k => LS.set(k, parsed.data[k]));
    done(null, keys.length);
  };
  r.readAsText(file);
}

/* ---------- 4a. SOUND & REWARD ----------
   Tones are synthesised rather than loaded, so the app stays one file and
   still chimes with the network off. */
let actx = null;
function sfx(notes, o){
  if(settings.sound === false) return;
  o = o || {};
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    actx = actx || new AC();
    if(actx.state === "suspended") actx.resume();
    notes.forEach((f, i) => {
      const t0  = actx.currentTime + i * (o.gap != null ? o.gap : 0.07);
      const dur = o.dur || 0.18;
      const osc = actx.createOscillator(), gain = actx.createGain();
      osc.type = o.type || "sine";
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(o.vol || 0.13, t0 + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain); gain.connect(actx.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.03);
    });
  }catch(e){}
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;

/* A page opened straight from disk has no real origin, so browsers refuse it
   the microphone no matter what the user allows. Nothing in the app can fix
   that, so say what will. */
const IS_FILE = location.protocol === "file:";
const FILE_MSG = "Browsers won't give the microphone to a page opened from disk. "
               + "Serve this folder and open it from there — see Settings.";
const SERVE_CMD = "python3 -m http.server 8000";

function recProblem(){
  if(!SR) return "This browser can't listen — try Chrome, Edge or Safari.";
  if(!window.isSecureContext) return "Scoring needs https:// or localhost.";
  return null;
}

const REC_ERRORS = {
  "not-allowed":        IS_FILE ? FILE_MSG : "Microphone blocked — allow mic access for this site, then try again.",
  "service-not-allowed":IS_FILE ? FILE_MSG : "The browser blocked the microphone.",
  "no-speech":          "Didn't catch anything — try again.",
  "audio-capture":      "No microphone found.",
  "network":            "Scoring needs an internet connection.",
  "aborted":            null,
};

function micErrorMessage(err){
  const n = (err && err.name) || String(err);
  if(n === "NotAllowedError" || n === "SecurityError")
    return IS_FILE ? FILE_MSG : "Microphone blocked — allow mic access for this site, then try again.";
  if(n === "NotFoundError" || n === "DevicesNotFoundError") return "No microphone found.";
  if(n === "NotReadableError" || n === "TrackStartError")   return "Your microphone is in use by another app.";
  return "Couldn't open the microphone (" + n + ").";
}

let rec = null;
function startListening(handlers){
  const problem = recProblem();
  if(problem) return handlers.fail(problem);
  stopListening();

  /* Ask for the mic directly first: the recognizer's own failure is a bare
     "not-allowed" with no indication of why, while getUserMedia distinguishes
     denied from missing from busy. */
  const md = navigator.mediaDevices;
  if(md && md.getUserMedia){
    md.getUserMedia({audio:true})
      .then(stream => {
        stream.getTracks().forEach(t => t.stop());   // recognizer opens its own
        beginRecognition(handlers);
      })
      .catch(err => handlers.fail(micErrorMessage(err)));
  }else{
    beginRecognition(handlers);
  }
}

function beginRecognition(handlers){
  try{ rec = new SR(); }
  catch(e){ return handlers.fail("Couldn't start the microphone."); }

  rec.lang = "es-MX";
  rec.interimResults = true;
  rec.continuous = false;
  rec.maxAlternatives = 1;

  let finalText = "", failed = false;
  rec.onresult = e => {
    let interim = "";
    for(let i = e.resultIndex; i < e.results.length; i++){
      const r = e.results[i];
      if(r.isFinal) finalText += r[0].transcript;
      else interim += r[0].transcript;
    }
    handlers.partial((finalText + " " + interim).trim());
  };
  rec.onerror = e => {
    const msg = e.error in REC_ERRORS ? REC_ERRORS[e.error] : "Listening failed (" + e.error + ")";
    failed = true;
    if(msg) handlers.fail(msg);
    else handlers.done(null);
  };
  rec.onend = () => { rec = null; if(!failed) handlers.done(finalText.trim() || null); };
  rec.start();
}
function stopListening(){
  if(!rec) return;
  const r = rec; rec = null;
  r.onresult = r.onerror = r.onend = null;
  try{ r.abort(); }catch(e){}
}

/* ---------- 4c. SCORING ---------- */
const normWord = w => w.toLowerCase()
  .replace(/ñ/g, "\u0001")                      // shield ñ from accent stripping
  .normalize("NFD").replace(/[̀-ͯ]/g, "")
  .replace(/\u0001/g, "ñ")
  .replace(/[^a-z0-9ñ]/g, "");

/* Collapse a word to how it actually SOUNDS in Mexican Spanish, so the score
   reflects pronunciation rather than whichever spelling the recognizer picked.
   Seseo (casa/caza), yeísmo (llama/yama), silent h and b/v are all one sound. */
function phonetic(w){
  return normWord(w)
    .replace(/ll/g, "y")
    .replace(/rr/g, "R")          // kept distinct from r: pero vs perro
    .replace(/qu/g, "k")
    .replace(/gu([ei])/g, "g$1")
    .replace(/([cgz])([ei])/g, (m,c,v) => (c === "g" ? "j" : "s") + v)
    .replace(/c/g, "k")
    .replace(/z/g, "s")
    .replace(/v/g, "b")
    .replace(/h/g, "")
    .replace(/(.)\1+/g, "$1");
}

function wordsOf(s){
  return String(s || "").split(/\s+/)
    .map(raw => ({raw, norm: normWord(raw), ph: phonetic(raw)}))
    .filter(w => w.norm);
}

function editDistance(a, b){
  const m = a.length, n = b.length;
  let prev = Array.from({length:n+1}, (_,j) => j), cur = new Array(n+1);
  for(let i=1; i<=m; i++){
    cur[0] = i;
    for(let j=1; j<=n; j++){
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1] ? 0 : 1));
    }
    [prev, cur] = [cur, prev];
  }
  return prev[n];
}
function wordSim(a, b){
  if(a === b) return 1;
  const L = Math.max(a.length, b.length);
  return L ? 1 - editDistance(a,b)/L : 0;
}

/* Needleman-Wunsch alignment of what they said against the target, so a
   dropped or added word shifts the rest instead of failing everything after it. */
function scoreAttempt(target, said){
  const T = wordsOf(target), S = wordsOf(said);
  if(!T.length) return {score:0, marks:[]};
  const m = T.length, n = S.length;
  const dp = Array.from({length:m+1}, () => new Array(n+1).fill(0));
  for(let i=1;i<=m;i++) dp[i][0] = -i;
  for(let j=1;j<=n;j++) dp[0][j] = -j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      const sim = wordSim(T[i-1].ph, S[j-1].ph);
      const diag = dp[i-1][j-1] + (sim === 1 ? 2 : sim >= 0.7 ? 1 : -1);
      dp[i][j] = Math.max(diag, dp[i-1][j] - 1, dp[i][j-1] - 1);
    }
  }
  const marks = [];
  let i = m, j = n;
  while(i > 0){
    if(j > 0){
      const sim = wordSim(T[i-1].ph, S[j-1].ph);
      const diag = dp[i-1][j-1] + (sim === 1 ? 2 : sim >= 0.7 ? 1 : -1);
      if(dp[i][j] === diag){
        marks.push({w:T[i-1].raw, hit: sim === 1 ? "hit" : sim >= 0.7 ? "close" : "miss"});
        i--; j--; continue;
      }
      if(dp[i][j] === dp[i][j-1] - 1){ j--; continue; }
    }
    marks.push({w:T[i-1].raw, hit:"miss"});
    i--;
  }
  marks.reverse();
  const pts = marks.reduce((a,x) => a + (x.hit === "hit" ? 1 : x.hit === "close" ? 0.5 : 0), 0);
  return {score: Math.round(pts / T.length * 100), marks};
}

/* Blank the chunk inside an example sentence. Falls back to produce-mode
   when the sentence uses a variant form (conjugated, contracted, etc.). */
function makeCloze(sentence, chunk){
  const core = chunk.replace(/\s*\+.*$/, "").replace(/[¿?¡!.]/g, "").trim();
  const i = sentence.toLowerCase().indexOf(core.toLowerCase());
  if(i < 0 || !core) return null;
  return {
    before: sentence.slice(0, i),
    hidden: sentence.slice(i, i + core.length),
    after:  sentence.slice(i + core.length)
  };
}

  const ids = chunkNames.map(n => {

  /* A milestone claims you can DO something, so saying it well counts as
     evidence alongside recalling it — otherwise Shadow and Quick-fire move
     nothing and the whole motivational surface ignores four of six modes. */
  const got = ids.filter(id => {
    const s = statusOf(id);

  return {got, total: ids.length};

/* ----- Daily session -----
   One queue that actually runs all three stages back to back. The modes stay
   the same; the flow just decides what comes next and counts what got done. */
/* How much new material a day. This was five, hardcoded, which puts the whole
   collection two months out and quietly contradicts the promise the app makes
   on its own intro screen. The learner sets the pace instead, and Today says
   where the one they picked actually lands them. */
const PACES = {
  steady:  {label:"Steady",  fresh:5,  listen:4,  review:20, mins:"5 min"},
  brisk:   {label:"Brisk",   fresh:12, listen:8,  review:40, mins:"15 min"},
  intense: {label:"Intense", fresh:20, listen:12, review:60, mins:"25 min"},
};
const pace = () => PACES[settings.pace] || PACES.brisk;
let flow = null;

function sessionPlan(){
  const p = pace();
  const review = Math.min(dueCards().length, p.review);
  const fresh  = Math.min(newCards().length, p.fresh);
  const listen = Object.keys(srs).length >= 4 ? p.listen : 0;
  return {review, fresh, listen, total: review + fresh + listen};
}

/* Days until every remaining chunk has at least been met, at the current
   pace. Shown because "63 days" is the kind of thing a learner should be
   told before they commit, not after. */
function daysToFinish(){
  const left = CHUNKS.length - Object.keys(srs).length;
  if(left <= 0) return 0;
  return Math.ceil(left / pace().fresh);
}

function startSessionFlow(){
  const p = sessionPlan();
  if(!p.total) return go("learn");
  const stages = [];
  if(p.review) stages.push("review");
  if(p.fresh)  stages.push("learn");
  if(p.listen) stages.push("listen");
  flow = {stages, i:0, left:{learn:p.fresh, listen:p.listen}, plan:p, did:{review:0, learn:0, listen:0}};
  session = null; earCard = null; learnCard = null;
  go(stages[0]);
}

/* Called when a stage runs out of work. Returns true if the flow handled it. */
function flowNext(){
  if(!flow) return false;
  flow.i++;
  session = null; earCard = null; learnCard = null;
  go(flow.i >= flow.stages.length ? "sessionDone" : flow.stages[flow.i]);
  return true;
}
function flowTick(stage){
  if(!flow) return false;
  flow.did[stage]++;
  if(stage === "review") return false;          // review ends when its queue empties
  return --flow.left[stage] <= 0 ? flowNext() : false;
}
const flowDone = () => flow ? flow.did.review + flow.did.learn + flow.did.listen : 0;
function flowBar(){
  if(!flow) return "";
  return `<div class="progbar" style="margin-bottom:14px"><i style="width:${(flowDone()/flow.plan.total*100).toFixed(0)}%"></i></div>`;
}

function renderSessionDone(){
  const d = flow ? flow.did : {review:0, learn:0, listen:0};
  const total = d.review + d.learn + d.listen;
  flow = null;
  SFX.done();
  view.innerHTML = header("Done for today", "Session complete") + `
    <div class="card center" style="padding:26px 16px">
      <div class="flame" style="font-size:44px">\u{1F525}</div>
      <div class="score" style="font-size:40px;margin-top:6px">${total}<span> items</span></div>
      <div class="muted tiny" style="margin-top:6px">${liveStreak()} day streak</div>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="bar-row"><span class="nm" style="flex:1;width:auto">\u{1F504} Reviewed</span><span class="v">${d.review}</span></div>
      <div class="bar-row"><span class="nm" style="flex:1;width:auto">\u{2728} Learned</span><span class="v">${d.learn}</span></div>
      <div class="bar-row"><span class="nm" style="flex:1;width:auto">\u{1F442} Heard</span><span class="v">${d.listen}</span></div>
    </div>
    <div class="stack" style="margin-top:16px">
      <button class="btn primary" data-go="practice">Keep going in Practice</button>
      <button class="btn ghost" data-go="home">Back to Today</button>
    </div>`;
}

/* ----- Review ----- */
function startSession(){
  const ids = shuffle(dueCards()).slice(0, 25);
  session = {queue: ids, done: 0, total: ids.length, shown: false, card: null};
  nextCard();
}
function nextCard(){
  session.shown = false;
  session.spoke = false;
  const id = session.queue.shift();
  if(!id){ session.card = null; return; }
  const c = byId(id);
  const ex = pickExample(c, srs[id]);
  session.card = {chunk: c, ex, cloze: makeCloze(ex.es, c.chunk)};
}

function renderReview(){
  const due = dueCards().length;
  if(!session && !due){
    const next = Object.values(srs).sort((a,b)=>a.due-b.due)[0];
    const when = next ? relTime(next.due) : null;
    view.innerHTML = header("Review", "Spaced recall") + empty("\u{2705}", "All caught up",
      when ? `Next chunk is ready ${when}.` : "Add some chunks from Learn to start reviewing.");
    return;
  }
  if(!session) startSession();
  if(!session.card){
    const n = session.done;
    session = null;
    view.innerHTML = header("Review", "Session complete") + empty("\u{1F44F}", `${n} chunk${n===1?"":"s"} reviewed`,
      "Nice. Come back when the next batch is due — or go learn something new.") +
      `<button class="btn primary" data-go="learn">Learn new chunks</button>`;
    return;
  }

  const {chunk:c, ex, cloze} = session.card;
  const shown = session.shown;
  const pct = session.total ? (session.done / session.total) * 100 : 0;

  const prompt = cloze
    ? `<div class="cloze">${esc(cloze.before)}<span class="blank${shown?" shown":""}">${esc(cloze.hidden)}</span>${esc(cloze.after)}</div>
       <div class="prompt-en">${esc(ex.en)}</div>`
    : `<div class="prompt-en" style="font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)">How would you say</div>
       <div class="cloze">${esc(ex.en)}</div>
       ${shown ? `<div class="prompt-en" style="color:var(--accent);font-size:19px;font-weight:600;margin-top:12px">${esc(ex.es)}</div>` : ""}`;

  view.innerHTML = header("Review", `${session.done+1} of ${session.total}`) + `
    <div class="progbar"><i style="width:${pct}%"></i></div>
    ${comboBadge()}
    <div class="card" style="padding:22px 16px">${prompt}</div>
    ${shown ? `
      <div class="card">
        <div class="center" style="margin-bottom:8px">${tierBadge(c)}</div>
        <div class="chunk-hero" style="padding-top:0">
          <div class="es" style="font-size:27px">${esc(c.chunk)} ${speakerBtn(ex.es)}</div>
          <div class="meaning">${esc(c.meaning)}</div>
        </div>
        ${soundsHtml(c)}
      </div>` : ""}
    <div style="margin-top:16px">
      ${shown ? gradesHtml(srs[c.id]) : `<button class="btn primary" data-reveal="1">Show answer</button>`}
    </div>`;

  if(shown && !session.spoke){ session.spoke = true; speak(ex.es); }
}

function gradesHtml(st){
  const g = [["again","Again"],["hard","Hard"],["good","Good"],["easy","Easy"]];
  return `<div class="grades">` + g.map(([k,label]) =>
    `<button class="grade ${k}" data-grade="${k}"><b>${label}</b><span>${previewInterval(st, GRADE[k])}</span></button>`
  ).join("") + `</div>`;
}

function relTime(ts){
  const d = (ts - Date.now()) / DAY;
  if(d <= 0) return "now";
  if(d < 1/24) return "in a few minutes";
  if(d < 1) return "in " + Math.round(d*24) + "h";
  if(d < 2) return "tomorrow";
  return "in " + Math.round(d) + " days";
}

/* ----- Listen: audio-first recognition with a speed ramp ----- */
/* Reading the text while hearing it teaches reading. Hiding the text is the
   only way to train the ear for fast, reduced Mexican speech. */
const EAR_RATES = [0.7, 0.85, 1.0, 1.15];
const EAR_LABELS = ["slow", "easy", "normal", "fast"];
const earLevel = id => Math.min(EAR_RATES.length - 1, ears[id] || 0);

/* Practice used to top its queue up silently, so it ran until you closed it.
   A round has a finish line, a score, and a decision to carry on. */
const EAR_ROUND = 10;
let earQ = null, earCard = null, earPick = null, earPlayed = null;
let earScore = {right:0, total:0}, earRoundSize = 0;

function startEarRound(){
  const pool = Object.keys(srs);
  earQ = shuffle(pool).slice(0, Math.min(EAR_ROUND, pool.length));
  earRoundSize = earQ.length;
  earScore = {right:0, total:0};
  earCard = null;
}

function buildEarCard(){
  const id = earQ.shift();
  const c = byId(id);
  const ex = pickExample(c, srs[c.id]);
  const wrong = shuffle(CHUNKS.filter(o => o.id !== id && o.category === c.category))
    .slice(0, 3).map(o => o.examples[0].en);
  while(wrong.length < 3){
    const r = CHUNKS[Math.floor(Math.random()*CHUNKS.length)];
    if(r.id !== id && !wrong.includes(r.examples[0].en)) wrong.push(r.examples[0].en);
  }
  earCard = {c, ex, options: shuffle([ex.en, ...wrong])};
  earPick = null;
  earPlayed = null;
}

function renderListen(){
  /* Never quiz a beginner on chunks they've never met — that's a guess, not
     listening practice. */
  if(!Object.keys(srs).length){
    view.innerHTML = header("Listen", "Train your ear") +
      empty("\u{1F442}", "Learn a few chunks first",
            "Then you'll hear them with no text on screen, speeding up as you get them.") +
      `<button class="btn primary" data-go="learn">Learn some chunks</button>`;
    return;
  }
  if(!earQ) startEarRound();
  if(!earCard){
    if(!earQ.length){
      /* A daily session sets its own length, so keep feeding it. */
      if(flow) startEarRound(); else return renderEarDone();
    }
    buildEarCard();
  }
  const {c, ex, options} = earCard;
  const lvl = earLevel(c.id);
  const answered = earPick !== null;
  const right = answered && earPick === ex.en;

  view.innerHTML = header("Listen", flow ? `Session · ${flowDone()+1} of ${flow.plan.total}`
                                         : `${earScore.total+1} of ${earRoundSize} · ${EAR_LABELS[lvl]} speed`)
    + flowBar() + comboBadge() + `
    <div class="card center" style="padding:26px 16px">
      <button class="spk" style="width:76px;height:76px;font-size:30px" data-ear="play">\u{1F50A}</button>
      <div class="tiny muted" style="margin-top:12px">${answered ? "" : "Tap to hear it again"}</div>
      <div class="speed-pips">${EAR_RATES.map((r,i) =>
        `<span class="pip${i <= lvl ? " on" : ""}" title="${r}x"></span>`).join("")}</div>
      ${answered ? `
        <div class="es" style="font-size:21px;font-weight:650;margin-top:14px;line-height:1.35">${esc(ex.es)}</div>
        <div class="muted tiny" style="margin-top:6px">${esc(c.chunk)} — ${esc(c.meaning)}</div>`
      : `<button class="btn ghost sm" style="margin-top:14px;width:auto;display:inline-flex" data-ear="slow">\u{1F422} Slower</button>`}
    </div>

    <p class="sec-label" style="margin:18px 0 8px">What did you hear?</p>
    <div class="stack">
      ${options.map(o => {
        let cls = "";
        if(answered){
          if(o === ex.en) cls = " opt-right";
          else if(o === earPick) cls = " opt-wrong";
          else cls = " opt-dim";
        }
        return `<button class="btn opt${cls}" ${answered ? "" : `data-ear-pick="${esc(o)}"`}>${esc(o)}</button>`;
      }).join("")}
    </div>

    ${answered ? `
      <div class="card center" style="margin-top:14px">
        <b style="color:${right ? "var(--green)" : "var(--red)"}">
          ${right ? (lvl >= EAR_RATES.length-1 ? "Nailed it at full speed" : "Right — speeding up") : "Not quite — slowing down"}
        </b>
      </div>
      <button class="btn primary" style="margin-top:12px" data-ear="next">Next</button>` : ""}`;

  if(!answered && earPlayed !== c.id + ex.es){
    earPlayed = c.id + ex.es;
    speak(ex.es, EAR_RATES[lvl]);
  }
}

function renderEarDone(){
  const {right, total} = earScore;
  const pct = total ? Math.round(right / total * 100) : 0;
  const atFull = Object.values(ears).filter(l => l >= EAR_RATES.length - 1).length;
  SFX.done();
  view.innerHTML = header("Listen", "Round complete") + `
    <div class="card center" style="padding:26px 16px">
      <div class="score" style="color:${scoreColor(pct)}">${right}<span>/${total}</span></div>
      <div style="font-weight:650;margin-top:4px">${
        pct === 100 ? "Perfect round" : pct >= 70 ? "Good round" : "Worth another go"}</div>
      <div class="muted tiny" style="margin-top:10px">
        ${atFull} chunk${atFull===1?"":"s"} you now recognise at full speed, no text.</div>
    </div>
    <div class="stack" style="margin-top:16px">
      <button class="btn primary" data-ear="again">Another round</button>
      <button class="btn ghost" data-go="practice">Back to Practice</button>
    </div>`;
}

/* ----- Shadow ----- */
const SHADOW_ROUND = 8;
let listening = false, heard = "", result = null, recNote = null, shadowSpoken = null;
let shadowDoneCount = 0;

function resetAttempt(){ listening = false; heard = ""; result = null; recNote = null; }

/* Tear down anything a mode left running before switching away from it. */
function leaveMode(){
  flow = null;          // tapping a tab mid-session abandons it
  stopListening();
  resetAttempt();
  shadowSpoken = null;
  clearDrillTimer();
  drillCard = null; drillRound = null;
  earCard = null; earQ = null;
  shadowQ = null;
  dlg = null;
}

function renderShadow(){
  const deck = Object.keys(srs);
  if(!deck.length){
    view.innerHTML = header("Shadow", "Say it out loud") + empty("\u{1F3A7}", "Nothing to shadow yet",
      "Add a few chunks from Learn, then come back and repeat them out loud.");
    return;
  }
  if(!shadowQ){
    shadowQ = shuffle(deck).slice(0, Math.min(SHADOW_ROUND, deck.length)).map(id => {
      const c = byId(id);
      return {c, ex: pickExample(c, srs[id]), reps: 0};
    });
    shadowDoneCount = 0;
  }
  if(!shadowQ.length) return renderShadowDone();
  const item = shadowQ[0];
  const best = scores[item.c.id];
  const blocked = recProblem();

  const sentence = result
    ? result.marks.map(m => `<span class="mk ${m.hit}">${esc(m.w)}</span>`).join(" ")
    : esc(item.ex.es);

  view.innerHTML = header("Shadow", `${shadowQ.length} left · ${totals.shadowReps} said out loud`) + `
    <div class="shadow-big">
      <div class="es">${sentence}</div>
      <div class="en">${esc(item.ex.en)}</div>
      <button class="spk" style="width:58px;height:58px;font-size:23px" data-speak="${esc(item.ex.es)}">\u{1F50A}</button>
      <div class="reps">
        ${[0,1,2].map(i => `<span class="dot${item.reps>i?" on":""}"></span>`).join("")}
        <span>listen · repeat · repeat</span>
      </div>
    </div>

    ${result ? scoreCard(result) : ""}
    ${listening ? `
      <div class="card center" style="margin-top:12px">
        <div class="mic-live"><span class="ring"></span>\u{1F3A4}</div>
        <div class="muted tiny" style="margin-top:8px">${heard ? esc(heard) : "Listening… say it now"}</div>
      </div>` : ""}
    ${recNote ? `<div class="card center tiny" style="margin-top:12px;color:var(--accent)">${esc(recNote)}</div>` : ""}

    <div class="card" style="margin-top:12px">
      <div class="center"><b style="font-size:19px">${esc(item.c.chunk)}</b>
      <div class="muted tiny" style="margin-top:4px">${esc(item.c.meaning)}</div>
      ${best != null ? `<div class="tiny" style="margin-top:6px;color:${scoreColor(best)}">Best score ${best}%</div>` : ""}
      </div>
    </div>

    <div class="stack" style="margin-top:16px">
      ${blocked ? `<div class="tiny muted center">${esc(blocked)}</div>`
        : listening
          ? `<button class="btn" data-shadow="stop">Stop listening</button>`
          : `<button class="btn primary" data-shadow="listen">\u{1F3A4} ${result ? "Say it again" : "Say it — I'll score you"}</button>`}
      ${!blocked && IS_FILE ? `<div class="tiny muted center" style="line-height:1.6">
        Opened from disk — the mic needs a served page.
        <button class="lnk" data-sheet="settings">How to fix</button></div>` : ""}
      ${blocked
        ? `<button class="btn primary" data-shadow="rep">I said it out loud</button>`
        : `<button class="btn ghost tiny" data-shadow="rep">Count it without scoring</button>`}
      <button class="btn ghost" data-shadow="next">Next phrase</button>
    </div>`;

  /* Only auto-play when the phrase first appears, never on interim re-renders. */
  if(item.reps === 0 && !listening && !result && shadowSpoken !== item.c.id){
    shadowSpoken = item.c.id;
    speak(item.ex.es);
  }
}

function renderShadowDone(){
  SFX.done();
  view.innerHTML = header("Shadow", "Round complete") + `
    <div class="card center" style="padding:26px 16px">
      <div class="score">${shadowDoneCount}<span> phrases</span></div>
      <div style="font-weight:650;margin-top:4px">Said out loud</div>
      <div class="muted tiny" style="margin-top:10px">${totals.shadowReps} reps all time.</div>
    </div>
    <div class="stack" style="margin-top:16px">
      <button class="btn primary" data-shadow="again">Another round</button>
      <button class="btn ghost" data-go="practice">Back to Practice</button>
    </div>`;
}

const scoreColor = s => s >= 85 ? "var(--green)" : s >= 60 ? "var(--accent)" : "var(--red)";
function scoreCard(r){
  const verdict = r.score >= 85 ? "Nailed it" : r.score >= 60 ? "Close — keep going" : "Try that one again";
  return `
    <div class="card center" style="margin-top:12px">
      <div class="score" style="color:${scoreColor(r.score)}">${r.score}<span>%</span></div>
      <div style="font-weight:650;margin-top:2px">${verdict}</div>
      <div class="muted tiny" style="margin-top:8px">You said: “${esc(r.said)}”</div>
    </div>`;
}

function beginListening(){
  const item = shadowQ[0];
  resetAttempt();
  listening = true;
  render();
  startListening({
    partial(text){ heard = text; if(listening) render(); },
    fail(msg){ listening = false; recNote = msg; render(); },
    done(text){
      listening = false;
      if(!text){ recNote = "Didn't catch anything — try again."; return render(); }
      const r = scoreAttempt(item.ex.es, text);
      r.said = text;
      result = r;
      totals.attempts++;
      if(scores[item.c.id] == null || r.score > scores[item.c.id]){
        scores[item.c.id] = r.score;
        saveScores();
      }
      /* A scored attempt IS a rep — otherwise the mic is a side quest and only
         the manual button moves the queue. */
      if(r.score >= 60){ item.reps++; totals.shadowReps++; gotItRight(); } else gotItWrong();
      saveTotals();
      markStudied();
      checkMilestones();
      render();
    }
  });
}

/* ----- Conversations ----- */
let dlg = null;   // {d, turn, picked, right, total}

function startDialogue(id){
  const d = DIALOGUES.find(x => x.id === id);
  dlg = {d, turn: 0, picked: null, right: 0, total: d.turns.filter(t => t.who === "you").length, opts: null};
  prepDialogueTurn();
}
function prepDialogueTurn(){
  const t = dlg.d.turns[dlg.turn];
  dlg.picked = null;
  dlg.opts = t && t.who === "you" ? shuffle([t.es, ...t.wrong]) : null;
}

    ${t.who === "them" ? `

/* ----- Quick-fire: production under time pressure ----- */
/* Recall with unlimited time doesn't build the sub-second retrieval a real
   conversation needs, so this one runs on a clock. */
const DRILL_SECONDS = 5, DRILL_ROUND = 8;
let drillCard = null, drillState = "ready", drillResult = null, drillHeard = "", drillTimer = null, drillLeft = 0;
let drillRound = null;   // {done, scores[]}

function buildDrill(){
  const pool = Object.keys(srs);
  const c = byId(pool[Math.floor(Math.random()*pool.length)]);
  drillCard = {c, ex: pickExample(c, srs[c.id])};
  drillState = "ready"; drillResult = null; drillHeard = "";
}
function clearDrillTimer(){ if(drillTimer){ clearInterval(drillTimer); drillTimer = null; } }

function startDrill(){
  const {ex} = drillCard;
  drillState = "go"; drillHeard = ""; drillResult = null;
  drillLeft = DRILL_SECONDS;
  render();
  clearDrillTimer();
  drillTimer = setInterval(() => {
    drillLeft--;
    if(drillLeft <= 0){ clearDrillTimer(); stopListening(); }
    if(drillState === "go") render();
  }, 1000);

  startListening({
    partial(t){ drillHeard = t; if(drillState === "go") render(); },
    fail(msg){ clearDrillTimer(); drillState = "done"; drillResult = {blocked: msg}; render(); },
    done(text){
      clearDrillTimer();
      drillState = "done";
      if(text){
        const r = scoreAttempt(ex.es, text);
        r.said = text;
        drillResult = r;
        totals.drills = (totals.drills || 0) + 1;
        /* Kept apart from Shadow's scores: reading a sentence aloud and
           producing it cold from English are different skills, and pooling
           them would let the easier one mask the harder one. */
        const id = drillCard.c.id;
        if(drills[id] == null || r.score > drills[id]){ drills[id] = r.score; saveDrills(); }
        saveTotals(); markStudied();
        r.score >= 60 ? gotItRight() : gotItWrong();
        checkMilestones();
      }else{
        drillResult = {blocked: "Didn't catch anything — try again."};
      }
      render();
    }
  });
}

function renderDrill(){
  if(!Object.keys(srs).length){
    view.innerHTML = header("Quick-fire", "Say it fast") +
      empty("\u{26A1}", "Learn a few chunks first",
            "Producing a sentence you've never seen isn't a drill, it's a guess.") +
      `<button class="btn primary" data-go="learn">Learn some chunks</button>`;
    return;
  }
  if(!drillRound) drillRound = {done:0, scores:[]};
  if(drillRound.done >= DRILL_ROUND) return renderDrillDone();
  if(!drillCard) buildDrill();
  const {c, ex} = drillCard;
  const blocked = recProblem();
  const pct = drillState === "go" ? (drillLeft / DRILL_SECONDS) * 100 : 0;

  view.innerHTML = header("Quick-fire", `${drillRound.done + 1} of ${DRILL_ROUND} · say it fast`) + `
    <div class="card center" style="padding:24px 16px">
      <div class="sec-label" style="margin-bottom:10px">Say this in Spanish</div>
      <div style="font-size:23px;font-weight:650;line-height:1.35">${esc(ex.en)}</div>
      ${drillState === "go" ? `
        <div class="timer"><i style="width:${pct}%"></i></div>
        <div style="font-size:31px;font-weight:700;margin-top:6px;color:${drillLeft<=2?"var(--red)":"var(--accent)"}">${drillLeft}</div>
        <div class="tiny muted" style="margin-top:4px">${drillHeard ? esc(drillHeard) : "Listening…"}</div>` : ""}
      ${drillState === "done" ? `
        <div style="margin-top:16px">
          ${drillResult && drillResult.blocked
            ? `<div class="tiny" style="color:var(--accent)">${esc(drillResult.blocked)}</div>`
            : `<div class="score" style="color:${scoreColor(drillResult.score)}">${drillResult.score}<span>%</span></div>
               <div class="muted tiny" style="margin-top:6px">You said: “${esc(drillResult.said)}”</div>`}
          <div class="es" style="font-size:19px;font-weight:650;margin-top:14px">${esc(ex.es)}</div>
          <div class="muted tiny" style="margin-top:4px">${esc(c.chunk)} — ${esc(c.meaning)}</div>
          <button class="spk sm" style="margin-top:10px" data-speak="${esc(ex.es)}">\u{1F50A}</button>
        </div>` : ""}
    </div>
    <div class="stack" style="margin-top:16px">
      ${blocked ? `<div class="tiny muted center">${esc(blocked)}</div>
                   <button class="btn primary" data-drill="reveal">Show the answer</button>`
        : drillState === "ready" ? `<button class="btn primary" data-drill="start">\u{26A1} Start — ${DRILL_SECONDS}s</button>`
        : drillState === "go"    ? `<button class="btn" data-drill="stop">I'm done</button>`
        :                          `<button class="btn primary" data-drill="next">Next phrase</button>`}
      ${drillState === "done" && !blocked ? `<button class="btn ghost" data-drill="retry">Try this one again</button>` : ""}
    </div>`;
}

function renderDrillDone(){
  const s = drillRound.scores;
  const avg = s.length ? Math.round(s.reduce((a,b)=>a+b,0)/s.length) : 0;
  SFX.done();
  view.innerHTML = header("Quick-fire", "Round complete") + `
    <div class="card center" style="padding:26px 16px">
      ${s.length ? `<div class="score" style="color:${scoreColor(avg)}">${avg}<span>%</span></div>
        <div style="font-weight:650;margin-top:4px">Average, producing cold</div>`
        : `<div style="font-weight:650">Round done</div>`}
      <div class="muted tiny" style="margin-top:10px">
        ${s.filter(x=>x>=85).length} of ${DRILL_ROUND} nailed at 85% or better.</div>
    </div>
    <div class="stack" style="margin-top:16px">
      <button class="btn primary" data-drill="again">Another round</button>
      <button class="btn ghost" data-go="practice">Back to Practice</button>
    </div>`;
}

/* ----- Stats ----- */
function renderStats(){
  const deck = Object.keys(srs);
  const mastered = deck.filter(id => statusOf(id) === "mastered").length;
  const learning = deck.filter(id => statusOf(id) === "learning").length;
  const avg = a => a.length ? Math.round(a.reduce((x,y) => x+y, 0) / a.length) : 0;
  const scored  = Object.values(scores),  avgScore = avg(scored);
  const drilled = Object.values(drills),  avgDrill = avg(drilled);
  const earTrained = Object.keys(ears).length;
  const atFullSpeed = Object.values(ears).filter(l => l >= EAR_RATES.length - 1).length;

  const byCat = {};
  CHUNKS.forEach(c => {
    byCat[c.category] = byCat[c.category] || {total:0, got:0};
    byCat[c.category].total++;
    if(inDeck(c.id)) byCat[c.category].got++;
  });

  const cells = [];
  const end = new Date(); end.setHours(0,0,0,0);
  const start = new Date(end);
  start.setDate(start.getDate() - 90);
  start.setDate(start.getDate() - start.getDay());   // back up to Sunday so columns are weeks
  for(let d = new Date(start); d <= end; d.setDate(d.getDate()+1)){
    const key = dayKey(d);
    const n = streak.days[key] || 0;
    const lvl = n === 0 ? "" : n < 5 ? "l1" : n < 15 ? "l2" : n < 30 ? "l3" : "l4";
    cells.push(`<i class="${lvl}" title="${key}: ${n} reviews"></i>`);
  }

  view.innerHTML = header("Progress", "Where you're at") + `
    <div class="streak">
      <div class="flame">${liveStreak() > 0 ? "\u{1F525}" : "\u{1F331}"}</div>
      <div><b>${liveStreak()}</b><span class="muted tiny">day streak · longest run ${streak.count}</span></div>
    </div>

    <div class="stat-row" style="margin-top:12px">
      <div class="stat"><b>${deck.length}</b><span>In deck</span></div>
      <div class="stat"><b>${totals.reviews}</b><span>Reviews</span></div>
      <div class="stat"><b>${totals.shadowReps}</b><span>Out loud</span></div>
    </div>

    ${earTrained ? `
    <div class="card" style="margin-top:12px">
      <p class="sec-label">Ear training</p>
      ${EAR_RATES.map((r,i) => {
        const n = Object.values(ears).filter(l => Math.min(EAR_RATES.length-1, l) === i).length;
        return `<div class="bar-row">
          <span class="nm" style="width:64px">${EAR_LABELS[i]} ${r}×</span>
          <span class="track"><i style="width:${earTrained?(n/earTrained*100).toFixed(0):0}%;${i===EAR_RATES.length-1?"background:var(--green)":""}"></i></span>
          <span class="v">${n}</span></div>`;
      }).join("")}
      <p class="tiny muted" style="margin:8px 0 0">
        ${atFullSpeed} chunk${atFullSpeed===1?"":"s"} recognised at full speed, no text.</p>
    </div>` : ""}

    ${scored.length || drilled.length ? `
    <div class="card" style="margin-top:12px">
      <p class="sec-label">Speaking</p>
      <div class="stat-row">
        <div class="stat">
          <b style="color:${scored.length?scoreColor(avgScore):"var(--faint)"}">${scored.length?avgScore+"%":"—"}</b>
          <span>Reading aloud</span>
        </div>
        <div class="stat">
          <b style="color:${drilled.length?scoreColor(avgDrill):"var(--faint)"}">${drilled.length?avgDrill+"%":"—"}</b>
          <span>From memory</span>
        </div>
      </div>
      <p class="tiny muted" style="margin:10px 0 0">
        Shadow scores you reading a sentence you can see; Quick-fire scores you
        producing it cold. ${totals.attempts + (totals.drills||0)} attempt${totals.attempts + (totals.drills||0) === 1 ? "" : "s"} scored.</p>
    </div>` : ""}

    <div class="card" style="margin-top:12px">
      <p class="sec-label">Last 13 weeks</p>
      <div class="heat">${cells.join("")}</div>
    </div>

    <div class="card">
      <p class="sec-label">Coverage by category</p>
      ${Object.entries(byCat).sort((a,b)=>b[1].got/b[1].total - a[1].got/a[1].total).map(([k,v]) => `
        <div class="bar-row">
          <span class="nm">${CAT[k].label}</span>
          <span class="track"><i style="width:${(v.got/v.total*100).toFixed(0)}%"></i></span>
          <span class="v">${v.got}/${v.total}</span>
        </div>`).join("")}
    </div>

    <div class="card">
      <p class="sec-label">Deck health</p>
      <div class="bar-row"><span class="nm">Learning</span><span class="track"><i style="width:${deck.length?learning/deck.length*100:0}%"></i></span><span class="v">${learning}</span></div>
      <div class="bar-row"><span class="nm">Reviewing</span><span class="track"><i style="width:${deck.length?(deck.length-learning-mastered)/deck.length*100:0}%;background:var(--blue)"></i></span><span class="v">${deck.length-learning-mastered}</span></div>
      <div class="bar-row"><span class="nm">Mastered</span><span class="track"><i style="width:${deck.length?mastered/deck.length*100:0}%;background:var(--green)"></i></span><span class="v">${mastered}</span></div>
    </div>

    <button class="btn ghost" style="margin-top:12px" data-sheet="settings">Settings</button>`;
}
